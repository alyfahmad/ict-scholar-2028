function render(){const [page,p1,p2]=route();const names={home:'ড্যাশবোর্ড',chapters:'সম্পূর্ণ পাঠ্যবই',reader:'একসঙ্গে পুরো অধ্যায়',masterclass:'অধ্যায়ের মাস্টারক্লাস',lesson:'অধ্যায়ভিত্তিক পাঠ',plan:'পড়ার পরিকল্পনা',practice:'MCQ প্রশ্নব্যাংক',creative:'CQ সমাধান',labs:'Interactive Lab',cards:'Flashcards',mock:'মডেল টেস্ট',mistakes:'ভুলের খাতা',reference:'রিভিশন চিটশিট',saved:'বুকমার্ক ও নোট',sources:'সিলেবাস ও সূত্র'};$('#pageTitle').textContent=names[page]||names.home;$$('[data-route]', $('#sidebar')).forEach(b=>b.classList.toggle('active',b.dataset.route===page||((page==='lesson'||page==='reader'||page==='masterclass')&&b.dataset.route==='chapters')));$('#sidebarProgress').textContent=pct(completedTotal())+'%';$('#sideBar').style.width=pct(completedTotal())+'%';const v=$('#view');switch(page){case 'chapters':v.innerHTML=renderChapters();break;case 'reader':v.innerHTML=renderReader(Number(p1)||1);break;case 'masterclass':v.innerHTML=renderMasterclass(Number(p1)||1);break;case 'lesson':v.innerHTML=renderLesson(Number(p1)||1,Number(p2)||0);break;case 'plan':v.innerHTML=renderPlan();break;case 'practice':v.innerHTML=renderPractice();break;case 'creative':v.innerHTML=renderCreative();break;case 'labs':v.innerHTML=renderLabs();if(state.lab==='logic')runLogic();if(state.lab==='html')$('#htmlFrame').srcdoc=state.htmlEditor;break;case 'cards':v.innerHTML=renderFlash();break;case 'mock':v.innerHTML=renderMock();updateMockTimer();break;case 'saved':v.innerHTML=renderSaved();break;case 'mistakes':v.innerHTML=renderMistakes();break;case 'reference':v.innerHTML=renderReference();break;case 'sources':v.innerHTML=renderSources();break;default:v.innerHTML=renderHome();}$('#themeButton').textContent=state.theme==='dark'?'☀':'☾';document.body.classList.toggle('dark',state.theme==='dark');}
function toast(message){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${E(message)}</div>`;clearTimeout(toast._timer);toast._timer=setTimeout(()=>root.innerHTML='',3000);}
function initMock(){state.mock={items:pickMockItems(),answers:{},ends:Date.now()+25*60*1000,done:false};persist();render();window.scrollTo(0,0);}
function finishMock(){if(!state.mock||state.mock.done)return;state.mock.done=true;state.mock.ends=null;const miss=new Set(state.mistakes||[]);state.mock.items.forEach((x,i)=>{if(state.mock.answers[i]===x.q[3])miss.delete(x.i);else miss.add(x.i);});state.mistakes=[...miss];persist();render();window.scrollTo(0,0);}
function updateMockTimer(){if(!state.mock||state.mock.done)return;const remaining=Math.max(0,Math.ceil((state.mock.ends-Date.now())/1000));const node=$('#mockTimer');if(node)node.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;if(remaining<=0)finishMock();}
function handleAction(action,el){const id=el.dataset.id;switch(action){case 'complete':state.completed[id]=!state.completed[id];persist();render();break;case 'complete-reader':state.completed[id]=!state.completed[id];persist();el.textContent=state.completed[id]?'✓ সম্পন্ন':'✓ পাঠ সম্পন্ন করো';$('#sidebarProgress').textContent=pct(completedTotal())+'%';$('#sideBar').style.width=pct(completedTotal())+'%';break;case 'reader-jump':document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});break;case 'retry-mistakes':state.quizScope='wrong';state.quizAnswers={};state.quizSubmitted=false;quizListCache=null;persist();to('practice');break;case 'bookmark':state.bookmarks[id]=!state.bookmarks[id];persist();render();toast(state.bookmarks[id]?'বুকমার্কে যোগ করা হয়েছে':'বুকমার্ক সরানো হয়েছে');break;case 'print':window.print();break;case 'practice-ch':state.quizScope=el.dataset.ch;state.quizAnswers={};state.quizSubmitted=false;quizListCache=null;persist();to('practice');break;case 'quiz-answer':if(state.quizSubmitted)break;state.quizAnswers[el.dataset.q]=Number(el.dataset.a);persist();const q=el.closest('.question');$$('.option',q).forEach(b=>b.classList.toggle('selected',b===el));const items=getQuizItems();const answered=items.filter(x=>state.quizAnswers[x.i]!==undefined).length;if($('#quizCounter'))$('#quizCounter').textContent=`${answered}/${items.length} উত্তর দেওয়া হয়েছে`;break;case 'quiz-submit':{const items=getQuizItems(),score=items.filter(x=>state.quizAnswers[x.i]===x.q[3]).length;state.quizSubmitted=true;const miss=new Set(state.mistakes||[]);items.forEach(x=>{if(state.quizAnswers[x.i]===x.q[3])miss.delete(x.i);else miss.add(x.i);});state.mistakes=[...miss];state.quizAttempts.push({when:new Date().toISOString(),scope:state.quizScope,score,total:items.length});state.quizAttempts=state.quizAttempts.slice(-40);persist();render();$('#quizSummary')?.scrollIntoView({behavior:'smooth'});break;}case 'quiz-reset':state.quizAnswers={};state.quizSubmitted=false;quizListCache=null;persist();render();window.scrollTo(0,0);break;case 'cq-toggle':state.cqOpen[id]=!state.cqOpen[id];persist();render();break;case 'lab-tab':state.lab=id;persist();render();break;case 'base-run':runBase();break;case 'html-preview':if($('#htmlFrame'))$('#htmlFrame').srcdoc=$('#htmlEditor').value;toast('Preview আপডেট হয়েছে');break;case 'html-reset':state.htmlEditor=DATA.htmlSample;persist();render();break;case 'trace-run':trace();break;case 'sql-run':runSql();break;case 'sql-preset':state.sqlEditor=sqlPresets[id];persist();if($('#sqlEditor'))$('#sqlEditor').value=state.sqlEditor;runSql();break;case 'flash-flip':state.flashFlip=!state.flashFlip;persist();render();break;case 'flash-next':state.flashIndex++;state.flashFlip=false;persist();render();break;case 'flash-prev':state.flashIndex=Math.max(0,state.flashIndex-1);state.flashFlip=false;persist();render();break;case 'flash-shuffle':state.flashIndex=Math.floor(Math.random()*flashPool().length);state.flashFlip=false;persist();render();break;case 'mock-start':case 'mock-restart':initMock();break;case 'mock-answer':if(!state.mock||state.mock.done)break;state.mock.answers[el.dataset.q]=Number(el.dataset.a);persist();$$('.option',el.closest('.question')).forEach(b=>b.classList.toggle('selected',b===el));break;case 'mock-submit':finishMock();break;case 'export':{const blob=new Blob([JSON.stringify({app:'ICT Scholar 2028',version:2,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ict-scholar-2028-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case 'import':$('#importFile')?.click();break;}}
function searchOpen(){const root=$('#modalRoot');root.innerHTML=`<div class="search-modal" id="searchBackdrop"><div class="search-inner" role="dialog" aria-modal="true" aria-label="পাঠ খুঁজুন"><div class="row between"><h3 style="margin:0">🔎 পাঠ্যবইয়ের ৭১টি পাঠে খুঁজুন</h3><button class="iconbtn" id="closeSearch">×</button></div><input id="searchInput" class="input" autofocus placeholder="যেমন: De Morgan, Binary, বায়োমেট্রিক্স..." style="margin:14px 0"><div id="searchResults"></div></div></div>`;$('#searchInput').focus();searchResults('');}
function searchResults(query){const q=query.trim().toLowerCase();const results=q?ALL.filter(l=>(l.title+' '+l.search).toLowerCase().includes(q)).slice(0,25):ALL.slice(0,9);$('#searchResults').innerHTML=results.length?results.map(l=>`<button class="search-hit" data-route="lesson/${l.ch}/${l.index}"><b>${E(l.title)}</b><small>অধ্যায় ${l.ch} · পাঠ ${l.index+1} · ${l.minutes} মিনিট</small></button>`).join(''):`<div class="empty">এই শব্দে কোনো পাঠ পাওয়া যায়নি। অন্য Keyword চেষ্টা করো।</div>`;}
$('#menuButton').onclick=()=>document.body.classList.toggle('menu-open');$('#scrim').onclick=()=>document.body.classList.remove('menu-open');$('#themeButton').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render();};$('#searchButton').onclick=searchOpen;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen();}if(e.key==='Escape')$('#modalRoot').innerHTML='';if((e.key==='Enter'||e.key===' ')&&e.target?.classList?.contains('flash')){e.preventDefault();state.flashFlip=!state.flashFlip;persist();render();}});
document.addEventListener('click',e=>{if(e.target.id==='closeSearch'||e.target.id==='searchBackdrop'){$('#modalRoot').innerHTML='';return;}const r=e.target.closest('[data-route]');if(r){const path=r.dataset.route;$('#modalRoot').innerHTML='';to(path);return;}const b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action,b);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.task){state.tasks[el.dataset.task]=el.checked;persist();return;}if(el.id==='quizScope'){state.quizScope=el.value;state.quizAnswers={};state.quizSubmitted=false;quizListCache=null;persist();render();return;}if(el.id==='cqScope'){state.cqChapter=el.value;persist();render();return;}if(el.id==='flashScope'){state.flashCh=el.value;state.flashIndex=0;state.flashFlip=false;persist();render();return;}if(['gate','inputA','inputB'].includes(el.id)){runLogic();return;}if(el.id==='traceType'){if($('#traceCode'))$('#traceCode').textContent=sourceCodes[el.value];return;}if(el.id==='importFile'&&el.files[0]){const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(parsed.app!=='ICT Scholar 2028'||!parsed.state)throw Error('Invalid backup');if(!confirm('এই Backup Restore করলে বর্তমান Progress বদলে যাবে। চালিয়ে যাবে?'))return;state={...defaultState(),...parsed.state,mock:null};persist();render();toast('Backup Restore সম্পন্ন');}catch(_err){toast('ফাইলটি সঠিক ICT Scholar Backup নয়।');}};reader.readAsText(el.files[0]);}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.note){state.notes[el.dataset.note]=el.value;persist();}if(el.dataset.cqnote){state.cqDrafts[el.dataset.cqnote]=el.value;persist();}if(el.id==='htmlEditor'){state.htmlEditor=el.value;persist();}if(el.id==='sqlEditor'){state.sqlEditor=el.value;persist();}if(el.id==='searchInput')searchResults(el.value);});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
// Initial render and running timer; saves are local-only. 
render();tickHandle=setInterval(updateMockTimer,1000);

const svgNode=(x,y,label,accent=false)=>`<g><circle cx="${x}" cy="${y}" r="18" fill="${accent?'#565fd4':'#dce8ff'}" stroke="${accent?'#565fd4':'#97afd6'}" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="bold" fill="${accent?'white':'#263a67'}">${label}</text></g>`;
const svglines=(pts)=>pts.map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="#839cd6" stroke-width="3" stroke-linecap="round"/>`).join('');
function topologySvg(type){let pts=[],nodes=[];if(type==='star'){pts=[[170,90,55,37],[170,90,285,37],[170,90,55,143],[170,90,285,143]];nodes=[[170,90,'S',true],[55,37,'1'],[285,37,'2'],[55,143,'3'],[285,143,'4']];}
else if(type==='bus'){pts=[[35,90,305,90],[68,90,68,35],[135,90,135,35],[205,90,205,35],[275,90,275,35]];nodes=[[68,35,'1'],[135,35,'2'],[205,35,'3'],[275,35,'4']];}
else if(type==='ring'){pts=[[170,30,290,90],[290,90,170,150],[170,150,50,90],[50,90,170,30]];nodes=[[170,30,'1'],[290,90,'2'],[170,150,'3'],[50,90,'4']];}
else {pts=[[80,35,260,35],[80,35,80,145],[80,35,260,145],[260,35,80,145],[260,35,260,145],[80,145,260,145]];nodes=[[80,35,'1'],[260,35,'2'],[80,145,'3'],[260,145,'4']];}
return `<svg class="concept-svg" viewBox="0 0 340 190" role="img" aria-label="${E(type)} network topology"><rect width="340" height="190" rx="18" fill="#f1f6ff"/>${svglines(pts)}${nodes.map(p=>svgNode(...p)).join('')}</svg>`;}

function visualNetwork(){const names={star:'Star',bus:'Bus',ring:'Ring',mesh:'Full Mesh'};const explain={star:'সব কম্পিউটার একটি কেন্দ্রীয় Switch/Hub-এ যুক্ত। একটি প্রান্তিক Cable নষ্ট হলেও অন্যগুলো সাধারণত কাজ করতে পারে, তবে কেন্দ্রীয় Device নষ্ট হলে যোগাযোগ বন্ধ হতে পারে।',bus:'সব Node একটি Backbone Cable ব্যবহার করে। Backbone নষ্ট হলে নেটওয়ার্কে সমস্যা হয়।',ring:'Node গুলো বৃত্তাকারে সংযুক্ত। প্রচলিত একক Ring-এ সংযোগ বিচ্ছিন্ন হলে যোগাযোগ ব্যাহত হতে পারে।',mesh:'প্রতিটি Node অন্য সব Node-এর সঙ্গে সরাসরি যুক্ত। বিকল্প পথ থাকে, কিন্তু অনেক Cable লাগে।'};return `<div class="visual-lab"><div class="diagram-frame">${topologySvg(playgroundState.topology)}</div><div class="visual-controls">${Object.keys(names).map(k=>`<button class="filter-chip ${playgroundState.topology===k?'on':''}" data-play="topology" data-value="${k}">${names[k]}</button>`).join('')}</div><div class="visual-explain"><b>${names[playgroundState.topology]} Topology:</b> ${explain[playgroundState.topology]}</div></div>`;}
function visualBits(){const val=playgroundState.baseBits.reduce((v,b)=>v*2+b,0);return `<div class="visual-lab"><div class="bit-result"><div><span class="eyebrow">DECIMAL VALUE</span><strong>${val}</strong></div><div><span class="eyebrow">BINARY VALUE</span><strong class="binary-string">${playgroundState.baseBits.join('')}</strong></div></div><div class="bit-grid">${playgroundState.baseBits.map((b,i)=>`<button data-play="toggle-bit" data-value="${i}" class="bit ${b?'bit-on':''}" aria-label="${2**(7-i)} এর Bit ${b}; বদলাতে চাপো"><span class="bit-weight">${2**(7-i)}</span><span class="bit-value">${b}</span></button>`).join('')}</div><p class="micro">প্রতিটি ১ তার উপরের স্থানমান যোগ করে। যেমন 128 + 16 + 8 + 1 = 153। এখন নিজে সুইচ টিপে <b>42</b> বানিয়ে দেখো!</p>${val===42?`<div class="bit-success">🎉 বাহ! 42 = 00101010 — ঠিক ধরেছ। এবার 73 বানিয়ে দেখবে?</div>`:""}<div class="visual-controls"><button class="btn tiny secondary" data-play="bits-preset" data-value="42">42 বানাও</button><button class="btn tiny secondary" data-play="bits-preset" data-value="255">সব ১</button><button class="btn tiny secondary" data-play="bits-preset" data-value="0">Reset</button></div><div class="visual-explain">💡 <b>Binary বোঝার শর্টকাট:</b> ডান থেকে স্থানমান 1, 2, 4, 8, 16... প্রতিটি পজিশন দ্বিগুণ হয়।</div></div>`;}
function visualHTML(){const parts=[['html','&lt;html&gt;','পুরো ডকুমেন্টের মূল Element'],['head','&lt;head&gt;','Title ও Metadata থাকে; সাধারণত মূল পেজে দেখায় না'],['title','&lt;title&gt;','Browser Tab-এ যে Title দেখা যায়'],['body','&lt;body&gt;','পেজে দেখা যায় এমন Content থাকে'],['h1','&lt;h1&gt;','সবচেয়ে গুরুত্বপূর্ণ Heading'],['p','&lt;p&gt;','একটি Paragraph']];const active=parts.find(p=>p[0]===playgroundState.webPart)||parts[3];return `<div class="visual-lab"><div class="html-tree"><div class="html-branch"><button class="html-node ${playgroundState.webPart==='html'?'on':''}" data-play="htmlpart" data-value="html">&lt;html&gt;</button><div class="tree-children"><div class="html-branch"><button class="html-node ${playgroundState.webPart==='head'?'on':''}" data-play="htmlpart" data-value="head">&lt;head&gt;</button><div class="tree-children"><button class="html-node ${playgroundState.webPart==='title'?'on':''}" data-play="htmlpart" data-value="title">&lt;title&gt;</button></div></div><div class="html-branch"><button class="html-node ${playgroundState.webPart==='body'?'on':''}" data-play="htmlpart" data-value="body">&lt;body&gt;</button><div class="tree-children"><button class="html-node ${playgroundState.webPart==='h1'?'on':''}" data-play="htmlpart" data-value="h1">&lt;h1&gt;</button><button class="html-node ${playgroundState.webPart==='p'?'on':''}" data-play="htmlpart" data-value="p">&lt;p&gt;</button></div></div></div></div></div><div class="visual-explain"><b>${active[1]}</b> — ${active[2]}। <span class="micro">উপরের Tag-এ ক্লিক করে অন্য অংশের কাজ দেখো।</span></div></div>`;}
function visualLoop(){const n=5,s=playgroundState.loopStep,items=Array.from({length:s},(_,i)=>i+1),sum=items.reduce((a,b)=>a+b,0);return `<div class="visual-lab"><div class="loop-dash"><div><span class="eyebrow">CURRENT i</span><strong>${s===5?'Done':s+1}</strong></div><div><span class="eyebrow">SUM SO FAR</span><strong>${sum}</strong></div><div><span class="eyebrow">ITERATIONS</span><strong>${s}/5</strong></div></div><div class="loop-steps">${[1,2,3,4,5].map(x=>`<span class="loop-step ${x<=s?'done':''}">${x<=s?'✓':x}</span>`).join('')}</div><pre class="loop-code">int sum = 0;\nfor (int i = 1; i <= 5; i++) {\n    sum = sum + i;\n}</pre><p class="micro">${s===0?'শুরুতে sum = 0। “পরের ধাপ” চাপলে প্রথম সংখ্যা যোগ হবে।':s===5?'সব ধাপ শেষ! ১+২+৩+৪+৫ = ১৫।':'এখন পর্যন্ত '+items.join(' + ')+' = '+sum+'। আবার চাপলে পরের সংখ্যা যোগ হবে।'}</p><div class="visual-controls"><button class="btn tiny" data-play="loop-next" ${s===5?'disabled':''}>▶ পরের ধাপ</button><button class="btn tiny secondary" data-play="loop-reset">↺ আবার শুরু</button></div></div>`;}
function visualDatabase(){const id=playgroundState.student,students=[{id:101,name:'রিমা'},{id:102,name:'রাহিম'},{id:103,name:'সাদিয়া'}],results=[{student:101,subject:'ICT',score:92},{student:101,subject:'Math',score:88},{student:102,subject:'ICT',score:81},{student:103,subject:'ICT',score:95}];const current=students.find(x=>x.id===id);return `<div class="visual-lab"><div class="db-columns"><div><h4>Students Table</h4><div class="db-header"><span>StudentID 🔑</span><span>Name</span></div>${students.map(s=>`<button class="db-row ${s.id===id?'selected':''}" data-play="student" data-value="${s.id}"><span>${s.id}</span><span>${s.name}</span></button>`).join('')}</div><div><h4>Results Table</h4><div class="db-header"><span>StudentID ↗</span><span>Subject</span><span>Mark</span></div>${results.map(r=>`<div class="db-row static ${r.student===id?'selected':'faded'}"><span>${r.student}</span><span>${r.subject}</span><span>${r.score}</span></div>`).join('')}</div></div><div class="visual-explain"><b>${current.name} (${id})</b> নির্বাচন করা হয়েছে। Results Table-এ এই StudentID-এর <b>${results.filter(r=>r.student===id).length}টি</b> Record আছে। এটাই One-to-Many Relationship-এর একটি উদাহরণ।</div></div>`;}
const visualRenderers={1:visualWorld,2:visualNetwork,3:visualBits,4:visualHTML,5:visualLoop,6:visualDatabase};
function visualBlock(ch,compact=false){return `<section class="concept-playground ${compact?'compact':''}"><div class="concept-heading"><div class="concept-icon">${chapterMeta(ch).icon}</div><div><span class="eyebrow">ছবি দেখে, নিজে করে শেখো</span><h3>${E(visualNames[ch])}</h3><p>${E(visualSub[ch])}</p></div></div><div class="visual-stage" data-visual-stage="${ch}">${visualRenderers[ch]()}</div>${compact?`<button class="text-link" data-route="visuals">আরও ভিজ্যুয়াল এক্সপেরিমেন্ট দেখো ↗</button>`:''}</section>`;}
function renderVisuals(){return `<div class="kicker">LEARN BY DOING · VISUAL PLAYGROUND</div><h1>🪄 দেখে, ছুঁয়ে, নিজে করে শিখো</h1><p class="lead">ছবি শুধু সাজানোর জন্য নয়। প্রতিটি বোতাম, সুইচ ও ধাপ চাপলে ফল বদলাবে। চেষ্টা করতে ভয় নেই—ভুল করেও এখানে শিখতে পারবে।</p><div class="visual-picker">${CLASSES.map(c=>`<button class="visual-choice ${playgroundState.ch===c.id?'selected':''}" data-play="choose-visual" data-value="${c.id}"><span>${c.icon}</span><b>অধ্যায় ${c.id}</b></button>`).join('')}</div>${visualBlock(playgroundState.ch)}<div class="friend-tip">🌟 <b>এখন তোমার পালা:</b> Activity-তে একটি মান বদলাও। কী পরিবর্তন হলো সেটা নিজের ভাষায় বলো। তারপর <button class="link-inline" data-route="chapters">পাঠ্যে ফিরে যাও</button>।</div>`;}

const originalLesson=renderLesson,originalReader=renderReader,originalHome=renderHome,originalChapters=renderChapters,originalRender=render;
renderLesson=function(ch,index){const l=chapterLessons(ch)[Math.min(Math.max(0,Number(index)||0),chapterLessons(ch).length-1)];if(!l)return originalLesson(ch,index);let html=originalLesson(ch,index);
html=html.replace(`<h1>${E(l.title)}</h1>`,`<h1>${E(l.title)}</h1>${warmupHTML(l)}`);
const anchor=`<div class="lesson-text">${l.html}</div>`;
if(html.includes(anchor))html=html.replace(anchor,anchor+((l.index===0||({1:[3,7],2:[9],3:[9],4:[3,7],5:[9],6:[3]}[ch]||[]).includes(l.index))?visualBlock(ch,true):'')+lessonVideos(l));
const marker='<div class="lesson-actions">';html=html.replace(marker,lessonCheck(l)+marker);
return html;};
renderReader=function(ch){let html=originalReader(ch);const pre=`<div class="reader-welcome"><span class="eyebrow">আজকের গল্প</span><p>${E(friendlyIntros[ch]?.[0]||'চলো, একসঙ্গে শিখি!')}</p><div class="micro">একবারে সব মুখস্থ করতে হবে না। ধারণা → উদাহরণ → অনুশীলন: এই ৩ ধাপেই এগোও।</div></div>${visualBlock(ch,true)}<div class="reader-videos"><h3>🎥 অধ্যায়টির সহায়ক ভিডিও</h3>${watchList.filter(v=>v.ch===ch).slice(0,3).map(v=>`<a href="${E(v.url)}" target="_blank" rel="noopener noreferrer">▶ ${E(v.title)} ↗</a>`).join('')}<small>ভিডিও দেখতে ইন্টারনেট লাগবে।</small></div>`;
const marker='<div class="callout no-print"><h3>অধ্যায়ের সূচিপত্র</h3>';if(html.includes(marker))html=html.replace(marker,pre+marker);
// In book mode, every section also has a relatable situation and a self-check.
for(const l of chapterLessons(ch)){
 const lessonMarker=`<div class="lesson-text">${l.html}</div>`;
 const story=`<div class="reader-mini-story"><span>💬 বাস্তব জীবনে ভাবো</span><p>${E(friendlyIntros[ch]?.[l.index]||'এবার বিষয়টি নিজের বাস্তব উদাহরণ দিয়ে বোঝো।')}</p></div>`;
 if(html.includes(lessonMarker))html=html.replace(lessonMarker,story+lessonMarker+lessonCheck(l)+lessonVideos(l));
}
return html;};
renderChapters=function(){return `<div class="friend-tip">👋 <b>কীভাবে পড়বে?</b> প্রথমে একটি Topic খুলো। ছোট গল্প পড়ে ধারণা তৈরি করো, Visual Activity-তে নিজে করো, তারপর প্রশ্নের উত্তর দাও।</div><div class="row wrap" style="margin-bottom:20px">${navButton('🪄 ছবি ও Activity','visuals')}${navButton('🎥 ভিডিও ক্লাস','videos')}</div>`+originalChapters();};
renderHome=function(){let html=originalHome();const insert=`<section class="welcome-path"><div><span class="eyebrow">HEY, FUTURE A+ STUDENT ✨</span><h2>পড়া যেন শাস্তি না লাগে—চলো, মজা করে বুঝি।</h2><p>তুমি একদম নতুন হলেও সমস্যা নেই। প্রতিটি বিষয়ের আগে ছোট্ট গল্প, তারপর নিজের হাতে Activity, শেষে প্রশ্নের উত্তর। ভুল করলে এখানেই আবার চেষ্টা করবে।</p></div><div class="row wrap">${navButton('🪄 একটু খেলে শিখি','visuals','primary')}${navButton('🎥 ভিডিও ক্লাসরুম','videos')}</div></section><div class="study-steps"><div><span>01</span><b>আগে গল্পটা বোঝো</b><small>কেন শিখছি, জীবনে কোথায় লাগে?</small></div><div><span>02</span><b>নিজে Activity করো</b><small>Bit, Topology, Loop—বোতাম টিপে দেখো</small></div><div><span>03</span><b>উত্তর লিখে মিলাও</b><small>MCQ ও CQ—ভুল থেকেই উন্নতি</small></div></div>`;
return html.replace('${not-a-real-anchor}', '') .replace(/(<\/section>)(<div class="notice")/,`$1${insert}$2`);};
render=function(){const [page]=route();if(page==='visuals'||page==='videos'){
 originalRender();$('#view').innerHTML=page==='visuals'?renderVisuals():renderVideos();$('#pageTitle').textContent=page==='visuals'?'Visual Playground':'ভিডিও ক্লাসরুম';$$('[data-route]',$('#sidebar')).forEach(b=>b.classList.toggle('active',b.dataset.route===page));return;}
 originalRender();};

function refreshVisual(ch){document.querySelectorAll(`[data-visual-stage="${ch}"]`).forEach(node=>node.innerHTML=visualRenderers[ch]());}
document.addEventListener('click',event=>{const btn=event.target.closest('[data-play]');if(!btn)return;const action=btn.dataset.play,value=btn.dataset.value;
if(action==='video-filter'){activeVideoChapter=value;render();return;}
if(action==='choose-visual'){playgroundState.ch=Number(value);render();return;}
if(action==='reveal-check'){const el=btn.closest('.quick-check')?.querySelector('.quick-answer');if(el){el.hidden=!el.hidden;btn.textContent=el.hidden?'👀 উত্তর মিলিয়ে দেখি':'উত্তর লুকিয়ে আবার ভাবি';}return;}
if(action==='world'){playgroundState.world=value;refreshVisual(1);return;}
if(action==='topology'){playgroundState.topology=value;refreshVisual(2);return;}
if(action==='toggle-bit'){const i=Number(value);playgroundState.baseBits[i]^=1;refreshVisual(3);return;}
if(action==='bits-preset'){const n=Number(value);playgroundState.baseBits=Array.from({length:8},(_,i)=>n>>(7-i)&1);refreshVisual(3);return;}
if(action==='htmlpart'){playgroundState.webPart=value;refreshVisual(4);return;}
if(action==='loop-next'){playgroundState.loopStep=Math.min(5,playgroundState.loopStep+1);refreshVisual(5);return;}
if(action==='loop-reset'){playgroundState.loopStep=0;refreshVisual(5);return;}
if(action==='student'){playgroundState.student=Number(value);refreshVisual(6);return;}
});
// Refresh the first route after adding the experience layer.
render();

const focusScore=ch=>{
 const total=MAX_COUNTS[ch]||1;
 const incomplete=1-finishedCh(ch)/total;
 return (prof().focus.includes(ch)?3:0)+chapterErrorCount(ch)*1.25+incomplete*1.4;
};
const prioritizedChapters=()=>CLASSES.map(c=>c.id).sort((a,b)=>focusScore(b)-focusScore(a));
const nextForChapter=ch=>chapterLessons(ch).find(l=>!state.completed[l.id])||chapterLessons(ch)[0];
const nextFocus=()=>{const ch=prioritizedChapters().find(ch=>chapterLessons(ch).some(l=>!state.completed[l.id]))||prioritizedChapters()[0];return nextForChapter(ch)};
const weakText=()=>prof().focus.length?prof().focus.map(n=>`অধ্যায় ${n}`).join(', '):'এখনো নির্দিষ্ট করা হয়নি';

function recommendVideo(){const order=prioritizedChapters();const vids=editorialVideos.filter(v=>!videoWatched(v.id));return order.flatMap(ch=>vids.filter(v=>v.ch===ch)).sort((a,b)=>{
 const f=v=>v.format===prof().videoStyle?2:0;
 return f(b)-f(a);
})[0]||editorialVideos[0];}
function learnerHub(){const p=prof(),l=nextFocus(),m=Number(p.daily),review=m<=45?5:15,practice=Math.min(m-review-8,(m<=45?10:m>=120?35:20)+(Number(p.target)>=95?8:0)+(p.level==='comfortable'?10:p.level==='beginner'?-2:0)),learn=m-practice-review,v=recommendVideo(),score=lastQuiz();const hello=p.name?`${E(p.name)}, আজকের ফোকাস`:'আজকের ফোকাস';return `<section class="learner-hub"><div class="learner-hub-top"><div><div class="kicker">YOUR LEARNING STRATEGY · HSC 2028</div><h2>${hello}</h2><p>${p.target}+ লক্ষ্য · প্রতিদিন ${m} মিনিট · ${p.level==='beginner'?'Fundamentals first':p.level==='some'?'Concept + application':'Exam practice priority'} · ${E(interestLabel[p.interest])}</p></div><button class="btn secondary tiny" data-route="profile">Edit learning profile ↗</button></div><div class="personal-columns"><div class="personal-next"><span class="eyebrow">NEXT LESSON · CHAPTER ${l.ch}</span><h3>${E(l.title)}</h3><p>এই Topic এখন অগ্রাধিকার পাচ্ছে: ${p.focus.includes(l.ch)?'নিজের দেওয়া দুর্বল অধ্যায়':'অসম্পূর্ণ পাঠ / অনুশীলনের প্রয়োজন'}।</p><div class="session-breakdown"><span>${learn}m · Concept</span><span>${practice}m · Practice</span><span>${review}m · Recall</span></div><div class="row wrap">${navButton('এই পাঠ শুরু করো →',`lesson/${l.ch}/${l.index}`,'primary')}<button class="btn tiny secondary" data-route="plan">৭ দিনের রুটিন</button></div></div><div class="personal-metrics"><div><span>পাঠ শেষ</span><strong>${completedTotal()}<small> / 71</small></strong></div><div><span>ভুল MCQ</span><strong>${mistakeCount()}</strong></div><div><span>সর্বশেষ MCQ</span><strong>${score?Math.round(score.score/score.total*100)+'%':'—'}</strong></div><div class="personal-video"><span>RECOMMENDED VIDEO</span><b>${E(v.title)}</b><small>${E(v.creator)} · ${v.minutes} min</small><button class="text-link" data-route="videos">ভিডিওটি খুঁজে দেখো ↗</button></div></div></div></section>`;}
function studySequence(){const p=prof(),m=Number(p.daily),chOrder=prioritizedChapters(),sessions=[];for(let d=0;d<7;d++){
 const ch=chOrder[d%chOrder.length],ls=chapterLessons(ch),cur=ls.filter(l=>!state.completed[l.id]),topic=(cur.length?cur:ls)[d%Math.max(1,(cur.length?cur:ls).length)],review=d===6;
 sessions.push({day:d+1,ch,topic:topic.title,id:topic.id,index:topic.index,review,quiz:d===2||d===5||d===6});}
 const weekly=m*7,approx=Math.round(ALL.reduce((s,l)=>s+l.minutes,0)*1.7/m);
 return `<section class="personal-week"><div class="row between wrap"><div><div class="kicker">PERSONALIZED ROUTINE</div><h2>তোমার পরবর্তী ৭ দিনের রুটিন</h2></div><span class="tag">${m} min/day · ${weekly} min/week</span></div><p class="muted">দুর্বল অধ্যায়, শেষ করা পাঠ ও ভুল প্রশ্ন দেখে অগ্রাধিকার সাজানো হয়েছে। আনুমানিক পূর্ণ Course + Practice-এর জন্য ${approx}টি Study Session লাগতে পারে; এটি কোনো পরীক্ষার ফলের পূর্বাভাস নয়।</p><div class="routine-grid">${sessions.map(s=>`<article class="routine-day"><span>SESSION ${s.day}</span><h3>${s.review?'Review + timed test':`অধ্যায় ${s.ch}`}</h3><p>${s.review?'গত ছয় সেশনের মূল ধারণা ও ভুল প্রশ্ন আবার যাচাই করো।':E(s.topic)}</p><div class="routine-meta">${m} মিনিট · ${s.quiz?'MCQ + Recall':'Concept + Practice'}</div><button class="text-link" data-route="${s.review?'mock':`lesson/${s.ch}/${s.index}`}">${s.review?'Model test →':'Open lesson →'}</button></article>`).join('')}</div><p class="micro">আগে নির্ধারিত ৫ দিনের Crash Sprint-ও নিচে আছে। নিয়মিত ৯০+ প্রস্তুতির জন্য এই রুটিনটি বেশি বাস্তবসম্মত।</p></section>`;
}

renderChapters=function(){const l=nextFocus();return `<div class="chapter-recommend"><div><span class="eyebrow">RECOMMENDED START</span><b>অধ্যায় ${l.ch} · ${E(l.title)}</b><p>অধ্যায় নির্বাচন করতে পারো, অথবা Personalized Priority থেকে শুরু করতে পারো।</p></div><button class="btn tiny" data-route="lesson/${l.ch}/${l.index}">Start lesson →</button></div><div class="row wrap" style="margin:16px 0">${navButton('Interactive concept labs','visuals')}${navButton('Curated videos','videos')}</div>`+originalChapters();};
visualBlock=function(ch,compact=false){return `<section class="concept-playground ${compact?'compact':''}"><div class="concept-heading"><div class="concept-icon">${chapterMeta(ch).icon}</div><div><span class="eyebrow">INTERACTIVE DEMONSTRATION</span><h3>${E(visualNames[ch])}</h3><p>${E(visualSub[ch])}</p></div></div><div class="visual-stage" data-visual-stage="${ch}">${visualRenderers[ch]()}</div>${compact?`<button class="text-link" data-route="visuals">Open all concept labs ↗</button>`:''}</section>`;};
renderVisuals=function(){return `<div class="kicker">INTERACTIVE CONCEPT LABS"</div><h1>Explore the ideas behind the syllabus</h1><p class="lead">সংখ্যা, নেটওয়ার্ক, HTML, Loop ও Database—শুধু Diagram দেখে নয়, Input বদলে Result পর্যবেক্ষণ করো। এরপর কেন পরিবর্তন হলো সেটি ব্যাখ্যা করার চেষ্টা করো।</p><div class="visual-picker">${CLASSES.map(c=>`<button class="visual-choice ${playgroundState.ch===c.id?'selected':''}" data-play="choose-visual" data-value="${c.id}"><span class="visual-choice-number">0${c.id}</span><b>Chapter ${c.id}</b></button>`).join('')}</div>${visualBlock(playgroundState.ch)}<div class="friend-tip"><b>Practice prompt:</b> Input বদলানোর আগে Result অনুমান করো। তারপর Output-এর সঙ্গে মিলিয়ে দেখো। ${navButton('Explore full lessons','chapters')}</div>`;};
// Reader keeps all original lessons and worked examples and adds concise context.
renderReader=function(ch){let html=originalReader(ch);const top=`<div class="reader-welcome"><span class="eyebrow">CHAPTER OVERVIEW</span><p>${E(friendlyIntros[ch]?.[0]||'প্রথমে মূল ধারণা, তারপর প্রয়োগ ও পরীক্ষা।')}</p><div class="micro">প্রস্তাবিত ক্রম: Concept → Worked Example → Active Recall → CQ.</div></div>${visualBlock(ch,true)}<div class="reader-videos"><h3>Concept videos for this chapter</h3>${watchList.filter(v=>v.ch===ch).slice(0,3).map(v=>`<a href="${E(v.url)}" target="_blank" rel="noopener noreferrer">${E(v.title)} · ${E(v.creator)} ↗</a>`).join('')}<small>English audio · Internet required</small></div>`;
const mark='<div class="callout no-print"><h3>অধ্যায়ের সূচিপত্র</h3>';if(html.includes(mark))html=html.replace(mark,top+mark);
for(const l of chapterLessons(ch)){const anchor=`<div class="lesson-text">${l.html}</div>`;if(html.includes(anchor))html=html.replace(anchor,warmupHTML(l)+anchor+lessonCheck(l)+lessonVideos(l));}return html;};
const basePlan=renderPlan;
renderPlan=function(){return studySequence()+`<details class="old-plan"><summary>Original 5-day Sprint & 16-week mastery outline</summary>${basePlan()}</details>`;};
function profilePage(){const p=prof(),remaining=Math.max(0,71-completedTotal());return `<div class="kicker">SETTINGS · PERSONALIZATION</div><h1>Your learning profile</h1><p class="lead">এটি একটি ব্যক্তিগত Study Workspace। কোনো Account তৈরি করতে হবে না। তোমার পছন্দ অনুযায়ী Chapter Priority, Session Length, Examples ও Video Picks পরিবর্তিত হয়।</p><div class="profile-page-layout"><div class="card pad"><h2>Learning preferences</h2>${learnerForm()}</div><aside class="card pad profile-insight"><div class="kicker">CURRENT SNAPSHOT</div><h3>${E(p.name||'Student')} · HSC 2028</h3><p>Target: <strong>${E(p.target)}+</strong></p><p>Daily session: <strong>${E(p.daily)} minutes</strong></p><p>Focus chapters: <strong>${E(weakText())}</strong></p><p>Incomplete lessons: <strong>${remaining}</strong></p><div class="divider"></div><strong>How recommendations work</strong><p>নিজে নির্ধারিত দুর্বল অধ্যায়, অসম্পূর্ণ পাঠ ও ভুল MCQ-এর সংখ্যা অনুযায়ী Priority বদলায়। এটি কোনো AI Diagnosis নয়।</p><button class="btn secondary" data-route="plan">View my routine →</button></aside></div>`;}

const previouslyEnhancedRender=render;
render=function(){const [page]=route();previouslyEnhancedRender();if(page==='profile'){
 $('#view').innerHTML=profilePage();$('#pageTitle').textContent='Learning profile';
 $$('[data-route]',$('#sidebar')).forEach(b=>b.classList.toggle('active',b.dataset.route===page));
}
const top=$('.top-badge');if(top)top.textContent=`TARGET ${prof().target}+ / HSC 2028`;
const title=$('#pageTitle');if(page==='videos'&&title)title.textContent='Curated videos';if(page==='visuals'&&title)title.textContent='Interactive labs';
};
function openProfileSetup(){if(prof().onboarded)return;$('#modalRoot').innerHTML=`<div class="setup-modal-backdrop"><div class="setup-modal" role="dialog" aria-modal="true" aria-labelledby="profileWelcome"><div class="row between"><span class="eyebrow">ICT SCHOLAR 2028 · YOUR COURSE</span><button class="iconbtn" data-personal="skip" aria-label="Skip setup">×</button></div><h2 id="profileWelcome">A better way to prepare starts with your priorities.</h2><p class="muted">নাম ছাড়াও চলবে। মাত্র কয়েকটি পছন্দ জানালে Website তোমার পড়ার সময়, দুর্বল অধ্যায় ও Learning Style অনুযায়ী সাজাবে।</p>${learnerForm(true)}</div></div>`;}

// The initial setup can be skipped. Returning students are not interrupted.
render();
if(!prof().onboarded)setTimeout(()=>{if(!prof().onboarded)openProfileSetup()},220);
document.addEventListener('submit',event=>{if(event.target.id!=='learnerForm')return;event.preventDefault();const form=event.target,fd=new FormData(form);const name=String(fd.get('name')||'').trim().slice(0,32);const focus=fd.getAll('focus').map(Number).filter(n=>n>=1&&n<=6);state.profile={...prof(),name,target:String(fd.get('target')||'90'),level:String(fd.get('level')||'beginner'),daily:String(fd.get('daily')||'60'),interest:String(fd.get('interest')||'apps'),lang:String(fd.get('lang')||'balanced'),videoStyle:String(fd.get('videoStyle')||'visual'),focus,onboarded:true};persist();$('#modalRoot').innerHTML='';to('home');render();toast('Learning profile saved · Recommendations updated');});
document.addEventListener('click',e=>{const b=e.target.closest('[data-personal]');if(!b)return;const action=b.dataset.personal;if(action==='skip'){state.profile.onboarded=true;persist();$('#modalRoot').innerHTML='';render();return;}if(action==='watched'){const id=b.dataset.id;const had=videoWatched(id);state.profile.watched=had?prof().watched.filter(x=>x!==id):[...prof().watched,id];persist();render();toast(had?'Removed from watched list':'Video marked as watched');}});

<script>
/* ICT Scholar 2028 — Focus Feed. Local-first, finite sessions, no fabricated social activity. */
(function(){
 'use strict';
 const SF_LIMIT=8;
 const SF_TITLES={1:'Technology in society',2:'Networks & communication',3:'Numbers & digital logic',4:'The web & HTML',5:'Programming in C',6:'Database systems'};
 const SF_THEME={1:['#3e4a91','#293c69'],2:['#1d637f','#143e5b'],3:['#584bb1','#322967'],4:['#a55466','#683c5b'],5:['#206f64','#174840'],6:['#83632e','#524327']};
 function sfState(){
  if(!state.focusFeed||typeof state.focusFeed!=='object')state.focusFeed={session:0,scope:'for-you',ids:[],answers:{},seen:{},useful:{},slide:{},notes:{}};
  let f=state.focusFeed;
  if(!f.answers)f.answers={};if(!f.seen)f.seen={};if(!f.useful)f.useful={};if(!f.slide)f.slide={};if(!f.notes)f.notes={};
  return f;
 }
 function sfRng(ids){return ids.filter(Boolean);}
 function sfNewIds(){
  const f=sfState(), chs=f.scope==='for-you'?prioritizedChapters():[Number(f.scope)];
  const lists=chs.map(ch=>({ch,ls:chapterLessons(ch).filter(l=>!state.completed[l.id])}));
  const pool=[];
  // A student's own weak chapters are prioritized, while the feed still visits other subjects.
  let progress=true;
  while(progress&&pool.length<71){progress=false;for(const it of lists){if(it.ls.length){pool.push(it.ls.shift());progress=true;}}}
  if(pool.length<SF_LIMIT){for(const l of chs.flatMap(ch=>chapterLessons(ch))){if(!pool.includes(l))pool.push(l);}}
  const start=(f.session*SF_LIMIT)%Math.max(pool.length,1);
  return [...pool.slice(start),...pool.slice(0,start)].slice(0,SF_LIMIT).map(l=>l.id);
 }
 function sfCards(){const f=sfState();if(!f.ids.length)f.ids=sfNewIds();return sfRng(f.ids.map(id=>ALL.find(l=>l.id===id)));}
 function sfAvatar(ch){return ({1:'◈',2:'⌁',3:'01',4:'</>',5:'{}',6:'▤'})[ch];}
 function sfVisual(ch){
  const frames={
  1:`<circle cx="76" cy="75" r="48" stroke="white" stroke-opacity=".5" fill="none" stroke-width="1.6"/><ellipse cx="76" cy="75" rx="24" ry="48" stroke="white" stroke-opacity=".55" fill="none"/><path d="M28 75H124M40 48h72M40 102h72" stroke="white" stroke-opacity=".6"/><circle cx="36" cy="57" r="5" fill="#a8f0ef"/><circle cx="108" cy="92" r="5" fill="#fff"/>`,
  2:`<g stroke="white" stroke-opacity=".7" stroke-width="2" fill="none"><path d="M76 75 L28 36 M76 75 L124 34 M76 75 L27 116 M76 75 L125 113"/></g><circle cx="76" cy="75" r="15" fill="#a1e6f0"/>${[[28,36],[124,34],[27,116],[125,113]].map(([x,y])=>`<rect x="${x-8}" y="${y-8}" width="16" height="16" rx="4" fill="white" fill-opacity=".85"/>`).join('')}`,
  3:`<text x="20" y="52" font-size="23" font-weight="800" fill="white">1011</text><text x="35" y="90" font-size="23" font-weight="800" fill="#c5ffee">0101</text><path d="M22 100h105" stroke="white" stroke-opacity=".65"/><text x="37" y="130" font-size="23" fill="white">10000</text>`,
  4:`<rect x="15" y="21" width="122" height="107" rx="10" stroke="white" stroke-opacity=".75" fill="none"/><path d="M15 43H137" stroke="white" stroke-opacity=".65"/><circle cx="27" cy="32" r="3" fill="white"/><circle cx="38" cy="32" r="3" fill="#c8f0ff"/><text x="29" y="76" fill="white" font-size="17" font-weight="700">&lt;h1&gt;</text><text x="29" y="102" fill="#bbfff4" font-size="17" font-weight="700">&lt;/h1&gt;</text>`,
  5:`<rect x="15" y="18" width="122" height="114" rx="10" fill="none" stroke="white" stroke-opacity=".6"/><text x="30" y="49" fill="#ccfff6" font-size="13">for (i=0;</text><text x="30" y="73" fill="white" font-size="13">i &lt; 5; i++)</text><text x="30" y="102" fill="#ccfff6" font-size="15">{ ... }</text>`,
  6:`<ellipse cx="76" cy="38" rx="48" ry="17" fill="none" stroke="white" stroke-width="2"/><path d="M28 38v65c0 25 96 25 96 0V38M28 70c0 25 96 25 96 0" fill="none" stroke="white" stroke-opacity=".8" stroke-width="2"/><text x="76" y="84" fill="#e9fff2" font-size="13" text-anchor="middle">SELECT *</text>`
  };
  return `<svg class="sf-art" viewBox="0 0 150 150" role="img" aria-label="Chapter ${ch} concept illustration" xmlns="http://www.w3.org/2000/svg">${frames[ch]}</svg>`;
 }
 function sfLead(l){return (matureLessonHooks[l.ch]||[])[l.index]||`ভাবো: ${l.title} বাস্তবে কোথায় কাজে লাগে?`;}
 function sfSelection(html,limit=2){const block=document.createElement('div');block.innerHTML=html||'';const parts=[...block.querySelectorAll('p')].slice(0,limit);if(parts.length)return parts.map(p=>p.outerHTML).join('');return (block.textContent||'').slice(0,500);}
 function sfQuiz(l){let indexed=DATA.mcqs.map((q,i)=>({q,i})).filter(x=>x.q[0]===l.ch);
  const titleParts=l.title.toLowerCase().split(/[\s,()\/&–—·]+/).filter(w=>w.length>=4);
  const match=x=>titleParts.filter(w=>x.q[1].toLowerCase().includes(w)).length;
  indexed.sort((a,b)=>match(b)-match(a));
  return (indexed.length&&match(indexed[0])>0?indexed[0]:indexed[l.index%indexed.length])||null;
 }
 function sfActiveMarkup(l){const f=sfState(),m=sfQuiz(l); if(!m)return '<p class="sf-quiet">এই Topic-এর জন্য Chapter Quiz খুলে অনুশীলন করো।</p>';
  const a=f.answers[l.id],answered=a!==undefined,correct=m.q[3],good=a===correct;
  return `<div class="sf-quiz"><span class="sf-overline">ONE-MINUTE CHECK</span><h3>${richText(m.q[1])}</h3><div class="sf-options">${m.q[2].map((op,i)=>`<button type="button" class="sf-option ${answered?(i===correct?'is-correct':i===a?'is-wrong':''):''}" data-sf="answer" data-id="${l.id}" data-opt="${i}" ${answered?'disabled':''}><span>${'ABCD'[i]}</span>${E(op)}</button>`).join('')}</div>${answered?`<div class="sf-feedback ${good?'positive':'negative'}"><strong>${good?'Exactly.':'Not quite.'}</strong><p>${E(m.q[4])}</p><div class="sf-feedback-actions"><button class="sf-small-btn" data-sf="jump" data-dir="next">Next topic ↓</button><button class="sf-text-btn" data-route="lesson/${l.ch}/${l.index}">Read the full lesson ↗</button></div></div>`:'<p class="sf-quiet">একটি উত্তর বেছে নাও। ব্যাখ্যা সঙ্গে সঙ্গে পাবে।</p>'}</div>`;
 }
 function sfCard(l,i){const f=sfState(),me=prof(),slides=['CONTEXT','UNDERSTAND','WORKED EXAMPLE','CHECK YOURSELF'];let answered=f.answers[l.id]!==undefined;
  return `<article class="sf-post" data-sf-card="${i}" data-sf-lesson="${E(l.id)}" aria-label="Topic ${i+1}: ${E(l.title)}"><div class="sf-post-top"><span class="sf-topic-index">${String(i+1).padStart(2,'0')} / ${String(f.ids.length).padStart(2,'0')}</span><span>CHAPTER ${l.ch} · ${E(SF_TITLES[l.ch])}</span><span class="sf-reading-time">${l.minutes} min full lesson</span></div>
   <div class="sf-post-shell"><div class="sf-card-head"><div class="sf-author-avatar">${sfAvatar(l.ch)}</div><div><strong>ICT Scholar <span class="sf-verified">✓</span></strong><small>Guided concept · HSC 2028</small></div><span class="sf-tiny-tag">${state.completed[l.id]?'COMPLETED':answered?'PRACTISED':'IN PROGRESS'}</span></div>
   <div class="sf-stage"><div class="sf-stage-visual" style="--sf-a:${SF_THEME[l.ch][0]};--sf-b:${SF_THEME[l.ch][1]}">${sfVisual(l.ch)}<div class="sf-visual-titles"><span>CONCEPT ${l.ch}.${l.index+1}</span><strong>${E(l.title)}</strong><small>${E(interestExamples[me.interest]?.[l.ch-1]||SF_TITLES[l.ch])}</small></div></div>
   <div class="sf-slides" id="sf-slides-${i}" tabindex="0" aria-label="Swipe lesson cards sideways"><section class="sf-slide"><span class="sf-overline">01 · REAL-WORLD CONTEXT</span><h2>${E(l.title)}</h2><p class="sf-hook">${E(sfLead(l))}</p><div class="sf-coaching"><strong>Think first</strong><p>উত্তর দেখার আগে নিজের মতো করে ব্যাখ্যা করার চেষ্টা করো। এরপর ডানে Swipe করো।</p></div></section>
   <section class="sf-slide"><span class="sf-overline">02 · THE CONCEPT</span><h2>এটা কীভাবে কাজ করে?</h2><div class="sf-rich">${sfSelection(l.html,3)}</div><button class="sf-text-btn" data-route="lesson/${l.ch}/${l.index}">Full lesson & diagrams ↗</button></section>
   <section class="sf-slide"><span class="sf-overline">03 · WORKED EXAMPLE</span><h2>একটি উদাহরণ দেখে নাও</h2><div class="sf-rich">${sfSelection(l.workedHtml,3)}</div><div class="sf-misconception"><strong>Common mistake</strong><p>${E(l.trap)}</p></div></section>
   <section class="sf-slide"><span class="sf-overline">04 · ACTIVE RECALL</span>${sfActiveMarkup(l)}</section></div></div>
   <div class="sf-slide-toolbar"><button class="sf-arrow" aria-label="Previous slide" data-sf="slide" data-card="${i}" data-dir="prev">←</button><div class="sf-slide-dots" aria-label="Slide progress">${slides.map((s,j)=>`<button type="button" class="sf-dot ${Number(f.slide[l.id]||0)===j?'active':''}" title="${s}" data-sf="slide-index" data-card="${i}" data-slide="${j}"></button>`).join('')}</div><span class="sf-stage-label" id="sf-stage-label-${i}">${slides[Number(f.slide[l.id]||0)]||slides[0]}</span><button class="sf-arrow" aria-label="Next slide" data-sf="slide" data-card="${i}" data-dir="next">→</button></div>
   <div class="sf-post-actions"><button class="${f.useful[l.id]?'is-active':''}" data-sf="useful" data-id="${l.id}" aria-pressed="${!!f.useful[l.id]}">${f.useful[l.id]?'♥':'♡'} <span>${f.useful[l.id]?'Useful':'Useful?'}</span></button><button class="${state.bookmarks[l.id]?'is-active':''}" data-sf="save" data-id="${l.id}" aria-pressed="${!!state.bookmarks[l.id]}">${state.bookmarks[l.id]?'▣':'▢'} <span>${state.bookmarks[l.id]?'Saved':'Save'}</span></button><button data-route="lesson/${l.ch}/${l.index}">↗ <span>Deep dive</span></button><button data-sf="complete" data-id="${l.id}">${state.completed[l.id]?'✓':'○'} <span>${state.completed[l.id]?'Done':'Mark done'}</span></button></div>
   <div class="sf-comment-section"><div class="sf-comment-top">INSTRUCTOR NOTES <span>· Context, not public comments</span></div><div class="sf-comment"><div class="sf-mini-avatar">i.</div><p><strong>Exam perspective</strong> ${E(l.trap)}</p></div><div class="sf-comment"><div class="sf-mini-avatar sf-second">?</div><p><strong>Pause & answer</strong> ${richText(l.drills?.[0]?.q||'মূল ধারণা নিজের ভাষায় ব্যাখ্যা করো।')} <button class="sf-inline" data-sf="solution" data-id="${l.id}">Reveal answer</button></p></div><div id="sf-answer-${i}" class="sf-mini-answer" hidden>${richText(l.drills?.[0]?.a||'পাঠের উদাহরণ দেখে উত্তর লেখো।')}</div><label class="sf-personal-label" for="sf-personal-${i}">Your private study note</label><textarea id="sf-personal-${i}" data-sf-note="${l.id}" placeholder="তোমার নিজস্ব ব্যাখ্যা বা মনে রাখার কৌশল..." rows="1">${E(f.notes[l.id]||'')}</textarea></div>
   </div><div class="sf-scroll-hint">${i===f.ids.length-1?'শেষ Topic-এর পরে Session Summary':'↓ SCROLL FOR NEXT TOPIC'}</div></article>`;
 }
 function sfSummary(cards){const f=sfState();const answered=cards.filter(l=>f.answers[l.id]!==undefined);let right=answered.filter(l=>f.answers[l.id]===sfQuiz(l)?.q[3]).length;const done=cards.filter(l=>state.completed[l.id]).length;
  return `<section class="sf-summary" data-sf-card="${cards.length}"><div class="sf-summary-mark">✓</div><div class="sf-kicker">SESSION COMPLETE</div><h2>That’s your session.</h2><p>বিরতি নেওয়ার আগে কোন ধারণাগুলো পরিষ্কার হলো আর কোথায় আটকে গেলে, সেটা দেখে নাও। অন্য কোনো Topic পড়তে চাইলে নতুন Session শুরু করতে পারো।</p><div class="sf-summary-stats"><div><strong>${cards.length}</strong><span>Topics explored</span></div><div><strong>${answered.length}</strong><span>Questions attempted</span></div><div><strong>${right}</strong><span>Correct answers</span></div><div><strong>${done}</strong><span>Lessons completed</span></div></div><div class="sf-summary-actions"><button class="btn" data-sf="new-session">Start another session →</button><button class="btn secondary" data-route="mistakes">Review mistakes</button><button class="btn secondary" data-route="chapters">Open full textbook</button></div><p class="sf-quiet">এখানে Infinite Scroll নেই। Study sessions ইচ্ছাকৃতভাবে সীমিত রাখা হয়েছে, যাতে পড়া একটা স্পষ্ট লক্ষ্য নিয়ে শেষ হয়।</p></section>`;
 }
 function sfPrivacy(){const p=prof();return `<section class="sf-privacy-panel"><div class="sf-kicker">PRIVACY & STORAGE</div><h2>Where does my information go?</h2><p>এই standalone website-এ নাম, পছন্দ, Study Progress, Quiz Result, Bookmark, ব্যক্তিগত নোট ও Feed Reactions <strong>শুধু এই ব্রাউজারের localStorage-এ</strong> থাকে। কোনো Account বা Cloud Sync নেই; আমাদের কাছে ডেটা পাঠানো হচ্ছে না।</p><div class="sf-privacy-grid"><div><b>Stored locally</b><span>Profile, notes, quiz history, recommendations</span></div><div><b>Storage key</b><span><code>ict_scholar_2028_v2</code></span></div><div><b>Sharing</b><span>এই HTML-এর কোনো নিজস্ব Server নেই</span></div><div><b>Across devices</b><span>Automatic sync নেই। Export/Import ব্যবহার করো</span></div></div><p class="sf-quiet">Browser data পরিষ্কার করলে তথ্য হারাতে পারে। Shared computer-এ নাম বা ব্যক্তিগত নোট না রাখাই ভালো। YouTube-এ গেলে YouTube-এর নিজস্ব Privacy Policy প্রযোজ্য।</p><div class="row wrap"><button class="btn secondary" data-route="saved">Export / import backup →</button><button class="btn secondary" data-sf="wipe">Delete local learning data</button></div></section>`;}
 function sfHeader(){const p=prof(),f=sfState(),ch=Number(f.scope);let name=p.name?`${E(p.name)}'s focus feed`:'Your focus feed';return `<section class="sf-feed-intro"><div class="sf-intro-copy"><div class="sf-kicker">ICT SCHOLAR · NEW LEARNING MODE</div><h1>${name}</h1><p>A short, personalized stream of ideas. <b>Scroll</b> for the next topic, <b>swipe sideways</b> to understand it, and <b>answer</b> to check your understanding. No fake comments or popularity counts.</p><div class="sf-personal-hint"><span>◎ ${E(p.target)}+ score goal</span><span>◷ ${Math.min(Number(p.daily)||60,30)}-minute focus block</span><span>✧ ${f.scope==='for-you'?'Weak topics first':`Chapter ${ch}`}</span></div></div><div class="sf-intro-design"><div class="sf-intro-ring">01<br><small>LEARN</small></div><span>→</span><div class="sf-intro-ring">02<br><small>TRY</small></div><span>→</span><div class="sf-intro-ring">03<br><small>RECALL</small></div></div></section>`;}
 function sfRender(){const f=sfState(),cards=sfCards(),p=prof(),snap=Object.keys(f.seen||{}).length;return `${sfHeader()}<div class="sf-feed-toolbar"><div class="sf-scope-scroller">${[['for-you','For you'],[1,'01 · Society'],[2,'02 · Networks'],[3,'03 · Binary'],[4,'04 · Web'],[5,'05 · C'],[6,'06 · Data']].map(([v,t])=>`<button class="sf-scope ${String(f.scope)===String(v)?'selected':''}" data-sf="scope" data-scope="${v}">${t}</button>`).join('')}</div><div class="sf-feed-tip">${cards.length} TOPICS · FINITE SESSION</div></div><div class="sf-feed-frame"><aside class="sf-feed-sidebar"><strong>Focus session</strong><p>Swipe right or tap → to go deeper. Scroll down for the next concept.</p><div class="sf-sidebar-track" id="sf-sidebar-track">${cards.map((l,i)=>`<button class="sf-position ${i===0?'active':''}" title="${E(l.title)}" data-sf="go" data-card="${i}"><span>${String(i+1).padStart(2,'0')}</span><small>${E(l.title)}</small></button>`).join('')}</div><span class="sf-sidebar-foot">8 topics, then stop.</span></aside><div class="sf-deck" id="sfDeck" tabindex="0" aria-label="Scroll feed vertically">${cards.map(sfCard).join('')}${sfSummary(cards)}</div></div><section class="sf-underfeed"><div><strong>Prefer reading instead?</strong><p>সব ৭১টি Lesson, Math, CQ, Code Example এবং Practice এখনো সম্পূর্ণ Textbook-এ আছে। Feed হলো শেখার একটি অতিরিক্ত পদ্ধতি।</p></div><button class="btn secondary" data-route="chapters">Open complete textbook ↗</button></section>${sfPrivacy()}`;}
 function sfSetSlide(n,slide,instant=false){const deck=$('#sfDeck'),card=deck?.querySelector(`[data-sf-card="${n}"]`),row=card?.querySelector('.sf-slides');if(!row)return;const f=sfState(),id=card.dataset.sfLesson;const idx=Math.max(0,Math.min(3,slide));f.slide[id]=idx;persist();row.scrollTo({left:idx*row.clientWidth,behavior:instant?'instant':'smooth'});card.querySelectorAll('.sf-dot').forEach((dot,i)=>dot.classList.toggle('active',i===idx));const title=card.querySelector('.sf-stage-label');if(title)title.textContent=['CONTEXT','UNDERSTAND','EXAMPLE','QUICK CHECK'][idx];}
 function sfJump(idx){const deck=$('#sfDeck'),card=deck?.querySelector(`[data-sf-card="${idx}"]`);if(deck&&card){deck.scrollTo({top:card.offsetTop-deck.offsetTop,behavior:'smooth'});}}
 function sfRefresh(){const deck=$('#sfDeck');if(!deck){render();return;}const top=deck.scrollTop;let currentSlides={};deck.querySelectorAll('.sf-post').forEach(card=>{currentSlides[card.dataset.sfCard]=Math.round((card.querySelector('.sf-slides')?.scrollLeft||0)/(card.querySelector('.sf-slides')?.clientWidth||1));});render();const newDeck=$('#sfDeck');if(newDeck){newDeck.scrollTop=top;Object.entries(currentSlides).forEach(([n,s])=>sfSetSlide(Number(n),s,true));}}
 function sfSetup(){const deck=$('#sfDeck');if(!deck)return;
  sfState();
  deck.querySelectorAll('.sf-post').forEach(card=>{const idx=Number(card.dataset.sfCard),row=card.querySelector('.sf-slides'),saved=state.focusFeed.slide[card.dataset.sfLesson]||0;sfSetSlide(idx,saved,true);let pending=false;row?.addEventListener('scroll',()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;const j=Math.max(0,Math.min(3,Math.round(row.scrollLeft/(row.clientWidth||1))));if(state.focusFeed.slide[card.dataset.sfLesson]!==j){state.focusFeed.slide[card.dataset.sfLesson]=j;persist();}card.querySelectorAll('.sf-dot').forEach((d,k)=>d.classList.toggle('active',k===j));const label=card.querySelector('.sf-stage-label');if(label)label.textContent=['CONTEXT','UNDERSTAND','EXAMPLE','QUICK CHECK'][j];});},{passive:true});});
  const observer=new IntersectionObserver(items=>{for(const it of items){if(it.isIntersecting&&it.intersectionRatio>.45){const i=Number(it.target.dataset.sfCard),card=sfCards()[i];if(card&&!state.focusFeed.seen[card.id]){state.focusFeed.seen[card.id]=true;persist();}$$('.sf-position').forEach((x,k)=>x.classList.toggle('active',k===i));}}},{root:deck,threshold:[.45,.65]});deck.querySelectorAll('[data-sf-card]').forEach(el=>observer.observe(el));
 }
 function sfChooseScope(v){const f=sfState();f.scope=v;f.session=0;f.ids=[];f.seen={};persist();sfRefresh();}
 document.addEventListener('click',event=>{const b=event.target.closest('[data-sf]');if(!b)return;const cmd=b.dataset.sf,f=sfState(),id=b.dataset.id;
  if(cmd==='slide'){sfSetSlide(Number(b.dataset.card),(f.slide[$('#sfDeck').querySelector(`[data-sf-card="${b.dataset.card}"]`)?.dataset.sfLesson]||0)+(b.dataset.dir==='next'?1:-1));return;}
  if(cmd==='slide-index'){sfSetSlide(Number(b.dataset.card),Number(b.dataset.slide));return;}
  if(cmd==='scope'){sfChooseScope(b.dataset.scope);return;}
  if(cmd==='go'){sfJump(Number(b.dataset.card));return;}
  if(cmd==='jump'){const n=Number(b.closest('[data-sf-card]')?.dataset.sfCard||0);sfJump(n+1);return;}
  if(cmd==='new-session'){f.session++;f.ids=[];f.seen={};f.slide={};persist();render();$('#sfDeck')?.scrollTo(0,0);return;}
  if(cmd==='useful'){f.useful[id]=!f.useful[id];persist();sfRefresh();return;}
  if(cmd==='save'){state.bookmarks[id]=!state.bookmarks[id];persist();sfRefresh();return;}
  if(cmd==='complete'){state.completed[id]=!state.completed[id];persist();sfRefresh();return;}
  if(cmd==='answer'){if(f.answers[id]!==undefined)return;const l=ALL.find(x=>x.id===id);if(!l)return;const m=sfQuiz(l),val=Number(b.dataset.opt);if(!m)return;f.answers[id]=val;const mis=new Set(state.mistakes||[]);if(val===m.q[3])mis.delete(m.i);else mis.add(m.i);state.mistakes=[...mis];persist();sfRefresh();return;}
  if(cmd==='solution'){const ans=b.closest('.sf-comment-section')?.querySelector('.sf-mini-answer');if(ans){ans.hidden=!ans.hidden;b.textContent=ans.hidden?'Reveal answer':'Hide answer';}return;}
  if(cmd==='wipe'){if(!confirm('এই Browser-এর ICT Scholar Profile, Progress, Notes এবং Quiz History স্থায়ীভাবে মুছে যাবে। আগে Backup নিয়েছ?'))return;try{localStorage.removeItem(STORE_KEY);}catch(_e){}state=defaultState();state.profile={...PROFILE_DEFAULT,onboarded:true,focus:[3,5],watched:[]};render();toast('Local learning data cleared.');return;}
 });
 document.addEventListener('input',event=>{const x=event.target;if(x.matches('[data-sf-note]')){sfState().notes[x.dataset.sfNote]=x.value;persist();}});
 // An explicit, finite flow; keyboard and touchscreen users have identical controls.
 document.addEventListener('keydown',e=>{if(route()[0]!=='feed'||['TEXTAREA','INPUT','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;const deck=$('#sfDeck');if(!deck)return;const posts=$$('.sf-post',deck);const idx=Math.max(0,posts.findIndex(p=>p.offsetTop-deck.offsetTop>=deck.scrollTop-30));if(e.key==='ArrowDown'){e.preventDefault();sfJump(idx+1);}if(e.key==='ArrowUp'){e.preventDefault();sfJump(Math.max(0,idx-1));}if(e.key==='ArrowRight'){e.preventDefault();sfSetSlide(idx,(state.focusFeed.slide[posts[idx]?.dataset.sfLesson]||0)+1);}if(e.key==='ArrowLeft'){e.preventDefault();sfSetSlide(idx,(state.focusFeed.slide[posts[idx]?.dataset.sfLesson]||0)-1);}});
 const oldHome=renderHome;renderHome=function(){return `<section class="sf-home-entry"><div><span class="sf-kicker">NEW · PERSONALIZED LEARNING</span><h2>Understand one concept at a time.</h2><p>Vertical short-form learning, swipeable explainers, quick checks, and instructor notes—with a proper stopping point.</p><button class="btn" data-route="feed">Explore your Focus Feed ↓</button></div><div class="sf-home-decoration"><span>SCROLL</span><strong>↕</strong><small>LEARN → TRY → RECALL</small></div></section>`+oldHome();};
 const previousRender=render;render=function(){const page=route()[0];previousRender();if(page==='feed'){$('#view').innerHTML=sfRender();$('#view').classList.add('sf-page');$('#pageTitle').textContent='Focus Feed';$$('[data-route]',$('#sidebar')).forEach(b=>b.classList.toggle('active',b.dataset.route==='feed'));sfSetup();}else{$('#view').classList.remove('sf-page');if(page==='profile')$('#view').insertAdjacentHTML('beforeend',sfPrivacy());}};
 render();
})();

</script>
