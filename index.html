ounter","minutes":29,"trap":"Flip-Flop এবং Logic Gate এক নয়; Flip-Flop State ধরে রাখতে পারে।","drills":[{"q":"3-bit Counter কতটি State প্রকাশ করে?","a":"2³=8।"},{"q":"Register কী?","a":"একাধিক Bit সংরক্ষণের জন্য Flip-Flop-ভিত্তিক Circuit।"}],"id":"3_12","index":12,"html":"<p><strong>Combinational Circuit</strong>-এর Output বর্তমান Input-এর ওপর নির্ভর করে। <strong>Sequential Circuit</strong>-এর Output বর্তমান Input-এর পাশাপাশি সংরক্ষিত State-এর ওপরও নির্ভর করতে পারে। <strong>Flip-Flop</strong> সাধারণভাবে একটি Bit State সংরক্ষণ করার মৌলিক Circuit।</p>\n<p><strong>SR Flip-Flop:</strong> Set/Reset ধারণা; নির্দিষ্ট বাস্তবায়নে কিছু Input Combination অননুমোদিত হতে পারে। <strong>D Flip-Flop:</strong> Clock Edge-এ D Input-এর মান সংরক্ষণ করে (সাধারণ Edge-triggered Model)। <strong>JK</strong>-তে J=K=1 হলে Toggle, <strong>T Flip-Flop</strong>-এ উপযুক্ত Trigger ও T=1 হলে Toggle।</p>\n<p><strong>Register</strong> একাধিক Flip-Flop দিয়ে বহু Bit সংরক্ষণ করতে পারে; <strong>Counter</strong> Clock Pulse অনুযায়ী State/সংখ্যা পরিবর্তন করে। n-bit Binary Counter সাধারণভাবে <math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"math-equation\" display=\"inline\" aria-label=\"2^n\"><mrow><msup><mn>2</mn><mi>n</mi></msup></mrow></math> State প্রকাশ করতে পারে।</p>\n","workedHtml":"<p>প্রশ্ন: 4-bit Binary Counter-এর State কত? <strong>2⁴ = 16</strong>। 0000 থেকে 1111 পর্যন্ত 16টি Pattern। Flip-Flop 1 Bit হলে 4 Bit রাখতে সাধারণত 4টি Flip-Flop প্রয়োজন।</p>\n","search":"**Combinational Circuit**-এর Output বর্তমান Input-এর ওপর নির্ভর করে। **Sequential Circuit**-এর Output বর্তমান Input-এর পাশাপাশি সংরক্ষিত State-এর ওপরও নির্ভর করতে পারে। **Flip-Flop** সাধারণভাবে একটি Bit State সংরক্ষণ করার মৌলিক Circuit। **SR Flip-Flop:** Set/Reset ধারণা; নির্দিষ্ট বাস্তবায়নে কিছু Input Combination অননুমোদিত হতে পারে। **D Flip-Flop:** Clock Edge-এ D Input-এর মান সংরক্ষণ করে (সাধারণ Edge-triggered Model)। **JK**-তে J=K=1 হলে Toggle, **T Flip-Flop**-এ উপযুক্ত Trigger ও T=1 হলে Toggle। **Register** একাধিক Flip-Flop দিয়ে বহু Bit সংরক্ষণ করতে পারে; **Counter** Clock Pulse অনুযায়ী State/সংখ্যা পরিবর্তন করে। n-bit Binary Counter সাধারণভাবে \\(2^n\\) State প্রকাশ করতে পারে।"},{"ch":4,"title":"ইন্টারনেট, WWW, ওয়েবপেজ ও ওয়েবসাইট","minutes":24,"trap":"Internet আর WWW-কে একই জিনিস বলা পরীক্ষায় ভুল ধরা হতে পারে।","drills":[{"q":"Browser ও Server-এর ভূমিকার পার্থক্য লেখো।","a":"Browser Content অনুরোধ ও প্রদর্শন করে; Server Resource/Response প্রদান করে।"},{"q":"HTTPS-এর একটি সুবিধা লেখো।","a":"যোগাযোগে Encryption ও Server Authentication-এ সহায়তা।"}],"id":"4_0","index":0,"html":"<p><strong>Internet</strong> হলো বহু নেটওয়ার্কের বিশ্বব্যাপী সংযোগ; <strong>World Wide Web (WWW)</strong> হলো Internet-এর ওপর চলা Webpage/Website-ভিত্তিক একটি Service। দুটো এক নয়—Email বা File Transfer-ও Internet-এ চলে। <strong>Webpage</strong> Browser-এ প্রদর্শিত Document, <strong>Website</strong> পরস্পর সম্পর্কিত Webpage/Resource-এর সমষ্টি।</p>\n<p><strong>Browser</strong> Web Content প্রদর্শন করে, <strong>Web Server</strong> Request-এর ভিত্তিতে Web Resource পাঠায়। <strong>URL</strong> কোনো Resource-এর ঠিকানা; যেমন <code>https://example.org/students.html</code>-এ <code>https</code> Scheme, <code>example.org</code> Host, <code>/students.html</code> Path। <strong>HTTP/HTTPS</strong> Web যোগাযোগে ব্যবহৃত Protocol; HTTPS সাধারণত TLS Encryption ব্যবহার করে।</p>\n<p><strong>Homepage:</strong> Website-এর প্রধান প্রবেশ পৃষ্ঠা; এটি সবসময় Domain-এর Root-এ থাকা আবশ্যক নয়। <strong>Static বনাম Dynamic:</strong> Static-এ আগে তৈরি Content সরবরাহ, Dynamic-এ Request/Data অনুযায়ী Content তৈরি বা বদলাতে পারে।</p>\n","workedHtml":"<p>URL বিশ্লেষণ করো: <code>https://school.edu.bd/result/index.html</code>।</p>\n<p>Scheme = <code>https</code>; Host = <code>school.edu.bd</code>; Path = <code>/result/index.html</code>। <code>result</code> এখানে Folder-সদৃশ Path Segment, Protocol নয়।</p>\n","search":"**Internet** হলো বহু নেটওয়ার্কের বিশ্বব্যাপী সংযোগ; **World Wide Web (WWW)** হলো Internet-এর ওপর চলা Webpage/Website-ভিত্তিক একটি Service। দুটো এক নয়—Email বা File Transfer-ও Internet-এ চলে। **Webpage** Browser-এ প্রদর্শিত Document, **Website** পরস্পর সম্পর্কিত Webpage/Resource-এর সমষ্টি। **Browser** Web Content প্রদর্শন করে, **Web Server** Request-এর ভিত্তিতে Web Resource পাঠায়। **URL** কোনো Resource-এর ঠিকানা; যেমন `https://example.org/students.html`-এ `https` Scheme, `example.org` Host, `/students.html` Path। **HTTP/HTTPS** Web যোগাযোগে ব্যবহৃত Protocol; HTTPS সাধারণত TLS Encryption ব্যবহার করে। **Homepage:** Website-এর প্রধান প্রবেশ পৃষ্ঠা; এটি সবসময় Domain-এর Root-এ থাকা আবশ্যক নয়। **Static বনাম Dynamic:** Static-এ আগে তৈরি Content সরবরাহ, Dynamic-এ Request/Data অনুযায়ী Content তৈরি বা বদলাতে পারে।"},{"ch":4,"title":"ওয়েবসাইট কাঠামো: Linear, Tree, Network","minutes":25,"trap":"সব Website-এ শুধুই এক ধরনের Structure থাকে—এমন নয়; Hybrid Structure সাধারণ।","drills":[{"q":"Linear Structure কোথায় বেশি উপযোগী?","a":"ধাপে ধাপে Tutorial বা Registration Process।"},{"q":"Tree Structure কেন বড় শিক্ষাসাইটে ভালো?","a":"বিষয় ও উপবিষয় অনুযায়ী Page সাজানো যায়।"}],"id":"4_1","index":1,"html":"<p>Website Navigation Structure ব্যবহারকারী কীভাবে এক Page থেকে আরেক Page-এ যাবে তা নির্ধারণ করে। <strong>Linear Structure:</strong> ধারাবাহিক Page-এ ধাপে ধাপে অগ্রসর; Tutorial/Step-by-step Form-এ উপযোগী। <strong>Hierarchical/Tree:</strong> Homepage থেকে Category, Subcategory ও Detail Page-এ শাখা; School Website-এর জন্য উপযোগী। <strong>Network/Webbed:</strong> Page-গুলোর মধ্যে বহু Cross-link; Wiki-এর মতো Content-এ কাজে লাগে। <strong>Hybrid:</strong> একাধিক Structure-এর সমন্বয়।</p>\n<p><strong>Design Principles:</strong> সরল Menu, একই ধরনের Navigation, পাঠযোগ্য Heading, ছোট Content Section, Mobile-Friendly Layout। <strong>Information Architecture</strong>-এর লক্ষ্য—ব্যবহারকারী যেন সহজে কাঙ্ক্ষিত তথ্য খুঁজে পান।</p>\n<p>CQ-তে “বিষয় → উপবিষয় → পাঠ” থাকলে Tree; “Page 1 → Page 2 → Page 3” থাকলে Linear। সিদ্ধান্তের সঙ্গে কারণ ও Trade-off দাও।</p>\n","workedHtml":"<p>একটি অনলাইন কোর্সে অধ্যায় → পাঠ → অনুশীলন-এর শাখাবিশিষ্ট Menu আছে। উপযুক্ত কাঠামো <strong>Hierarchical</strong>। কারণ Parent Page থেকে Child Page-এ শৃঙ্খলাবদ্ধ Navigation সম্ভব। তবে অনেক গভীর স্তর হলে Click বেশি লাগতে পারে।</p>\n","search":"Website Navigation Structure ব্যবহারকারী কীভাবে এক Page থেকে আরেক Page-এ যাবে তা নির্ধারণ করে। **Linear Structure:** ধারাবাহিক Page-এ ধাপে ধাপে অগ্রসর; Tutorial/Step-by-step Form-এ উপযোগী। **Hierarchical/Tree:** Homepage থেকে Category, Subcategory ও Detail Page-এ শাখা; School Website-এর জন্য উপযোগী। **Network/Webbed:** Page-গুলোর মধ্যে বহু Cross-link; Wiki-এর মতো Content-এ কাজে লাগে। **Hybrid:** একাধিক Structure-এর সমন্বয়। **Design Principles:** সরল Menu, একই ধরনের Navigation, পাঠযোগ্য Heading, ছোট Content Section, Mobile-Friendly Layout। **Information Architecture**-এর লক্ষ্য—ব্যবহারকারী যেন সহজে কাঙ্ক্ষিত তথ্য খুঁজে পান। CQ-তে “বিষয় → উপবিষয় → পাঠ” থাকলে Tree; “Page 1 → Page 2 → Page 3” থাকলে Linear। সিদ্ধান্তের সঙ্গে কারণ ও Trade-off দাও।"},{"ch":4,"title":"Domain, DNS, Hosting ও Website Publication","minutes":24,"trap":"Domain কিনলেই Website তৈরি হয়ে যায় না; Content ও Hosting/Server প্রয়োজন।","drills":[{"q":"DNS কী করে?","a":"Domain Name-এর সঙ্গে সংশ্লিষ্ট Address/Record খুঁজতে সাহায্য করে।"},{"q":"Website Publishing-এর তিনটি ধাপ লেখো।","a":"তৈরি, পরীক্ষা, Server-এ প্রকাশ—যথার্থ তিনটি ধাপ।"}],"id":"4_2","index":2,"html":"<p><strong>Domain Name</strong> হলো Internet-এ পাঠযোগ্য নাম; <strong>DNS</strong> নামকে প্রয়োজনীয় Network Address-এ Resolve করতে সাহায্য করে। <strong>Hosting</strong>-এ Website-এর File/Application কোনো Server-এ রাখা হয়। <strong>Web Publishing</strong> সাধারণ ধাপ: পরিকল্পনা → Page তৈরি → পরীক্ষা → Domain ও Hosting → Upload/Deploy → Maintenance।</p>\n<p><strong>Domain ≠ Hosting:</strong> <code>mycollege.edu.bd</code> একটি নাম; Server-এ HTML ও Image File থাকা হলো Hosting-এর অংশ। <strong>Security:</strong> HTTPS/TLS, Backup, Update, Access Control। <strong>Accessibility:</strong> Image-এ অর্থপূর্ণ <code>alt</code>, Heading-এর সঠিক ক্রম, পাঠযোগ্য Contrast।</p>\n<p>বইয়ের বোর্ড-ধাঁচের প্রশ্নে Domain-এর কাজ, URL-এর অংশ, Hosting-এর প্রয়োজন এবং Static/Dynamic Comparison নিয়মিত অনুশীলনযোগ্য।</p>\n","workedHtml":"<p>কলেজে HTML File প্রস্তুত, কিন্তু শুধু নিজের Laptop-এ দেখা যায়। সবার কাছে প্রকাশ করতে কী লাগবে?</p>\n<p>উপযুক্ত Hosting/Server, Publicly Accessible Network Configuration এবং চাইলে Domain Name প্রয়োজন। File Upload/Deploy ও DNS Configuration করলে Address দিয়ে Browser-এ Website খোলা যাবে।</p>\n","search":"**Domain Name** হলো Internet-এ পাঠযোগ্য নাম; **DNS** নামকে প্রয়োজনীয় Network Address-এ Resolve করতে সাহায্য করে। **Hosting**-এ Website-এর File/Application কোনো Server-এ রাখা হয়। **Web Publishing** সাধারণ ধাপ: পরিকল্পনা → Page তৈরি → পরীক্ষা → Domain ও Hosting → Upload/Deploy → Maintenance। **Domain ≠ Hosting:** `mycollege.edu.bd` একটি নাম; Server-এ HTML ও Image File থাকা হলো Hosting-এর অংশ। **Security:** HTTPS/TLS, Backup, Update, Access Control। **Accessibility:** Image-এ অর্থপূর্ণ `alt`, Heading-এর সঠিক ক্রম, পাঠযোগ্য Contrast। বইয়ের বোর্ড-ধাঁচের প্রশ্নে Domain-এর কাজ, URL-এর অংশ, Hosting-এর প্রয়োজন এবং Static/Dynamic Comparison নিয়মিত অনুশীলনযোগ্য।"},{"ch":4,"title":"HTML: Tag, Element, Attribute ও পূর্ণ কাঠামো","minutes":28,"trap":"`<title>` Body-এর বড় Heading নয়; সেটি Tab Title।","drills":[{"q":"Tag ও Attribute-এর পার্থক্য কী?","a":"Tag Element চিহ্নিত করে, Attribute Element-এর অতিরিক্ত তথ্য দেয়।"},{"q":"বাংলা Text সঠিক দেখাতে কোন Meta Tag উপকারী?","a":"<meta charset=\"utf-8\">।"}],"id":"4_3","index":3,"html":"<p><strong>HTML (HyperText Markup Language)</strong> Webpage-এর Structure/Meaning নির্ধারণের Markup Language। <strong>Tag:</strong> <code>&lt;p&gt;</code> বা <code>&lt;/p&gt;</code> চিহ্ন; <strong>Element:</strong> Opening Tag, Content, Closing Tag-সহ সম্পূর্ণ অংশ; <strong>Attribute:</strong> Tag-এর অতিরিক্ত তথ্য, যেমন <code>href</code>, <code>src</code>, <code>alt</code>। HTML সাধারণত Case-insensitive হলেও Lowercase রীতি মানা ভালো।</p>\n<p><strong>মৌলিক কাঠামো:</strong> <code>&lt;!DOCTYPE html&gt;</code> HTML5 নির্দেশ করে; <code>&lt;html lang=&quot;bn&quot;&gt;</code> ভাষা নির্ধারণ করে; <code>&lt;head&gt;</code> Metadata, <code>&lt;meta charset=&quot;utf-8&quot;&gt;</code> Encoding, <code>&lt;title&gt;</code> Tab Title, <code>&lt;body&gt;</code> দৃশ্যমান Content। <code>br</code>, <code>img</code>, <code>hr</code> Void Element—এদের আলাদা Closing Tag নেই।</p>\n<p>HTML Error Debugging: Tag সঠিক Nested কি না, Attribute-এ Quote দেওয়া হয়েছে কি না, File <code>.html</code> হিসেবে Save হয়েছে কি না।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;bn&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;utf-8&quot;&gt;\n  &lt;title&gt;আমার কলেজ&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;আমাদের কলেজে স্বাগতম&lt;/h1&gt;\n  &lt;p&gt;এটি প্রথম ওয়েবপেজ।&lt;/p&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n</code></pre>\n<p><code>title</code> Browser Tab-এ; <code>h1</code> Page-এর দৃশ্যমান বড় শিরোনাম।</p>\n","search":"**HTML (HyperText Markup Language)** Webpage-এর Structure/Meaning নির্ধারণের Markup Language। **Tag:** `<p>` বা `</p>` চিহ্ন; **Element:** Opening Tag, Content, Closing Tag-সহ সম্পূর্ণ অংশ; **Attribute:** Tag-এর অতিরিক্ত তথ্য, যেমন `href`, `src`, `alt`। HTML সাধারণত Case-insensitive হলেও Lowercase রীতি মানা ভালো। **মৌলিক কাঠামো:** `<!DOCTYPE html>` HTML5 নির্দেশ করে; `<html lang=\"bn\">` ভাষা নির্ধারণ করে; `<head>` Metadata, `<meta charset=\"utf-8\">` Encoding, `<title>` Tab Title, `<body>` দৃশ্যমান Content। `br`, `img`, `hr` Void Element—এদের আলাদা Closing Tag নেই। HTML Error Debugging: Tag সঠিক Nested কি না, Attribute-এ Quote দেওয়া হয়েছে কি না, File `.html` হিসেবে Save হয়েছে কি না।"},{"ch":4,"title":"HTML টেক্সট, Heading, Formatting ও Special Character","minutes":26,"trap":"`<br>` ও `<p>` একই কাজ করে না: প্রথমটি Line Break, দ্বিতীয়টি Paragraph।","drills":[{"q":"H₂O লিখতে কোন Tag?","a":"<sub>।"},{"q":"x² লিখতে কোন Tag?","a":"<sup>।"}],"id":"4_4","index":4,"html":"<p><code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code> Heading Level; <code>&lt;p&gt;</code> Paragraph; <code>&lt;br&gt;</code> Line Break; <code>&lt;hr&gt;</code> বিষয়গত বিভাজক। <code>&lt;strong&gt;</code> গুরুত্বপূর্ণ Text, <code>&lt;em&gt;</code> জোর, <code>&lt;b&gt;</code> দৃশ্যমান Bold, <code>&lt;i&gt;</code> Italic। <code>&lt;sup&gt;</code> Superscript, <code>&lt;sub&gt;</code> Subscript; <code>&lt;pre&gt;</code> Preformatted Text।</p>\n<p>HTML-এ পরপর Space/Linebreak সাধারণত Collapse হয়, তাই আলাদা Paragraph/Break দরকার। Special Character লিখতে Entity লাগে: <code>&amp;lt;</code> = <code>&lt;</code>, <code>&amp;gt;</code> = <code>&gt;</code>, <code>&amp;amp;</code> = <code>&amp;</code>। Unicode/UTF-8 বাংলা প্রদর্শনে সাহায্য করে।</p>\n<p><strong>ভালো অভ্যাস:</strong> শুধু Font বড় করতে Heading ব্যবহার না করে বিষয়গত Heading-এর জন্য ব্যবহার করো; পাঠ্য সমর্থনে Semantic Markup মূল্যবান।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;h2&gt;রসায়ন&lt;/h2&gt;\n&lt;p&gt;পানির সংকেত H&lt;sub&gt;2&lt;/sub&gt;O&lt;/p&gt;\n&lt;p&gt;বর্গের সূত্র: x&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;বিশেষ ঘোষণা&lt;/strong&gt;&lt;/p&gt;\n</code></pre>\n<p>ফল: H₂O-তে 2 নিচে এবং x²-তে 2 উপরে দেখা যায়।</p>\n","search":"`<h1>`–`<h6>` Heading Level; `<p>` Paragraph; `<br>` Line Break; `<hr>` বিষয়গত বিভাজক। `<strong>` গুরুত্বপূর্ণ Text, `<em>` জোর, `<b>` দৃশ্যমান Bold, `<i>` Italic। `<sup>` Superscript, `<sub>` Subscript; `<pre>` Preformatted Text। HTML-এ পরপর Space/Linebreak সাধারণত Collapse হয়, তাই আলাদা Paragraph/Break দরকার। Special Character লিখতে Entity লাগে: `&lt;` = `<`, `&gt;` = `>`, `&amp;` = `&`। Unicode/UTF-8 বাংলা প্রদর্শনে সাহায্য করে। **ভালো অভ্যাস:** শুধু Font বড় করতে Heading ব্যবহার না করে বিষয়গত Heading-এর জন্য ব্যবহার করো; পাঠ্য সমর্থনে Semantic Markup মূল্যবান।"},{"ch":4,"title":"HTML Link, Image ও Path","minutes":28,"trap":"Image Path ভুল হলে ছবি দেখাবে না; Code ঠিক থাকলেও File Location যাচাই করো।","drills":[{"q":"ছবি দেখাতে কোন Attribute প্রয়োজন?","a":"src।"},{"q":"alt কেন দেওয়া হয়?","a":"ছবির বিকল্প অর্থপূর্ণ বর্ণনা ও Accessibility-এর জন্য।"}],"id":"4_5","index":5,"html":"<p><strong>Link:</strong> <code>&lt;a href=&quot;...&quot;&gt;লিংকের লেখা&lt;/a&gt;</code>। <strong>Image:</strong> <code>&lt;img src=&quot;...&quot; alt=&quot;ছবির বর্ণনা&quot;&gt;</code>। <code>href</code> Link Target, <code>src</code> Image Source, <code>alt</code> ছবি না দেখালে বিকল্প Text এবং Screen Reader-এ সহায়তা করে। <strong>Absolute URL:</strong> পুরো Scheme/Host দেওয়া; <strong>Relative URL:</strong> বর্তমান Page-এর অবস্থানের তুলনায় Path।</p>\n<p>Example: <code>index.html</code> ও <code>photo.jpg</code> একই Folder-এ থাকলে <code>src=&quot;photo.jpg&quot;</code> ব্যবহার করা যায়। উপরের Folder-এর <code>images</code> Subfolder হলে <code>src=&quot;images/photo.jpg&quot;</code>। <code>../</code> Parent Folder নির্দেশ করে।</p>\n<p><strong>Security:</strong> অজানা Script/URL-এ অযথা তথ্য পাঠাবে না। Link খুলতে URL যাচাই করো। External Link ব্যবহারে Link Text অর্থপূর্ণ রাখা ভালো।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;a href=&quot;about.html&quot;&gt;আমাদের সম্পর্কে&lt;/a&gt;\n&lt;a href=&quot;https://nctb.gov.bd/&quot;&gt;NCTB&lt;/a&gt;\n&lt;img src=&quot;images/college.jpg&quot; alt=&quot;কলেজ ভবনের সামনের দৃশ্য&quot; width=&quot;240&quot;&gt;\n</code></pre>\n<p><code>about.html</code> হলো Relative URL; <code>https://nctb.gov.bd/</code> Absolute URL।</p>\n","search":"**Link:** `<a href=\"...\">লিংকের লেখা</a>`। **Image:** `<img src=\"...\" alt=\"ছবির বর্ণনা\">`। `href` Link Target, `src` Image Source, `alt` ছবি না দেখালে বিকল্প Text এবং Screen Reader-এ সহায়তা করে। **Absolute URL:** পুরো Scheme/Host দেওয়া; **Relative URL:** বর্তমান Page-এর অবস্থানের তুলনায় Path। Example: `index.html` ও `photo.jpg` একই Folder-এ থাকলে `src=\"photo.jpg\"` ব্যবহার করা যায়। উপরের Folder-এর `images` Subfolder হলে `src=\"images/photo.jpg\"`। `../` Parent Folder নির্দেশ করে। **Security:** অজানা Script/URL-এ অযথা তথ্য পাঠাবে না। Link খুলতে URL যাচাই করো। External Link ব্যবহারে Link Text অর্থপূর্ণ রাখা ভালো।"},{"ch":4,"title":"HTML Ordered, Unordered, Description List","minutes":23,"trap":"`<li>`-কে `<ul>`/`<ol>`-এর বাইরে এলোমেলোভাবে ব্যবহার করো না।","drills":[{"q":"ধাপের ক্রম দেখাতে কোন Tag?","a":"<ol>।"},{"q":"তালিকার Item-এর Tag কী?","a":"<li>।"}],"id":"4_6","index":6,"html":"<p><strong>Ordered List</strong> (<code>&lt;ol&gt;</code>) ক্রমিক তালিকা; <strong>Unordered List</strong> (<code>&lt;ul&gt;</code>) Bullet তালিকা; প্রত্যেকটি Item সাধারণত <code>&lt;li&gt;</code> দিয়ে লেখা হয়। <strong>Description List</strong> (<code>&lt;dl&gt;</code>) Term ও Description-এর জন্য; <code>&lt;dt&gt;</code> Term, <code>&lt;dd&gt;</code> Description।</p>\n<p><strong>Nested List</strong>-এ একটি <code>&lt;li&gt;</code>-এর মধ্যে আরেকটি <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> রাখা যায়। সঠিক Nesting খেয়াল করো। CSS দিয়ে Number/Bullet Style বদলানো যায়; HTML-এ <code>type</code> Attribute কিছু পরীক্ষামূলক উদাহরণে দেখা যেতে পারে, কিন্তু আধুনিক Styling-এর জন্য CSS উত্তম।</p>\n<p><strong>কখন কী?</strong> পদক্ষেপ/Rank → Ordered, উপকরণের তালিকা → Unordered, পরিভাষা ও সংজ্ঞা → Description List।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;h3&gt;বিষয়সমূহ&lt;/h3&gt;\n&lt;ol&gt;\n  &lt;li&gt;আইসিটি&lt;/li&gt;\n  &lt;li&gt;পদার্থবিজ্ঞান&lt;/li&gt;\n  &lt;li&gt;রসায়ন&lt;/li&gt;\n&lt;/ol&gt;\n&lt;ul&gt;\n  &lt;li&gt;কলম&lt;/li&gt;\n  &lt;li&gt;খাতা&lt;/li&gt;\n&lt;/ul&gt;\n</code></pre>\n<p>ফল: প্রথম তালিকায় সংখ্যা, দ্বিতীয় তালিকায় Bullet।</p>\n","search":"**Ordered List** (`<ol>`) ক্রমিক তালিকা; **Unordered List** (`<ul>`) Bullet তালিকা; প্রত্যেকটি Item সাধারণত `<li>` দিয়ে লেখা হয়। **Description List** (`<dl>`) Term ও Description-এর জন্য; `<dt>` Term, `<dd>` Description। **Nested List**-এ একটি `<li>`-এর মধ্যে আরেকটি `<ul>`/`<ol>` রাখা যায়। সঠিক Nesting খেয়াল করো। CSS দিয়ে Number/Bullet Style বদলানো যায়; HTML-এ `type` Attribute কিছু পরীক্ষামূলক উদাহরণে দেখা যেতে পারে, কিন্তু আধুনিক Styling-এর জন্য CSS উত্তম। **কখন কী?** পদক্ষেপ/Rank → Ordered, উপকরণের তালিকা → Unordered, পরিভাষা ও সংজ্ঞা → Description List।"},{"ch":4,"title":"HTML Table-এর গঠন ও সঠিক Row/Cell","minutes":28,"trap":"`<tr>` Row, `<td>` Cell; দুটো গুলিয়ে ফেললে Table ভেঙে যায়।","drills":[{"q":"Table Header Cell-এর Tag কী?","a":"<th>।"},{"q":"Table-এর শিরোনাম কোন Tag?","a":"<caption>।"}],"id":"4_7","index":7,"html":"<p><strong>Table:</strong> <code>&lt;table&gt;</code> Container, <code>&lt;tr&gt;</code> Row, <code>&lt;th&gt;</code> Header Cell, <code>&lt;td&gt;</code> Data Cell। <code>&lt;caption&gt;</code> টেবিলের শিরোনাম, <code>&lt;thead&gt;</code> Header Group, <code>&lt;tbody&gt;</code> Data Group। প্রতিটি <code>&lt;tr&gt;</code>-তে প্রয়োজনমতো Cell লিখতে হয়। HTML Table <strong>Tabular Data</strong>-র জন্য; পুরো Website Layout বানানোর জন্য নয়।</p>\n<p><strong>প্রশ্ন সমাধানের ধাপ:</strong> (১) চিত্রে মোট Column গুনো; (২) প্রতিটি Row শনাক্ত করো; (৩) সাধারণ Cell বসাও; (৪) কোনো Cell মিশে থাকলে <code>rowspan</code>/<code>colspan</code>; (৫) Browser-এ Preview করে যাচাই।</p>\n<p>বোর্ড-ধাঁচের প্রশ্নে প্রদত্ত Table-এর চিত্র দেখে HTML লিখতে হয়। Header-এ <code>&lt;th&gt;</code> ব্যবহার করলে Semantic Meaning স্পষ্ট হয়।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;table border=&quot;1&quot;&gt;\n  &lt;caption&gt;Student Result&lt;/caption&gt;\n  &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;GPA&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Rima&lt;/td&gt;&lt;td&gt;5.00&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Hasan&lt;/td&gt;&lt;td&gt;4.80&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;\n</code></pre>\n<p>এখানে মোট দুই Column এবং তিন Row। <code>border=&quot;1&quot;</code> পুরোনো শিক্ষণীয় উদাহরণে দেখা যায়; আধুনিক নকশায় CSS ব্যবহার করা ভালো।</p>\n","search":"**Table:** `<table>` Container, `<tr>` Row, `<th>` Header Cell, `<td>` Data Cell। `<caption>` টেবিলের শিরোনাম, `<thead>` Header Group, `<tbody>` Data Group। প্রতিটি `<tr>`-তে প্রয়োজনমতো Cell লিখতে হয়। HTML Table **Tabular Data**-র জন্য; পুরো Website Layout বানানোর জন্য নয়। **প্রশ্ন সমাধানের ধাপ:** (১) চিত্রে মোট Column গুনো; (২) প্রতিটি Row শনাক্ত করো; (৩) সাধারণ Cell বসাও; (৪) কোনো Cell মিশে থাকলে `rowspan`/`colspan`; (৫) Browser-এ Preview করে যাচাই। বোর্ড-ধাঁচের প্রশ্নে প্রদত্ত Table-এর চিত্র দেখে HTML লিখতে হয়। Header-এ `<th>` ব্যবহার করলে Semantic Meaning স্পষ্ট হয়।"},{"ch":4,"title":"rowspan ও colspan: মিশ্রিত Table সমাধান","minutes":30,"trap":"Merged Cell-এর জায়গায় আবার Normal Cell লিখলে Column Alignment ভুল হয়।","drills":[{"q":"একটি Cell তিন Row-তে বিস্তৃত হলে কী লিখবে?","a":"rowspan=\"3\"।"},{"q":"একটি Heading চার Column জুড়ে গেলে কী লিখবে?","a":"colspan=\"4\"।"}],"id":"4_8","index":8,"html":"<p>একাধিক ঘর মিশে থাকা Table বোর্ড পরীক্ষায় গুরুত্বপূর্ণ। <strong><code>colspan=&quot;2&quot;</code></strong> একটি Cell অনুভূমিকভাবে ২ Column জুড়ে রাখে; <strong><code>rowspan=&quot;2&quot;</code></strong> উল্লম্বভাবে ২ Row জুড়ে রাখে। একটি Cell Span করা হলে পরের Row/Column-এ সংশ্লিষ্ট জায়গায় <strong>অতিরিক্ত Cell লিখবে না</strong>।</p>\n<p><strong>ধাপ:</strong> কাগজে Grid আঁকো, Span করা Cell-এ তীর চিহ্ন দাও, প্রতিটি Row-তে যে Cell নতুন করে শুরু হচ্ছে কেবল সেগুলো লেখো। <code>rowspan</code> ব্যবহারের পরে পরবর্তী Row-এর Cell সংখ্যা কমে যেতে পারে—এটাই স্বাভাবিক।</p>\n<p>এই বিষয়টি মুখস্থ নয়, আঁকাভিত্তিক অনুশীলন। Preview-এ Cell কোথায় আছে দেখে নিজে ভুল ধরো।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;table border=&quot;1&quot;&gt;\n &lt;tr&gt;&lt;th colspan=&quot;3&quot;&gt;Final Result&lt;/th&gt;&lt;/tr&gt;\n &lt;tr&gt;&lt;th&gt;Group&lt;/th&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;GPA&lt;/th&gt;&lt;/tr&gt;\n &lt;tr&gt;&lt;td rowspan=&quot;2&quot;&gt;Science&lt;/td&gt;&lt;td&gt;Rafi&lt;/td&gt;&lt;td&gt;5.00&lt;/td&gt;&lt;/tr&gt;\n &lt;tr&gt;&lt;td&gt;Mita&lt;/td&gt;&lt;td&gt;4.90&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;\n</code></pre>\n<p>তৃতীয় Row-এর <code>Science</code> Cell চতুর্থ Row-তেও বিস্তৃত, তাই চতুর্থ Row-এ আরেকটি <code>Group</code> Cell লেখা হয়নি।</p>\n","search":"একাধিক ঘর মিশে থাকা Table বোর্ড পরীক্ষায় গুরুত্বপূর্ণ। **`colspan=\"2\"`** একটি Cell অনুভূমিকভাবে ২ Column জুড়ে রাখে; **`rowspan=\"2\"`** উল্লম্বভাবে ২ Row জুড়ে রাখে। একটি Cell Span করা হলে পরের Row/Column-এ সংশ্লিষ্ট জায়গায় **অতিরিক্ত Cell লিখবে না**। **ধাপ:** কাগজে Grid আঁকো, Span করা Cell-এ তীর চিহ্ন দাও, প্রতিটি Row-তে যে Cell নতুন করে শুরু হচ্ছে কেবল সেগুলো লেখো। `rowspan` ব্যবহারের পরে পরবর্তী Row-এর Cell সংখ্যা কমে যেতে পারে—এটাই স্বাভাবিক। এই বিষয়টি মুখস্থ নয়, আঁকাভিত্তিক অনুশীলন। Preview-এ Cell কোথায় আছে দেখে নিজে ভুল ধরো।"},{"ch":4,"title":"Complete HTML Project, Forms ও Debugging","minutes":32,"trap":"Browser-এ Code দেখা আর Code কার্যকর হওয়া এক নয়; HTML File হিসেবে সংরক্ষণ ও Render পরীক্ষা করো।","drills":[{"q":"HTML Code-এ দুই শিক্ষার্থী যোগ করতে কোন অংশ বাড়াবে?","a":"Table-এর মধ্যে দুটি নতুন <tr> Row।"},{"q":"Form Input-এর সঙ্গে Label কেন রাখবে?","a":"ব্যবহারযোগ্যতা ও Accessibility বাড়াতে।"}],"id":"4_9","index":9,"html":"<p>একটি ছোট Website-এ <strong>Heading, Paragraph, Link, Image, List, Table</strong> একসঙ্গে ব্যবহার করো। <code>form</code>, <code>label</code>, <code>input</code>, <code>button</code> দিয়ে সাধারণ Input Form-এর কাঠামো বোঝা যায়—সব সংস্করণে পরীক্ষার মূল জোর সমান নয়, তাই এগুলো সহায়ক অনুশীলন।</p>\n<p><strong>পরীক্ষার Debug Checklist:</strong> 1) <code>doctype</code>, <code>html</code>, <code>head</code>, <code>body</code> আছে? 2) <code>meta charset</code> আছে? 3) Table Row/Cell সঠিক? 4) Attribute-এ Quotation? 5) Relative Image Path সঠিক? 6) File <code>.html</code> Extension-এ Save? 7) Closing Tag সঠিক?</p>\n<p><strong>Accessible Design:</strong> Image-এর <code>alt</code>, Form Input-এর <code>label</code>, যথাযথ Heading, সহজ Navigation। চোখে সুন্দর দেখালেও অর্থপূর্ণ Markup জরুরি।</p>\n","workedHtml":"<pre><code class=\"language-html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;bn&quot;&gt;\n&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;title&gt;ICT Club&lt;/title&gt;&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;আমাদের ICT Club&lt;/h1&gt;\n  &lt;p&gt;আমরা HTML শিখছি।&lt;/p&gt;\n  &lt;ul&gt;&lt;li&gt;HTML&lt;/li&gt;&lt;li&gt;C&lt;/li&gt;&lt;/ul&gt;\n  &lt;table border=&quot;1&quot;&gt;\n    &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;Role&lt;/th&gt;&lt;/tr&gt;\n    &lt;tr&gt;&lt;td&gt;Asha&lt;/td&gt;&lt;td&gt;Leader&lt;/td&gt;&lt;/tr&gt;\n  &lt;/table&gt;\n  &lt;a href=&quot;https://nctb.gov.bd/&quot;&gt;NCTB&lt;/a&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n</code></pre>\n<p>এটি Live HTML Lab-এ Paste করে নিজে নতুন Row ও Link যোগ করো।</p>\n","search":"একটি ছোট Website-এ **Heading, Paragraph, Link, Image, List, Table** একসঙ্গে ব্যবহার করো। `form`, `label`, `input`, `button` দিয়ে সাধারণ Input Form-এর কাঠামো বোঝা যায়—সব সংস্করণে পরীক্ষার মূল জোর সমান নয়, তাই এগুলো সহায়ক অনুশীলন। **পরীক্ষার Debug Checklist:** 1) `doctype`, `html`, `head`, `body` আছে? 2) `meta charset` আছে? 3) Table Row/Cell সঠিক? 4) Attribute-এ Quotation? 5) Relative Image Path সঠিক? 6) File `.html` Extension-এ Save? 7) Closing Tag সঠিক? **Accessible Design:** Image-এর `alt`, Form Input-এর `label`, যথাযথ Heading, সহজ Navigation। চোখে সুন্দর দেখালেও অর্থপূর্ণ Markup জরুরি।"},{"ch":5,"title":"প্রোগ্রামিং ভাষার স্তর, প্রজন্ম ও অনুবাদক","minutes":27,"trap":"Compiler/Interpreter পার্থক্য মুখস্থের সঙ্গে অনুবাদ/চলনের উদাহরণ যুক্ত করো।","drills":[{"q":"Assembly Language কে অনুবাদ করে?","a":"Assembler।"},{"q":"Logic Error কী?","a":"Program চললেও ভুল পদ্ধতির কারণে ভুল ফল পাওয়া।"}],"id":"5_0","index":0,"html":"<p><strong>Programming Language</strong> হলো কম্পিউটারকে কাজ করানোর নিয়মভিত্তিক নির্দেশনা লেখার মাধ্যম। <strong>Machine Language</strong> Binary Instruction-ভিত্তিক, যন্ত্রনির্ভর; <strong>Assembly Language</strong> Mnemonic Instruction ব্যবহার করে, <strong>Assembler</strong> অনুবাদ করে; <strong>High-level Language</strong> মানুষের বোঝার জন্য তুলনামূলক সহজ—যেমন C, Python।</p>\n<p><strong>Compiler</strong> সাধারণত Source Code-কে লক্ষ্যভিত্তিক Object/Machine Code-এ অনুবাদ করে এবং Error জানায়; <strong>Interpreter</strong> Program চলার সময় Instruction/Representation ব্যাখ্যা করে Execution করে। বাস্তবে আধুনিক Runtime-এ সংকর পদ্ধতি থাকে, তাই ‘সব Compiler একবারে সব’ বা ‘সব Interpreter এক লাইনে এক’ কঠোর নিয়ম নয়।</p>\n<p><strong>Source Code → Translation → Execution/Output</strong>—এই প্রবাহ আঁকতে শেখো। <strong>Syntax Error</strong> ভাষার গঠন ভুল; <strong>Logic Error</strong> Program চলে কিন্তু ফল ভুল; <strong>Runtime Error</strong> চলার সময় সমস্যা।</p>\n","workedHtml":"<pre><code class=\"language-c\">int x = 5\nprintf(&quot;%d&quot;, x);\n</code></pre>\n<p>প্রথম Statement-এর পরে <code>;</code> নেই—এটি <strong>Syntax Error</strong>। আর <code>sum = a - b</code> দিয়ে যোগফল দেখাতে চাইলে সেটি <strong>Logic Error</strong>।</p>\n","search":"**Programming Language** হলো কম্পিউটারকে কাজ করানোর নিয়মভিত্তিক নির্দেশনা লেখার মাধ্যম। **Machine Language** Binary Instruction-ভিত্তিক, যন্ত্রনির্ভর; **Assembly Language** Mnemonic Instruction ব্যবহার করে, **Assembler** অনুবাদ করে; **High-level Language** মানুষের বোঝার জন্য তুলনামূলক সহজ—যেমন C, Python। **Compiler** সাধারণত Source Code-কে লক্ষ্যভিত্তিক Object/Machine Code-এ অনুবাদ করে এবং Error জানায়; **Interpreter** Program চলার সময় Instruction/Representation ব্যাখ্যা করে Execution করে। বাস্তবে আধুনিক Runtime-এ সংকর পদ্ধতি থাকে, তাই ‘সব Compiler একবারে সব’ বা ‘সব Interpreter এক লাইনে এক’ কঠোর নিয়ম নয়। **Source Code → Translation → Execution/Output**—এই প্রবাহ আঁকতে শেখো। **Syntax Error** ভাষার গঠন ভুল; **Logic Error** Program চলে কিন্তু ফল ভুল; **Runtime Error** চলার সময় সমস্যা।"},{"ch":5,"title":"Problem Solving, Algorithm ও Pseudocode","minutes":29,"trap":"Algorithm ≠ Source Code; Algorithm ভাষা-স্বাধীনভাবে লেখা যায়।","drills":[{"q":"Algorithm-এর দুটি বৈশিষ্ট্য লেখো।","a":"সুস্পষ্ট ধাপ এবং সীমিত সময়ে শেষ হওয়া।"},{"q":"IPO-এর পূর্ণরূপ কী?","a":"Input, Process, Output।"}],"id":"5_1","index":1,"html":"<p>Program বানানোর সাধারণ ধাপ: <strong>Problem Definition → Input/Output চিহ্নিত → Algorithm → Flowchart/Pseudocode → Code → Test → Debug → Maintain</strong>। <strong>Algorithm</strong> হলো সুনির্দিষ্ট, সীমিত ধাপে সমাধানের পদ্ধতি; কোনো নির্দিষ্ট Language-এ না লিখলেও চলে।</p>\n<p><strong>Pseudocode</strong> মানুষের বোঝার ভাষায় Program-এর মতো করে Logic লেখা। এতে Language-specific Semicolon বা Header লাগবে না। ভালো Algorithm-এর বৈশিষ্ট্য: স্পষ্টতা, সসীমতা, Input/Output এবং কার্যকর ধাপ।</p>\n<p><strong>IPO Model:</strong> Input → Process → Output। যেমন তিনটি সংখ্যার Average: Input 3টি সংখ্যা; Process Sum/3; Output Average। প্রোগ্রামের আগে IPO লিখলে Variable ও Logic নির্ধারণ সহজ হয়।</p>\n","workedHtml":"<p>দুটি সংখ্যার বৃহত্তম নির্ণয়ের Algorithm:</p>\n<ol>\n<li>Start। 2. a,b Input নাও। 3. যদি a&gt;b, Print a। 4. অন্যথায় যদি b&gt;a, Print b। 5. অন্যথায় 'Equal' Print করো। 6. Stop।</li>\n</ol>\n<p>শুধু ‘বড়টি বের করো’—এভাবে Step না লিখে সিদ্ধান্তের শর্ত স্পষ্ট করো।</p>\n","search":"Program বানানোর সাধারণ ধাপ: **Problem Definition → Input/Output চিহ্নিত → Algorithm → Flowchart/Pseudocode → Code → Test → Debug → Maintain**। **Algorithm** হলো সুনির্দিষ্ট, সীমিত ধাপে সমাধানের পদ্ধতি; কোনো নির্দিষ্ট Language-এ না লিখলেও চলে। **Pseudocode** মানুষের বোঝার ভাষায় Program-এর মতো করে Logic লেখা। এতে Language-specific Semicolon বা Header লাগবে না। ভালো Algorithm-এর বৈশিষ্ট্য: স্পষ্টতা, সসীমতা, Input/Output এবং কার্যকর ধাপ। **IPO Model:** Input → Process → Output। যেমন তিনটি সংখ্যার Average: Input 3টি সংখ্যা; Process Sum/3; Output Average। প্রোগ্রামের আগে IPO লিখলে Variable ও Logic নির্ধারণ সহজ হয়।"},{"ch":5,"title":"Flowchart: প্রতীক, Decision ও Loop","minutes":30,"trap":"Flowchart-এর Arrow ছাড়া শুধু কয়েকটি Box আঁকলে Execution Order বোঝা যায় না।","drills":[{"q":"Decision-এর প্রতীক কী?","a":"Diamond।"},{"q":"Input/Output-এর প্রতীক কী?","a":"Parallelogram।"}],"id":"5_2","index":2,"html":"<p><strong>Flowchart</strong> Algorithm-এর চিত্ররূপ। <strong>Oval:</strong> Start/End; <strong>Parallelogram:</strong> Input/Output; <strong>Rectangle:</strong> Processing/Assignment; <strong>Diamond:</strong> Decision; <strong>Arrow:</strong> Control Flow। Decision Symbol থেকে সাধারণত True/False Branch থাকে।</p>\n<p><strong>Flowchart আঁকার নিয়ম:</strong> Start থেকে Begin → Input → Process → Decision → Output → End। Loop দরকার হলে Arrow আবার Condition-এ ফিরে যাবে। Diagram-এ Variable Update ভুলে গেলে Infinite Loop হতে পারে।</p>\n<p><strong>ভুল এড়াও:</strong> Condition Diamond-এর বদলে Rectangle-এ লিখবে না; Loop-এর Exit Path থাকতে হবে। Short-answer-এ প্রতীক শুধু নাম নয়, কাজসহ লেখো।</p>\n","workedHtml":"<p>জোড়/বিজোড় Flowchart-এর Text Path:</p>\n<p><code>Start → Input n → [n % 2 == 0 ?] → (Yes → Print Even) / (No → Print Odd) → End</code>।</p>\n<p>কেন Diamond? কারণ <code>n % 2 == 0</code> একটি True/False সিদ্ধান্ত।</p>\n","search":"**Flowchart** Algorithm-এর চিত্ররূপ। **Oval:** Start/End; **Parallelogram:** Input/Output; **Rectangle:** Processing/Assignment; **Diamond:** Decision; **Arrow:** Control Flow। Decision Symbol থেকে সাধারণত True/False Branch থাকে। **Flowchart আঁকার নিয়ম:** Start থেকে Begin → Input → Process → Decision → Output → End। Loop দরকার হলে Arrow আবার Condition-এ ফিরে যাবে। Diagram-এ Variable Update ভুলে গেলে Infinite Loop হতে পারে। **ভুল এড়াও:** Condition Diamond-এর বদলে Rectangle-এ লিখবে না; Loop-এর Exit Path থাকতে হবে। Short-answer-এ প্রতীক শুধু নাম নয়, কাজসহ লেখো।"},{"ch":5,"title":"প্রথম C Program: Structure ও Syntax","minutes":28,"trap":"C-তে `=` ও `==`, Uppercase ও Lowercase আলাদা—সতর্ক থাকো।","drills":[{"q":"C File-এর Extension কী?","a":"সাধারণত .c।"},{"q":"C Case-sensitive মানে কী?","a":"বড় ও ছোট হাতের Letter আলাদা হিসেবে গণ্য হয়।"}],"id":"5_3","index":3,"html":"<p>C হলো সাধারণ উদ্দেশ্যের Compiled Programming Language। সাধারণ Program-এ <code>#include &lt;stdio.h&gt;</code> দিয়ে Input/Output Library Declaration পাওয়া যায়; <code>int main(void)</code> Entry Function; <code>{}</code> Block; প্রতিটি Statement সাধারণত <code>;</code> দিয়ে শেষ হয়। <code>return 0;</code> প্রচলিতভাবে সফল সমাপ্তির ইঙ্গিত দেয়।</p>\n<p><strong>Comments:</strong> <code>//</code> এক লাইন, <code>/* ... */</code> একাধিক লাইন। <strong>Identifier:</strong> Variable/Function-এর নাম; Digit দিয়ে শুরু করা যায় না, Space রাখা যায় না এবং Keyword (যেমন <code>int</code>) নাম হিসেবে ব্যবহার করা যায় না। C Case-sensitive: <code>sum</code> ও <code>Sum</code> আলাদা।</p>\n<p><strong>Compile, Run, Check:</strong> Editor-এ Source লেখো → Save <code>.c</code> → Compiler দিয়ে Build → Execute → Output পরীক্ষা। ওয়েবসাইটের Code Examples এখানে লিখে শেখার উপকরণ; Browser নিজে C Compile করে না।</p>\n","workedHtml":"<pre><code class=\"language-c\">#include &lt;stdio.h&gt;\nint main(void) {\n    printf(&quot;Hello, HSC 2028!\\n&quot;);\n    return 0;\n}\n</code></pre>\n<p>এখানে <code>\\n</code> নতুন Line নির্দেশ করে। <code>printf</code> Output দেখায়, Program-এর Logic <code>main</code>-এ শুরু হয়।</p>\n","search":"C হলো সাধারণ উদ্দেশ্যের Compiled Programming Language। সাধারণ Program-এ `#include <stdio.h>` দিয়ে Input/Output Library Declaration পাওয়া যায়; `int main(void)` Entry Function; `{}` Block; প্রতিটি Statement সাধারণত `;` দিয়ে শেষ হয়। `return 0;` প্রচলিতভাবে সফল সমাপ্তির ইঙ্গিত দেয়। **Comments:** `//` এক লাইন, `/* ... */` একাধিক লাইন। **Identifier:** Variable/Function-এর নাম; Digit দিয়ে শুরু করা যায় না, Space রাখা যায় না এবং Keyword (যেমন `int`) নাম হিসেবে ব্যবহার করা যায় না। C Case-sensitive: `sum` ও `Sum` আলাদা। **Compile, Run, Check:** Editor-এ Source লেখো → Save `.c` → Compiler দিয়ে Build → Execute → Output পরীক্ষা। ওয়েবসাইটের Code Examples এখানে লিখে শেখার উপকরণ; Browser নিজে C Compile করে না।"},{"ch":5,"title":"Data Type, Variable, Constant ও Operator","minutes":30,"trap":"`7/2=3.5` লিখলে C-র Integer Division ভুল হবে; Operand-এর Type দেখো।","drills":[{"q":"7 % 2 কত?","a":"1।"},{"q":"সমতা তুলনায় কোন Operator?","a":"==।"}],"id":"5_4","index":4,"html":"<p><strong>Data Type</strong> Variable-এ কী ধরনের মান রাখা হবে তা নির্ধারণ করে। <code>int</code> পূর্ণসংখ্যা; <code>float</code> দশমিক Floating Point; <code>double</code> বেশি Precision; <code>char</code> এক Character (সংখ্যাগত Character Code হিসেবে)। <strong>Constant</strong> পরিবর্তন না হওয়া মান; <code>const int limit = 10;</code> একটি উদাহরণ।</p>\n<p><strong>Arithmetic Operators:</strong> <code>+ - * / %</code>। Integer Division-এ উভয় Operand int হলে ভগ্নাংশ বাদ যায়: <code>7/2 = 3</code>। <code>%</code> Integer Remainder দেয়। <strong>Relational:</strong> <code>&lt; &lt;= &gt; &gt;= == !=</code>। <strong>Logical:</strong> <code>&amp;&amp;</code> (AND), <code>||</code> (OR), <code>!</code> (NOT)। <strong>Assignment:</strong> <code>=</code>। <strong>Increment:</strong> <code>i++</code>।</p>\n<p><strong>Operator Precedence:</strong> <code>* / %</code> আগে, <code>+ -</code> পরে; দরকার হলে Parenthesis ব্যবহার করো। মেমোরি সাইজ Platform-dependent হতে পারে; <code>int</code> সবখানে 4 Byte ধরেই Programming করা ঠিক নয়।</p>\n","workedHtml":"<pre><code class=\"language-c\">int a = 7, b = 2;\nprintf(&quot;%d\\n&quot;, a / b);       // 3\nprintf(&quot;%d\\n&quot;, a % b);       // 1\nprintf(&quot;%.1f\\n&quot;, (float)a / b); // 3.5\n</code></pre>\n<p><code>(float)a</code> ব্যবহার করায় Floating-point Division হয়।</p>\n","search":"**Data Type** Variable-এ কী ধরনের মান রাখা হবে তা নির্ধারণ করে। `int` পূর্ণসংখ্যা; `float` দশমিক Floating Point; `double` বেশি Precision; `char` এক Character (সংখ্যাগত Character Code হিসেবে)। **Constant** পরিবর্তন না হওয়া মান; `const int limit = 10;` একটি উদাহরণ। **Arithmetic Operators:** `+ - * / %`। Integer Division-এ উভয় Operand int হলে ভগ্নাংশ বাদ যায়: `7/2 = 3`। `%` Integer Remainder দেয়। **Relational:** `< <= > >= == !=`। **Logical:** `&&` (AND), `||` (OR), `!` (NOT)। **Assignment:** `=`। **Increment:** `i++`। **Operator Precedence:** `* / %` আগে, `+ -` পরে; দরকার হলে Parenthesis ব্যবহার করো। মেমোরি সাইজ Platform-dependent হতে পারে; `int` সবখানে 4 Byte ধরেই Programming করা ঠিক নয়।"},{"ch":5,"title":"printf, scanf এবং Input/Output Formatting","minutes":29,"trap":"`scanf`-এ `int` Variable-এর আগে `&` দিতে ভুললে Program ভুল আচরণ করতে পারে।","drills":[{"q":"scanf-এর `%lf` কোন Type-এর জন্য?","a":"double।"},{"q":"`\\n` কী?","a":"Newline Escape Sequence।"}],"id":"5_5","index":5,"html":"<p><strong><code>printf</code></strong> Output Format করে দেখায়; <strong><code>scanf</code></strong> Format অনুযায়ী Input পড়ে। সাধারণ Specifier: <code>%d</code> (int), <code>%f</code> (<code>printf</code>-এ float/double), <code>%lf</code> (<code>scanf</code>-এ double), <code>%c</code> (char), <code>%s</code> (Character Array/String)। <code>scanf(&quot;%d&quot;, &amp;n);</code>-এ <code>&amp;n</code> n-এর Address দেয়।</p>\n<p><strong>Escape Sequence:</strong> <code>\\n</code> নতুন Line, <code>\\t</code> Tab, <code>\\\\</code> Backslash। Input Format ঠিক না হলে ভুল Data পড়া হতে পারে; Robust Program-এ <code>scanf</code>-এর Return Value পরীক্ষা করা ভালো।</p>\n<p><strong>শিক্ষকের টিপ:</strong> Output প্রশ্নে Format-এর Space, Newline, Decimal Precision দেখে ফল লিখবে। <code>printf(&quot;%.2f&quot;, 2.5)</code>-এ <code>2.50</code>।</p>\n","workedHtml":"<pre><code class=\"language-c\">#include &lt;stdio.h&gt;\nint main(void) {\n    int n;\n    if (scanf(&quot;%d&quot;, &amp;n) != 1) return 1;\n    printf(&quot;Double = %d\\n&quot;, 2*n);\n    return 0;\n}\n</code></pre>\n<p>Input <code>12</code> হলে Output <code>Double = 24</code>।</p>\n","search":"**`printf`** Output Format করে দেখায়; **`scanf`** Format অনুযায়ী Input পড়ে। সাধারণ Specifier: `%d` (int), `%f` (`printf`-এ float/double), `%lf` (`scanf`-এ double), `%c` (char), `%s` (Character Array/String)। `scanf(\"%d\", &n);`-এ `&n` n-এর Address দেয়। **Escape Sequence:** `\\n` নতুন Line, `\\t` Tab, `\\\\` Backslash। Input Format ঠিক না হলে ভুল Data পড়া হতে পারে; Robust Program-এ `scanf`-এর Return Value পরীক্ষা করা ভালো। **শিক্ষকের টিপ:** Output প্রশ্নে Format-এর Space, Newline, Decimal Precision দেখে ফল লিখবে। `printf(\"%.2f\", 2.5)`-এ `2.50`।"},{"ch":5,"title":"if, else ও তুলনামূলক শর্ত","minutes":30,"trap":"`if(n=0)` Assignment; এটি `if(n==0)`-এর সমান নয়।","drills":[{"q":"0 কি True না False?","a":"C-তে False।"},{"q":"`&&` কী বোঝায়?","a":"Logical AND।"}],"id":"5_6","index":6,"html":"<p><strong><code>if</code></strong> Condition সত্য হলে Block চালায়; <strong><code>else</code></strong> Condition মিথ্যা হলে বিকল্প Block। <code>if (n%2==0)</code> দিয়ে Even/Odd; <code>if (age&gt;=18)</code> দিয়ে Eligibility; একই সঙ্গে দুটি শর্ত হলে <code>&amp;&amp;</code>, যেকোনো একটি হলে <code>||</code>।</p>\n<p><strong>Boolean Evaluation in C:</strong> 0 False; Non-zero True। তাই <code>if(5)</code> সত্য। <code>=</code> Assignment, <code>==</code> Comparison—দুটোকে গুলিয়ে ফেলো না। <strong>Boundary Test:</strong> <code>n=0</code>, <code>n=1</code>, <code>n=-1</code>, সমান সংখ্যা—এগুলো দিয়ে পরীক্ষা করলে অনেক ভুল ধরা পড়ে।</p>\n<p><strong>ব্যবহারিক পরীক্ষা:</strong> Program-এর Step-by-step Execution লিখে দেখাও; কোনো Input থেকে কোন Branch চলবে তা নির্ধারণই Dry Run।</p>\n","workedHtml":"<pre><code class=\"language-c\">int n = 18;\nif (n % 2 == 0) {\n    printf(&quot;Even&quot;);\n} else {\n    printf(&quot;Odd&quot;);\n}\n</code></pre>\n<p>18%2=0 → Condition True → Output <strong>Even</strong>।</p>\n","search":"**`if`** Condition সত্য হলে Block চালায়; **`else`** Condition মিথ্যা হলে বিকল্প Block। `if (n%2==0)` দিয়ে Even/Odd; `if (age>=18)` দিয়ে Eligibility; একই সঙ্গে দুটি শর্ত হলে `&&`, যেকোনো একটি হলে `||`। **Boolean Evaluation in C:** 0 False; Non-zero True। তাই `if(5)` সত্য। `=` Assignment, `==` Comparison—দুটোকে গুলিয়ে ফেলো না। **Boundary Test:** `n=0`, `n=1`, `n=-1`, সমান সংখ্যা—এগুলো দিয়ে পরীক্ষা করলে অনেক ভুল ধরা পড়ে। **ব্যবহারিক পরীক্ষা:** Program-এর Step-by-step Execution লিখে দেখাও; কোনো Input থেকে কোন Branch চলবে তা নির্ধারণই Dry Run।"},{"ch":5,"title":"Nested if ও তিনটি সংখ্যার সর্বোচ্চ","minutes":31,"trap":"`>` দিয়ে সব Condition লিখলে Tie-এর ক্ষেত্রে অপ্রত্যাশিত শাখায় যেতে পারে।","drills":[{"q":"তিনটি সংখ্যার Maximum পেতে `&&` কেন?","a":"একই সংখ্যাকে অন্য দুইটির চেয়ে বড় বা সমান হতে হবে।"},{"q":"Grade Condition কেন বড় Threshold থেকে শুরু করা ভালো?","a":"প্রথম সত্য Branch-এ Execution থামে; বড় নম্বর যেন ভুল ছোট Grade না পায়।"}],"id":"5_7","index":7,"html":"<p>একটি <code>if</code> Block-এর ভিতরে অন্য <code>if</code> থাকলে <strong>Nested if</strong>। বহু বিকল্পের জন্য <code>if ... else if ... else</code> ব্যবহার করা যায়। <strong>Maximum of Three:</strong> a&gt;=b এবং a&gt;=c হলে a; নাহলে b&gt;=a এবং b&gt;=c হলে b; অন্যথায় c। সমান সংখ্যা থাকলে <code>&gt;=</code> ব্যবহার করলে নির্ভুল তুলনা হয়।</p>\n<p><strong>Grade Example:</strong> Marks 0–100 হলে Condition Chain; আগে বড় Threshold পরীক্ষা করতে হবে। ভুল Order-এ সব বড় নম্বরও ছোট Grade-এর Branch-এ চলে যেতে পারে। <strong>Input Validation:</strong> Marks ঋণাত্মক বা 100-এর বেশি হলে Invalid বলা উচিত।</p>\n<p>পরীক্ষায় Code-এর পাশে ২টি Test Case দাও: তিনটিই আলাদা এবং দুটি সমান।</p>\n","workedHtml":"<pre><code class=\"language-c\">int a=9, b=14, c=14;\nif(a&gt;=b &amp;&amp; a&gt;=c) puts(&quot;A&quot;);\nelse if(b&gt;=a &amp;&amp; b&gt;=c) puts(&quot;B&quot;);\nelse puts(&quot;C&quot;);\n</code></pre>\n<p>এখানে b এবং c সমান সর্বোচ্চ; দ্বিতীয় শর্ত True, তাই Output <strong>B</strong>। সমান সর্বোচ্চের একটিকে নির্বাচন করা হচ্ছে।</p>\n","search":"একটি `if` Block-এর ভিতরে অন্য `if` থাকলে **Nested if**। বহু বিকল্পের জন্য `if ... else if ... else` ব্যবহার করা যায়। **Maximum of Three:** a>=b এবং a>=c হলে a; নাহলে b>=a এবং b>=c হলে b; অন্যথায় c। সমান সংখ্যা থাকলে `>=` ব্যবহার করলে নির্ভুল তুলনা হয়। **Grade Example:** Marks 0–100 হলে Condition Chain; আগে বড় Threshold পরীক্ষা করতে হবে। ভুল Order-এ সব বড় নম্বরও ছোট Grade-এর Branch-এ চলে যেতে পারে। **Input Validation:** Marks ঋণাত্মক বা 100-এর বেশি হলে Invalid বলা উচিত। পরীক্ষায় Code-এর পাশে ২টি Test Case দাও: তিনটিই আলাদা এবং দুটি সমান।"},{"ch":5,"title":"switch, case, break এবং Menu Program","minutes":28,"trap":"`break` বাদ গেলে Fall-through কীভাবে কাজ করছে সেটি ব্যাখ্যা না করলে Output Tracing ভুল হয়।","drills":[{"q":"কোন Case না মিললে কী চলে?","a":"default, যদি থাকে।"},{"q":"Range Test-এ if কেন সুবিধাজনক?","a":"তুলনামূলক Condition সরাসরি লেখা যায়।"}],"id":"5_8","index":8,"html":"<p><strong><code>switch</code></strong> একটি Expression-এর মান অনুযায়ী নির্দিষ্ট <code>case</code> চালায়। <code>case</code> Label সাধারণত Integral Constant Expression; <code>break</code> ছাড়া পরবর্তী Case-এ <strong>Fall-through</strong> হতে পারে। <code>default</code> কোনো Case না মিললে ব্যবহৃত হয়।</p>\n<p><strong>When to use:</strong> নির্দিষ্ট Option 1/2/3/4 বা Character Code বাছাই। Range (যেমন Marks&gt;=80) পরীক্ষায় সাধারণত <code>if</code> বেশি সহজ। <strong>Nested Switch</strong> সম্ভব, কিন্তু প্রয়োজন ছাড়া Complexity বাড়িও না।</p>\n<p><strong>Common Trap:</strong> <code>switch</code>-এর প্রতিটি Case-এ <code>break</code> না থাকলে আশানুরূপ একটিমাত্র Output নাও হতে পারে।</p>\n","workedHtml":"<pre><code class=\"language-c\">int choice = 2;\nswitch(choice) {\n  case 1: puts(&quot;Add&quot;); break;\n  case 2: puts(&quot;Subtract&quot;); break;\n  case 3: puts(&quot;Multiply&quot;); break;\n  default: puts(&quot;Invalid&quot;);\n}\n</code></pre>\n<p>Output: <strong>Subtract</strong>। <code>break</code>-এ Switch থেকে বের হয়।</p>\n","search":"**`switch`** একটি Expression-এর মান অনুযায়ী নির্দিষ্ট `case` চালায়। `case` Label সাধারণত Integral Constant Expression; `break` ছাড়া পরবর্তী Case-এ **Fall-through** হতে পারে। `default` কোনো Case না মিললে ব্যবহৃত হয়। **When to use:** নির্দিষ্ট Option 1/2/3/4 বা Character Code বাছাই। Range (যেমন Marks>=80) পরীক্ষায় সাধারণত `if` বেশি সহজ। **Nested Switch** সম্ভব, কিন্তু প্রয়োজন ছাড়া Complexity বাড়িও না। **Common Trap:** `switch`-এর প্রতিটি Case-এ `break` না থাকলে আশানুরূপ একটিমাত্র Output নাও হতে পারে।"},{"ch":5,"title":"for Loop ও Pattern of Repetition","minutes":30,"trap":"`i++` ভুলে গেলে Infinite Loop হতে পারে (Condition/Body-এর ওপর নির্ভর করে)।","drills":[{"q":"1 থেকে 5 পর্যন্ত Loop চালাতে Condition কী?","a":"i<=5, যখন i শুরুতে 1 এবং প্রতি Iteration-এ বাড়ে।"},{"q":"`break` কী করে?","a":"নিকটতম Loop/Switch থেকে Control বের করে।"}],"id":"5_9","index":9,"html":"<p><strong><code>for(initialization; condition; update)</code></strong>—তিন অংশে Loop সাধারণত লেখা হয়। প্রথমে Initialization একবার, তারপর Condition, Body, Update এবং আবার Condition। <code>for(int i=1;i&lt;=n;i++)</code> ১ থেকে n পর্যন্ত চলে (n≥1 ধরে)।</p>\n<p><strong>Off-by-one Error:</strong> <code>i&lt;n</code> বনাম <code>i&lt;=n</code>—একটি Iteration কম/বেশি হতে পারে। <strong>Nested Loop</strong>-এ বাহিরের প্রতিটি Iteration-এর জন্য ভেতরের Loop সম্পূর্ণ চলতে পারে; Pattern Printing-এ উপযোগী। <code>break</code> Loop ভাঙে, <code>continue</code> বর্তমান Iteration-এর বাকি অংশ এড়িয়ে পরবর্তী Iteration-এ যায়।</p>\n<p><strong>Dry Run Table</strong>-এ i এবং Sum/Count লিখলে Logic বোঝা সহজ।</p>\n","workedHtml":"<pre><code class=\"language-c\">int s = 0;\nfor(int i=1; i&lt;=4; i++) s += i;\nprintf(&quot;%d&quot;, s);\n</code></pre>\n<p>Dry Run: i=1 → s=1; i=2 → s=3; i=3 → s=6; i=4 → s=10; i=5-এ Condition False। Output <strong>10</strong>।</p>\n","search":"**`for(initialization; condition; update)`**—তিন অংশে Loop সাধারণত লেখা হয়। প্রথমে Initialization একবার, তারপর Condition, Body, Update এবং আবার Condition। `for(int i=1;i<=n;i++)` ১ থেকে n পর্যন্ত চলে (n≥1 ধরে)। **Off-by-one Error:** `i<n` বনাম `i<=n`—একটি Iteration কম/বেশি হতে পারে। **Nested Loop**-এ বাহিরের প্রতিটি Iteration-এর জন্য ভেতরের Loop সম্পূর্ণ চলতে পারে; Pattern Printing-এ উপযোগী। `break` Loop ভাঙে, `continue` বর্তমান Iteration-এর বাকি অংশ এড়িয়ে পরবর্তী Iteration-এ যায়। **Dry Run Table**-এ i এবং Sum/Count লিখলে Logic বোঝা সহজ।"},{"ch":5,"title":"while ও do-while Loop: পার্থক্য","minutes":29,"trap":"do-while-এ শেষে Semicolon অনুপস্থিত থাকলে Syntax Error হয়।","drills":[{"q":"কোন Loop অন্তত একবার Body চালায়?","a":"do-while।"},{"q":"while-এর Condition শুরুতেই False হলে কতবার?","a":"0 বার।"}],"id":"5_10","index":10,"html":"<p><strong><code>while(condition)</code></strong> আগে Condition দেখে, তাই প্রথমেই False হলে একবারও চলে না। <strong><code>do { ... } while(condition);</code></strong> আগে Body চালিয়ে পরে Condition পরীক্ষা করে, তাই Body অন্তত একবার চলে। <code>do-while</code> শেষে <code>;</code> লাগে।</p>\n<p><strong>Count-Controlled</strong> Loop-এ Iteration জানা থাকে; <strong>Sentinel-Controlled</strong>-এ নির্দিষ্ট Input (যেমন −1) না আসা পর্যন্ত চলতে পারে। ভুল Condition বা Update থাকলে Infinite Loop সম্ভব।</p>\n<p><strong>পরীক্ষার টিপ:</strong> একই Input দিয়ে for/while/do-while তুলনা করো; Condition শুরুর সময় False থাকলে প্রভেদ সবচেয়ে পরিষ্কার হয়।</p>\n","workedHtml":"<pre><code class=\"language-c\">int x=5;\nwhile(x&lt;5) { puts(&quot;A&quot;); x++; }\ndo { puts(&quot;B&quot;); x++; } while(x&lt;5);\n</code></pre>\n<p><code>while</code>-এর Condition False, তাই A আসে না; <code>do-while</code> আগে Body চালায়, তাই <strong>B একবার</strong> আসে।</p>\n","search":"**`while(condition)`** আগে Condition দেখে, তাই প্রথমেই False হলে একবারও চলে না। **`do { ... } while(condition);`** আগে Body চালিয়ে পরে Condition পরীক্ষা করে, তাই Body অন্তত একবার চলে। `do-while` শেষে `;` লাগে। **Count-Controlled** Loop-এ Iteration জানা থাকে; **Sentinel-Controlled**-এ নির্দিষ্ট Input (যেমন −1) না আসা পর্যন্ত চলতে পারে। ভুল Condition বা Update থাকলে Infinite Loop সম্ভব। **পরীক্ষার টিপ:** একই Input দিয়ে for/while/do-while তুলনা করো; Condition শুরুর সময় False থাকলে প্রভেদ সবচেয়ে পরিষ্কার হয়।"},{"ch":5,"title":"Sum, Average, Factorial ও Multiplication Table","minutes":31,"trap":"Factorial-এর `f=0` Initialization ভুল; শুরুতে f=1।","drills":[{"q":"0! কত?","a":"1।"},{"q":"1 থেকে n পর্যন্ত যোগফলের Formula কী?","a":"n(n+1)/2।"}],"id":"5_11","index":11,"html":"<p><strong>Sum 1..N:</strong> <code>sum=0</code> দিয়ে শুরু, Loop-এ <code>sum+=i</code>। <strong>Average:</strong> <code>sum/n</code>—দশমিক Average পেতে Floating-point Conversion দরকার। <strong>Factorial:</strong> <code>n! = 1×2×...×n</code>, 0! = 1। Negative Integer-এর Factorial সাধারণ পাঠে সংজ্ঞায়িত নয়।</p>\n<p><strong>Overflow:</strong> Factorial খুব দ্রুত বড় হয়; 32-bit Signed int-এ 13! ধরে না। উদাহরণে <code>unsigned long long</code> ব্যবহার করলেও সর্বোচ্চ সমর্থিত Input সীমা মানতে হবে।</p>\n<p><strong>Multiplication Table:</strong> <code>for(i=1;i&lt;=10;i++) printf(&quot;%d x %d = %d&quot;, n,i,n*i);</code>—একাধিক Iteration-এর ধারণা শক্ত করে।</p>\n","workedHtml":"<pre><code class=\"language-c\">#include &lt;stdio.h&gt;\nint main(void) {\n  int n=5;\n  unsigned long long f=1;\n  for(int i=2;i&lt;=n;i++) f*=i;\n  printf(&quot;%llu&quot;,f);\n  return 0;\n}\n</code></pre>\n<p>5! = 5×4×3×2×1 = <strong>120</strong>। 0 দিলে Loop চলে না, f=1 থাকে।</p>\n","search":"**Sum 1..N:** `sum=0` দিয়ে শুরু, Loop-এ `sum+=i`। **Average:** `sum/n`—দশমিক Average পেতে Floating-point Conversion দরকার। **Factorial:** `n! = 1×2×...×n`, 0! = 1। Negative Integer-এর Factorial সাধারণ পাঠে সংজ্ঞায়িত নয়। **Overflow:** Factorial খুব দ্রুত বড় হয়; 32-bit Signed int-এ 13! ধরে না। উদাহরণে `unsigned long long` ব্যবহার করলেও সর্বোচ্চ সমর্থিত Input সীমা মানতে হবে। **Multiplication Table:** `for(i=1;i<=10;i++) printf(\"%d x %d = %d\", n,i,n*i);`—একাধিক Iteration-এর ধারণা শক্ত করে।"},{"ch":5,"title":"Prime Number, Fibonacci ও Series","minutes":33,"trap":"n=1 কে Prime ধরে নেওয়া সাধারণ ভুল।","drills":[{"q":"2 কি Prime?","a":"হ্যাঁ, 2 একমাত্র জোড় Prime সংখ্যা।"},{"q":"প্রথম 7 Fibonacci Term লেখো।","a":"0, 1, 1, 2, 3, 5, 8।"}],"id":"5_12","index":12,"html":"<p><strong>Prime Number:</strong> 1-এর বড় ধনাত্মক পূর্ণসংখ্যা যার ধনাত্মক ভাজক কেবল 1 ও নিজে। 1 Prime নয়, 2 প্রথম Prime। n Prime কি না জানতে 2 থেকে √n পর্যন্ত ভাজক খুঁজলেই যথেষ্ট। <strong>Fibonacci:</strong> 0,1 দিয়ে শুরু করলে পরের প্রতিটি Term আগের দুটি Term-এর যোগফল: 0,1,1,2,3,5,8…।</p>\n<p><strong>Series Problem:</strong> Pattern দেখে Initial Value, Update, Termination নির্ধারণ করো। Prime Check-এ n&lt;2 আলাদাভাবে Handle না করলে 1 ভুলভাবে Prime হতে পারে। Fibonacci-এর Count আর শেষ মান আলাদা: ‘প্রথম 7 Term’ বনাম ‘7 পর্যন্ত Terms’।</p>\n<p><strong>Trace Method:</strong> Variable a,b,next আলাদা Column-এ লিখো; একসঙ্গে Update-এর Order ভুললে Sequence নষ্ট হয়।</p>\n","workedHtml":"<pre><code class=\"language-c\">int n=13, prime=(n&gt;=2);\nfor(int i=2;i&lt;=n/i;i++) {\n  if(n%i==0) { prime=0; break; }\n}\nprintf(prime ? &quot;Prime&quot; : &quot;Not prime&quot;);\n</code></pre>\n<p>13-এর 2 বা 3 দিয়ে ভাগ যায় না → <strong>Prime</strong>।</p>\n","search":"**Prime Number:** 1-এর বড় ধনাত্মক পূর্ণসংখ্যা যার ধনাত্মক ভাজক কেবল 1 ও নিজে। 1 Prime নয়, 2 প্রথম Prime। n Prime কি না জানতে 2 থেকে √n পর্যন্ত ভাজক খুঁজলেই যথেষ্ট। **Fibonacci:** 0,1 দিয়ে শুরু করলে পরের প্রতিটি Term আগের দুটি Term-এর যোগফল: 0,1,1,2,3,5,8…। **Series Problem:** Pattern দেখে Initial Value, Update, Termination নির্ধারণ করো। Prime Check-এ n<2 আলাদাভাবে Handle না করলে 1 ভুলভাবে Prime হতে পারে। Fibonacci-এর Count আর শেষ মান আলাদা: ‘প্রথম 7 Term’ বনাম ‘7 পর্যন্ত Terms’। **Trace Method:** Variable a,b,next আলাদা Column-এ লিখো; একসঙ্গে Update-এর Order ভুললে Sequence নষ্ট হয়।"},{"ch":5,"title":"Array, Index, Traversal ও Searching","minutes":31,"trap":"5 Element-এর Last Index 5 নয়, 4।","drills":[{"q":"int a[6]-এর শেষ বৈধ Index কত?","a":"5।"},{"q":"Linear Search কী?","a":"Array-এর Element একে একে পরীক্ষা করে Value খোঁজা।"}],"id":"5_13","index":13,"html":"<p><strong>Array</strong> একই Type-এর একাধিক Value ধারাবাহিকভাবে রাখে; <code>int a[5]</code>-এ Index হলো 0,1,2,3,4। <strong>Traversal</strong> প্রতিটি Element পর্যায়ক্রমে দেখা; <strong>Searching</strong> নির্দিষ্ট Value খোঁজা; <strong>Linear Search</strong> প্রথম থেকে একে একে তুলনা করে।</p>\n<p><strong>Maximum/Minimum:</strong> প্রথম Element-কে Initial Value ধরো (Array খালি নয় ধরে), পরে অন্যগুলোর সঙ্গে তুলনা করো। <strong>Boundary:</strong> <code>a[5]</code> Size 5 হলে <code>a[5]</code> বৈধ Element নয়; এটি Out-of-bounds Access এবং অনির্ধারিত আচরণ ঘটাতে পারে।</p>\n<p>পরীক্ষায় Array-এর Index-সহ Trace Table তৈরি করলে ভুল কমে।</p>\n","workedHtml":"<pre><code class=\"language-c\">int a[5]={7,19,4,21,12};\nint mx=a[0];\nfor(int i=1;i&lt;5;i++) {\n  if(a[i]&gt;mx) mx=a[i];\n}\nprintf(&quot;%d&quot;,mx);\n</code></pre>\n<p>7 → 19 → 19 → 21 → 21; Output <strong>21</strong>।</p>\n","search":"**Array** একই Type-এর একাধিক Value ধারাবাহিকভাবে রাখে; `int a[5]`-এ Index হলো 0,1,2,3,4। **Traversal** প্রতিটি Element পর্যায়ক্রমে দেখা; **Searching** নির্দিষ্ট Value খোঁজা; **Linear Search** প্রথম থেকে একে একে তুলনা করে। **Maximum/Minimum:** প্রথম Element-কে Initial Value ধরো (Array খালি নয় ধরে), পরে অন্যগুলোর সঙ্গে তুলনা করো। **Boundary:** `a[5]` Size 5 হলে `a[5]` বৈধ Element নয়; এটি Out-of-bounds Access এবং অনির্ধারিত আচরণ ঘটাতে পারে। পরীক্ষায় Array-এর Index-সহ Trace Table তৈরি করলে ভুল কমে।"},{"ch":5,"title":"String, Character, Function ও Scope","minutes":32,"trap":"String-এর Character Count আর Array Capacity এক নয়; Null Terminator-এর জায়গা লাগবে।","drills":[{"q":"`\\0` কী?","a":"C String-এর Null Terminator Character।"},{"q":"Function-এর Parameter কী?","a":"Function-এ Input Value গ্রহণের জন্য ঘোষিত Variable।"}],"id":"5_14","index":14,"html":"<p>C-তে <strong>String</strong> সাধারণত <code>char</code> Array-এ Null Terminator <code>\\0</code>-সহ রাখা হয়। <code>char name[6]=&quot;Rifat&quot;;</code>-এ 5টি Letter + 1 Null Byte। <code>&lt;string.h&gt;</code>-এ <code>strlen</code>, <code>strcmp</code>, <code>strcpy</code> ইত্যাদি Function আছে; Buffer Size বুঝে নিরাপদভাবে ব্যবহার করতে হয়।</p>\n<p><strong>Function:</strong> পুনর্ব্যবহারযোগ্য Code Unit। Function-এর Return Type, Name, Parameter এবং Body থাকে; যেমন <code>int square(int x){return x*x;}</code>। <strong>Local Variable</strong> সাধারণত সংশ্লিষ্ট Block/Function Scope-এ সীমিত; <strong>Global Variable</strong> File Scope-এ থাকতে পারে। <strong>Library Function</strong> আগে তৈরি, <strong>User-defined Function</strong> নিজে লেখা।</p>\n<p><strong>Pass by Value:</strong> সাধারণ C Function-এ Argument-এর Value কপি হয়; Caller-এর Variable বদলাতে Pointer ব্যবহার করতে হতে পারে।</p>\n","workedHtml":"<pre><code class=\"language-c\">#include &lt;stdio.h&gt;\nint square(int x) { return x*x; }\nint main(void) {\n  printf(&quot;%d&quot;,square(6));\n  return 0;\n}\n</code></pre>\n<p>6×6 = <strong>36</strong>। <code>square</code> Return করা Integer <code>printf</code> দেখায়।</p>\n","search":"C-তে **String** সাধারণত `char` Array-এ Null Terminator `\\0`-সহ রাখা হয়। `char name[6]=\"Rifat\";`-এ 5টি Letter + 1 Null Byte। `<string.h>`-এ `strlen`, `strcmp`, `strcpy` ইত্যাদি Function আছে; Buffer Size বুঝে নিরাপদভাবে ব্যবহার করতে হয়। **Function:** পুনর্ব্যবহারযোগ্য Code Unit। Function-এর Return Type, Name, Parameter এবং Body থাকে; যেমন `int square(int x){return x*x;}`। **Local Variable** সাধারণত সংশ্লিষ্ট Block/Function Scope-এ সীমিত; **Global Variable** File Scope-এ থাকতে পারে। **Library Function** আগে তৈরি, **User-defined Function** নিজে লেখা। **Pass by Value:** সাধারণ C Function-এ Argument-এর Value কপি হয়; Caller-এর Variable বদলাতে Pointer ব্যবহার করতে হতে পারে।"},{"ch":5,"title":"Complete Programming Revision: Debugging ও Dry Run","minutes":34,"trap":"Sample Program Copy করলে নতুন Input-এ ভুল ধরতে না-ও পারো; প্রতিবার Dry Run করো।","drills":[{"q":"Code Debug করার প্রথম ধাপ কী?","a":"Expected Output ও Actual Output তুলনা।"},{"q":"`i<5` এবং `i<=5`-এর পার্থক্য?","a":"দ্বিতীয়টি i=5 অন্তর্ভুক্ত করে।"}],"id":"5_15","index":15,"html":"<p>পরীক্ষায় ভালো করতে <strong>Code লিখতে পারা + Code পড়তে পারা</strong>—দুটিই প্রয়োজন। ভুলের প্রধান ধরন: Syntax (<code>;</code>/Bracket), Type (<code>int</code> Division), Logic (<code>&gt;</code> বনাম <code>&gt;=</code>), Boundary (Loop Count), Array Index, Uninitialized Variable, Unsupported Input।</p>\n<p><strong>Debug Process:</strong> (1) Expected Output লেখো, (2) Sample Input দাও, (3) Variable-গুলোর Dry Run Table বানাও, (4) প্রথম ভুল Step খুঁজে বের করো, (5) পরিবর্তন করে আবার Test। একমাত্র ‘সঠিক Code মুখস্থ’ দিয়ে নতুন CQ-এর ঘ অংশ সমাধান হয় না।</p>\n<p><strong>Practice Set:</strong> Positive/Negative/Zero, Odd/Even, Max of Three, Sum &amp; Average, Factorial, Prime, Fibonacci, Array Max, Linear Search, Multiplication Table—অন্তত দশটি নিজে না দেখে লেখো।</p>\n","workedHtml":"<pre><code class=\"language-c\">int sum=0;\nfor(int i=1;i&lt;5;i++) sum+=i;\nprintf(&quot;%d&quot;,sum);\n</code></pre>\n<p>শিক্ষার্থীর প্রত্যাশা 15, কিন্তু Output <strong>10</strong>। কারণ <code>i&lt;5</code>-এ i=5 অন্তর্ভুক্ত নয়। ১ থেকে ৫ পর্যন্ত যোগ করতে <code>i&lt;=5</code>। এটি <strong>Off-by-one Logic Error</strong>।</p>\n","search":"পরীক্ষায় ভালো করতে **Code লিখতে পারা + Code পড়তে পারা**—দুটিই প্রয়োজন। ভুলের প্রধান ধরন: Syntax (`;`/Bracket), Type (`int` Division), Logic (`>` বনাম `>=`), Boundary (Loop Count), Array Index, Uninitialized Variable, Unsupported Input। **Debug Process:** (1) Expected Output লেখো, (2) Sample Input দাও, (3) Variable-গুলোর Dry Run Table বানাও, (4) প্রথম ভুল Step খুঁজে বের করো, (5) পরিবর্তন করে আবার Test। একমাত্র ‘সঠিক Code মুখস্থ’ দিয়ে নতুন CQ-এর ঘ অংশ সমাধান হয় না। **Practice Set:** Positive/Negative/Zero, Odd/Even, Max of Three, Sum & Average, Factorial, Prime, Fibonacci, Array Max, Linear Search, Multiplication Table—অন্তত দশটি নিজে না দেখে লেখো।"},{"ch":6,"title":"Data, Information, Database ও DBMS","minutes":26,"trap":"Database মানেই Excel Sheet নয়; DBMS সম্পর্ক, Query ও নিয়ন্ত্রণের আরও সুবিধা দেয়।","drills":[{"q":"DBMS-এর পূর্ণরূপ কী?","a":"Database Management System।"},{"q":"Data আর Information-এর পার্থক্য কী?","a":"Data অপরিশোধিত উপাদান; Information অর্থপূর্ণ প্রক্রিয়াজাত ফল।"}],"id":"6_0","index":0,"html":"<p><strong>Data</strong> হলো কাঁচা তথ্যউপাদান, যেমন 4.5, 5.0, 4.7; <strong>Information</strong> হলো বিশ্লেষিত অর্থপূর্ণ ফল, যেমন ‘তিন শিক্ষার্থীর গড় GPA 4.73’। <strong>Database</strong> একটি সংগঠিত তথ্যসমষ্টি, যেখানে সুশৃঙ্খলভাবে তথ্য রাখা, খোঁজা ও সংশোধন করা যায়। <strong>DBMS</strong> (Database Management System) Database তৈরি, Query, Update, Permission ও Data Integrity বজায় রাখতে ব্যবহৃত Software।</p>\n<p><strong>File-based Storage-এর সীমা:</strong> একই Data বারবার, অসংগতি, Search/Update কঠিন, একাধিক ব্যবহারকারীর সমন্বয় সমস্যা। <strong>DBMS-এর সুবিধা:</strong> Central Organization, Query, Access Control, Backup, Consistency ও Relationship। তবে DBMS-এ পরিকল্পনা, নিরাপত্তা, দক্ষতা ও Resource প্রয়োজন।</p>\n<p>CQ-তে College Result System ধরো: শিক্ষার্থী, বিষয়, নম্বর, শিক্ষকের তথ্য আলাদা Table করে সম্পর্ক স্থাপন করা যায়।</p>\n","workedHtml":"<p>ডেটা: <code>Rahim, 5.00</code>, <code>Karim, 4.50</code>। Information: ‘এই দুই শিক্ষার্থীর গড় GPA 4.75’।</p>\n<p>Database-এ Raw Data রাখা ও Query দিয়ে প্রয়োজনমতো Information বের করা সম্ভব।</p>\n","search":"**Data** হলো কাঁচা তথ্যউপাদান, যেমন 4.5, 5.0, 4.7; **Information** হলো বিশ্লেষিত অর্থপূর্ণ ফল, যেমন ‘তিন শিক্ষার্থীর গড় GPA 4.73’। **Database** একটি সংগঠিত তথ্যসমষ্টি, যেখানে সুশৃঙ্খলভাবে তথ্য রাখা, খোঁজা ও সংশোধন করা যায়। **DBMS** (Database Management System) Database তৈরি, Query, Update, Permission ও Data Integrity বজায় রাখতে ব্যবহৃত Software। **File-based Storage-এর সীমা:** একই Data বারবার, অসংগতি, Search/Update কঠিন, একাধিক ব্যবহারকারীর সমন্বয় সমস্যা। **DBMS-এর সুবিধা:** Central Organization, Query, Access Control, Backup, Consistency ও Relationship। তবে DBMS-এ পরিকল্পনা, নিরাপত্তা, দক্ষতা ও Resource প্রয়োজন। CQ-তে College Result System ধরো: শিক্ষার্থী, বিষয়, নম্বর, শিক্ষকের তথ্য আলাদা Table করে সম্পর্ক স্থাপন করা যায়।"},{"ch":6,"title":"Table, Field, Record, Data Type ও Null","minutes":27,"trap":"NULL = 0 নয়, এবং NULL = Empty String-ও নয়।","drills":[{"q":"Field ও Record-এর পার্থক্য কী?","a":"Field একটি Column/বৈশিষ্ট্য; Record একটি Row/তথ্যসারি।"},{"q":"NULL পরীক্ষা করতে কোন SQL Operator?","a":"IS NULL বা IS NOT NULL।"}],"id":"6_1","index":1,"html":"<p><strong>Relational Table:</strong> Column = Field/Attribute; Row = Record/Tuple। <strong>Schema</strong> Table-এর গঠন (Field/Type/Constraint); <strong>Data</strong> বর্তমান Row-গুলো। Common Data Type: <code>INT</code> পূর্ণসংখ্যা, <code>VARCHAR(n)</code> Variable-length Text, <code>CHAR(n)</code> Fixed-length Text, <code>DATE</code> Date, <code>DECIMAL(p,s)</code> নির্দিষ্ট Precision-এর দশমিক। নির্দিষ্ট DBMS অনুযায়ী Syntax/Type ভিন্ন হতে পারে।</p>\n<p><strong>NULL</strong> হলো Data অনুপস্থিত/অজানা/প্রযোজ্য নয়—এটি 0 কিংবা Empty String-এর সমান নয়। <code>WHERE Phone IS NULL</code> দিয়ে NULL পরীক্ষা করা হয়; <code>Phone = NULL</code> যথাযথ SQL Predicate নয়।</p>\n<p><strong>Design Principle:</strong> StudentID-তে Integer/Identifier, Name Text, DOB Date, GPA Numeric; সব তথ্য Text বানালে Data Validation ও Comparison কঠিন হয়।</p>\n","workedHtml":"<p><code>Students(StudentID INT, Name VARCHAR(60), GPA DECIMAL(3,2))</code>-তে 3 হলো মোট Digit, 2 হলো Decimal-এর পরে Digit। GPA 5.00 রাখা যায়। Database ভেদে Type সীমা ও আচরণ যাচাই করতে হয়।</p>\n","search":"**Relational Table:** Column = Field/Attribute; Row = Record/Tuple। **Schema** Table-এর গঠন (Field/Type/Constraint); **Data** বর্তমান Row-গুলো। Common Data Type: `INT` পূর্ণসংখ্যা, `VARCHAR(n)` Variable-length Text, `CHAR(n)` Fixed-length Text, `DATE` Date, `DECIMAL(p,s)` নির্দিষ্ট Precision-এর দশমিক। নির্দিষ্ট DBMS অনুযায়ী Syntax/Type ভিন্ন হতে পারে। **NULL** হলো Data অনুপস্থিত/অজানা/প্রযোজ্য নয়—এটি 0 কিংবা Empty String-এর সমান নয়। `WHERE Phone IS NULL` দিয়ে NULL পরীক্ষা করা হয়; `Phone = NULL` যথাযথ SQL Predicate নয়। **Design Principle:** StudentID-তে Integer/Identifier, Name Text, DOB Date, GPA Numeric; সব তথ্য Text বানালে Data Validation ও Comparison কঠিন হয়।"},{"ch":6,"title":"Primary, Candidate, Foreign, Composite ও Unique Key","minutes":29,"trap":"Foreign Key নিজে Unique হতে হবে না; One-to-Many Relationship-এ Repeat হতে পারে।","drills":[{"q":"Candidate Key কী?","a":"Row অনন্য শনাক্ত করতে পারে এমন Minimal Attribute Set।"},{"q":"Composite Key কী?","a":"দুই বা ততোধিক Field-এর সমন্বয়ে গঠিত Key।"}],"id":"6_2","index":2,"html":"<p><strong>Super Key</strong> হলো এক বা একাধিক Field-এর সেট যা Row অনন্যভাবে শনাক্ত করতে পারে। <strong>Candidate Key</strong> হলো Minimal Super Key; কোনো Field বাদ দিলে অনন্যতা আর থাকে না। <strong>Primary Key</strong> নির্বাচিত Candidate Key, যার মান Unique ও NOT NULL। <strong>Alternate Key</strong> হলো নির্বাচিত হয়নি এমন অন্য Candidate Key। <strong>Composite Key</strong> একাধিক Column নিয়ে গঠিত Key।</p>\n<p><strong>Foreign Key</strong> অন্য Table-এর Candidate/Primary Key-কে Reference করে Relationship প্রতিষ্ঠা করতে পারে এবং Referenced Data-এর সঙ্গে সামঞ্জস্য রক্ষায় সাহায্য করে। <strong>Unique Constraint</strong> অনেক DBMS-এ NULL-এর ক্ষেত্রে ভিন্ন নিয়ম অনুসরণ করে; একে Primary Key-এর সমার্থক ভাববে না।</p>\n<p><strong>উদাহরণ:</strong> Students(StudentID PK), Results(StudentID FK, ExamID, Marks); একই শিক্ষার্থীর অনেক Result Row থাকতে পারে।</p>\n","workedHtml":"<p><code>Enrollment(StudentID, CourseID, EnrollDate)</code> Table-এ এক শিক্ষার্থী একটি Course-এ একবারই ভর্তি হতে পারে ধরে <code>(StudentID,CourseID)</code> Composite Primary Key হতে পারে। শুধু StudentID Key হলে একটি ছাত্র একাধিক Course নিতে পারত না।</p>\n","search":"**Super Key** হলো এক বা একাধিক Field-এর সেট যা Row অনন্যভাবে শনাক্ত করতে পারে। **Candidate Key** হলো Minimal Super Key; কোনো Field বাদ দিলে অনন্যতা আর থাকে না। **Primary Key** নির্বাচিত Candidate Key, যার মান Unique ও NOT NULL। **Alternate Key** হলো নির্বাচিত হয়নি এমন অন্য Candidate Key। **Composite Key** একাধিক Column নিয়ে গঠিত Key। **Foreign Key** অন্য Table-এর Candidate/Primary Key-কে Reference করে Relationship প্রতিষ্ঠা করতে পারে এবং Referenced Data-এর সঙ্গে সামঞ্জস্য রক্ষায় সাহায্য করে। **Unique Constraint** অনেক DBMS-এ NULL-এর ক্ষেত্রে ভিন্ন নিয়ম অনুসরণ করে; একে Primary Key-এর সমার্থক ভাববে না। **উদাহরণ:** Students(StudentID PK), Results(StudentID FK, ExamID, Marks); একই শিক্ষার্থীর অনেক Result Row থাকতে পারে।"},{"ch":6,"title":"Relational Database: 1:1, 1:M ও M:N","minutes":29,"trap":"M:N Relationship-কে সাধারণত একই Table-এ বহুসংখ্যক CourseId Column রেখে ভালোভাবে সমাধান করা যায় না।","drills":[{"q":"Student–Results-এর সাধারণ Relationship?","a":"One-to-Many।"},{"q":"Many-to-Many বাস্তবায়নে কী ব্যবহৃত হয়?","a":"Junction/Bridge Table।"}],"id":"6_3","index":3,"html":"<p><strong>One-to-One (1:1):</strong> এক Record অন্য Table-এর সর্বোচ্চ একটি Record-এর সঙ্গে যুক্ত; উদাহরণ Employee ও একটি নির্দিষ্ট Staff Profile (Design অনুযায়ী)। <strong>One-to-Many (1:M):</strong> একটি Student-এর একাধিক Result; <strong>Many-to-Many (M:N):</strong> অনেক Student অনেক Course নিতে পারে।</p>\n<p>Relational Database-এ M:N Relationship সাধারণত <strong>Junction/Bridge Table</strong> দিয়ে বাস্তবায়ন করা হয়: Students, Courses, Enrollments। Enrollments-এ StudentID ও CourseID Foreign Key; একই Row জোড়ার Uniqueness Composite Key দিয়ে রক্ষা করা যায়।</p>\n<p>CQ-তে Relationship ধরার কৌশল: ‘একটির কতগুলি অন্য রেকর্ড?’ এবং ‘বিপরীত দিকে কতগুলি?’—দুই প্রশ্ন করো।</p>\n","workedHtml":"<p>এক কলেজে এক Student চারটি Course নেয়, আবার এক Course-এ ৩০ জন Student পড়তে পারে। এটি <strong>Many-to-Many</strong>। সম্পর্কের জন্য:</p>\n<p><code>Students(StudentID PK)</code> ← <code>Enrollments(StudentID FK, CourseID FK)</code> → <code>Courses(CourseID PK)</code>।</p>\n","search":"**One-to-One (1:1):** এক Record অন্য Table-এর সর্বোচ্চ একটি Record-এর সঙ্গে যুক্ত; উদাহরণ Employee ও একটি নির্দিষ্ট Staff Profile (Design অনুযায়ী)। **One-to-Many (1:M):** একটি Student-এর একাধিক Result; **Many-to-Many (M:N):** অনেক Student অনেক Course নিতে পারে। Relational Database-এ M:N Relationship সাধারণত **Junction/Bridge Table** দিয়ে বাস্তবায়ন করা হয়: Students, Courses, Enrollments। Enrollments-এ StudentID ও CourseID Foreign Key; একই Row জোড়ার Uniqueness Composite Key দিয়ে রক্ষা করা যায়। CQ-তে Relationship ধরার কৌশল: ‘একটির কতগুলি অন্য রেকর্ড?’ এবং ‘বিপরীত দিকে কতগুলি?’—দুই প্রশ্ন করো।"},{"ch":6,"title":"Data Redundancy, Anomaly ও Normalization","minutes":28,"trap":"Normalization সবসময় সর্বাধিক টেবিল বানানো নয়; ব্যবহার ও Integrity দেখে Design করতে হয়।","drills":[{"q":"Update Anomaly কী?","a":"একই তথ্য বহু স্থানে থাকায় পরিবর্তনের পরে অসঙ্গতি তৈরি হওয়া।"},{"q":"Normalization-এর একটি লক্ষ্য লেখো।","a":"অপ্রয়োজনীয় Data Duplication ও Anomaly কমানো।"}],"id":"6_4","index":4,"html":"<p><strong>Data Redundancy:</strong> একই তথ্য অপ্রয়োজনে বহুবার রাখা। এতে <strong>Update Anomaly</strong> (এক জায়গা বদলে অন্য জায়গা না বদলানো), <strong>Insert Anomaly</strong> (সম্পর্কহীন তথ্য ছাড়া নতুন Row যোগ করা কঠিন), <strong>Delete Anomaly</strong> (Row মুছতে গিয়ে দরকারি তথ্য হারানো) হতে পারে।</p>\n<p><strong>Normalization:</strong> Data যথাযথ Table-এ ভাগ করে Redundancy ও Anomaly কমানোর নকশা-পদ্ধতি। <strong>1NF</strong>-এ সাধারণভাবে প্রতিটি Cell-এ একটি Atomic Value ও Repeating Group দূর করা; <strong>2NF</strong>-এ Composite Key-এর অংশের ওপর Partial Dependency দূর; <strong>3NF</strong>-এ Key-নির্ভর নয় এমন Transitive Dependency কমানো—এই সহজ পরীক্ষাভিত্তিক পরিচিতি যথেষ্ট ভিত্তি।</p>\n<p><strong>উদাহরণ:</strong> Student Name প্রতিটি Result Row-এ লেখার বদলে Students Table-এ একবার রেখে StudentID দিয়ে Reference করা।</p>\n","workedHtml":"<p>আগে: <code>Results(StudentID, StudentName, ExamID, Mark)</code>—এক Student ২০টি পরীক্ষায় অংশ নিলে Name ২০বার।</p>\n<p>পরে: <code>Students(StudentID,StudentName)</code> + <code>Results(StudentID,ExamID,Mark)</code>। Name পরিবর্তন একটি Table-এ করলেই যথেষ্ট।</p>\n","search":"**Data Redundancy:** একই তথ্য অপ্রয়োজনে বহুবার রাখা। এতে **Update Anomaly** (এক জায়গা বদলে অন্য জায়গা না বদলানো), **Insert Anomaly** (সম্পর্কহীন তথ্য ছাড়া নতুন Row যোগ করা কঠিন), **Delete Anomaly** (Row মুছতে গিয়ে দরকারি তথ্য হারানো) হতে পারে। **Normalization:** Data যথাযথ Table-এ ভাগ করে Redundancy ও Anomaly কমানোর নকশা-পদ্ধতি। **1NF**-এ সাধারণভাবে প্রতিটি Cell-এ একটি Atomic Value ও Repeating Group দূর করা; **2NF**-এ Composite Key-এর অংশের ওপর Partial Dependency দূর; **3NF**-এ Key-নির্ভর নয় এমন Transitive Dependency কমানো—এই সহজ পরীক্ষাভিত্তিক পরিচিতি যথেষ্ট ভিত্তি। **উদাহরণ:** Student Name প্রতিটি Result Row-এ লেখার বদলে Students Table-এ একবার রেখে StudentID দিয়ে Reference করা।"},{"ch":6,"title":"SQL পরিচিতি, CREATE TABLE ও Constraint","minutes":30,"trap":"`DELETE` ও `DROP` একই নয়: একটিতে Row, অন্যটিতে Table Object মুছতে পারে।","drills":[{"q":"Table তৈরি করার SQL Command?","a":"CREATE TABLE।"},{"q":"NOT NULL Constraint কী করে?","a":"Field-এ NULL Value নিষিদ্ধ করে।"}],"id":"6_5","index":5,"html":"<p><strong>SQL</strong> Relational Database-এ Data সংজ্ঞায়িত, অনুসন্ধান ও পরিবর্তনে ব্যবহৃত ভাষা। <strong>DDL:</strong> <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>; <strong>DML:</strong> <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>; <strong>Query:</strong> <code>SELECT</code>। <code>PRIMARY KEY</code>, <code>NOT NULL</code>, <code>UNIQUE</code>, <code>FOREIGN KEY</code>-র মতো Constraint Data Integrity রক্ষা করে।</p>\n<p>SQL-এ Text সাধারণত Single Quote দিয়ে লেখা হয়; Numeric Literal-এ Quote প্রয়োজন নেই। Database অনুযায়ী Syntax ভিন্ন হতে পারে; এখানে সাধারণ Standard-সম্মত উদাহরণ দেওয়া হয়েছে।</p>\n<p><strong>সতর্কতা:</strong> <code>DROP TABLE</code> পুরো Table মুছে দিতে পারে; <code>DELETE FROM ... WHERE</code> নির্দিষ্ট Row মুছতে পারে। পরীক্ষায় Operation-এর প্রভাব বুঝে লিখবে।</p>\n","workedHtml":"<pre><code class=\"language-sql\">CREATE TABLE Students (\n  StudentID INT PRIMARY KEY,\n  Name VARCHAR(60) NOT NULL,\n  GPA DECIMAL(3,2)\n);\n</code></pre>\n<p>এখানে StudentID Unique ও NULL নয়; Name বাধ্যতামূলক; GPA Decimal।</p>\n","search":"**SQL** Relational Database-এ Data সংজ্ঞায়িত, অনুসন্ধান ও পরিবর্তনে ব্যবহৃত ভাষা। **DDL:** `CREATE`, `ALTER`, `DROP`; **DML:** `INSERT`, `UPDATE`, `DELETE`; **Query:** `SELECT`। `PRIMARY KEY`, `NOT NULL`, `UNIQUE`, `FOREIGN KEY`-র মতো Constraint Data Integrity রক্ষা করে। SQL-এ Text সাধারণত Single Quote দিয়ে লেখা হয়; Numeric Literal-এ Quote প্রয়োজন নেই। Database অনুযায়ী Syntax ভিন্ন হতে পারে; এখানে সাধারণ Standard-সম্মত উদাহরণ দেওয়া হয়েছে। **সতর্কতা:** `DROP TABLE` পুরো Table মুছে দিতে পারে; `DELETE FROM ... WHERE` নির্দিষ্ট Row মুছতে পারে। পরীক্ষায় Operation-এর প্রভাব বুঝে লিখবে।"},{"ch":6,"title":"INSERT, UPDATE, DELETE: Data পরিবর্তন","minutes":30,"trap":"`UPDATE Students SET GPA=5.0;` সব Row-এর GPA বদলাতে পারে—এটি বড় ভুল।","drills":[{"q":"কোন Command নতুন Row যোগ করে?","a":"INSERT INTO।"},{"q":"UPDATE-এর সঙ্গে WHERE কেন?","a":"নির্দিষ্ট Row বেছে পরিবর্তন করতে।"}],"id":"6_6","index":6,"html":"<p><strong>INSERT</strong> নতুন Row যোগ করে; <strong>UPDATE</strong> আগে থেকে থাকা Row-এর মান বদলায়; <strong>DELETE</strong> Row মুছে। <strong>WHERE</strong> না দিলে <code>UPDATE</code>-এ সব Row বদলে যেতে পারে এবং <code>DELETE</code>-এ সব Row মুছে যেতে পারে—এটি পরীক্ষায় গুরুত্বপূর্ণ সতর্কতা।</p>\n<p><strong>Transaction:</strong> কয়েকটি কাজ একসঙ্গে সম্পন্ন বা বাতিল করার ধারণা; Bank Transfer-এর মতো কাজে Consistency বজায় রাখতে জরুরি। <strong>Backup</strong> আর Transaction এক নয়; Backup হলো আলাদা কপি/পুনরুদ্ধারের ব্যবস্থা।</p>\n<p>প্রশ্নে নির্দিষ্ট StudentID দেওয়া থাকলে সেই ID দিয়ে WHERE লিখবে; শুধু Name দিয়ে Update করলে একই নামে বহু Row বদলে যেতে পারে।</p>\n","workedHtml":"<pre><code class=\"language-sql\">INSERT INTO Students(StudentID,Name,GPA)\nVALUES (101,'Rima',5.00);\n\nUPDATE Students SET GPA=4.90\nWHERE StudentID=101;\n\nDELETE FROM Students WHERE StudentID=101;\n</code></pre>\n<p>প্রথমে Row যুক্ত, পরে GPA বদল, শেষে সেই Row মুছে যায়।</p>\n","search":"**INSERT** নতুন Row যোগ করে; **UPDATE** আগে থেকে থাকা Row-এর মান বদলায়; **DELETE** Row মুছে। **WHERE** না দিলে `UPDATE`-এ সব Row বদলে যেতে পারে এবং `DELETE`-এ সব Row মুছে যেতে পারে—এটি পরীক্ষায় গুরুত্বপূর্ণ সতর্কতা। **Transaction:** কয়েকটি কাজ একসঙ্গে সম্পন্ন বা বাতিল করার ধারণা; Bank Transfer-এর মতো কাজে Consistency বজায় রাখতে জরুরি। **Backup** আর Transaction এক নয়; Backup হলো আলাদা কপি/পুনরুদ্ধারের ব্যবস্থা। প্রশ্নে নির্দিষ্ট StudentID দেওয়া থাকলে সেই ID দিয়ে WHERE লিখবে; শুধু Name দিয়ে Update করলে একই নামে বহু Row বদলে যেতে পারে।"},{"ch":6,"title":"SELECT, WHERE, AND, OR, LIKE ও NULL","minutes":30,"trap":"`WHERE GPA = NULL` নয়; `WHERE GPA IS NULL`।","drills":[{"q":"SQL-এ বড় থেকে ছোট সাজাতে কী লিখবে?","a":"ORDER BY ... DESC।"},{"q":"Name 'A' দিয়ে শুরু হলে Filter কী?","a":"Name LIKE 'A%'।"}],"id":"6_7","index":7,"html":"<p><strong>SELECT</strong> Data পড়তে; <code>SELECT *</code> সব Column; <code>SELECT Name,GPA</code> নির্দিষ্ট Column। <strong>WHERE</strong> Filtering: <code>=</code>, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>, <code>&lt;&gt;</code>, <code>AND</code>, <code>OR</code>, <code>NOT</code>, <code>IN</code>, <code>BETWEEN</code>, <code>LIKE</code>। <strong>LIKE:</strong> <code>%</code> শূন্য বা একাধিক Character, <code>_</code> সাধারণত এক Character। <strong>NULL:</strong> <code>IS NULL</code> ব্যবহার করতে হয়।</p>\n<p><strong>ORDER BY</strong> Sort করে, <strong>DISTINCT</strong> Duplicate Result Value কমায়। <strong>SQL Logical Order</strong> আনুমানিক: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY। এটি Query বোঝায় সাহায্য করে।</p>\n<p><strong>Case/Collation:</strong> Text Comparison-এর Uppercase/Lowercase Sensitivity DBMS ও Collation-এর ওপর নির্ভর করে।</p>\n","workedHtml":"<pre><code class=\"language-sql\">SELECT Name, GPA\nFROM Students\nWHERE GPA &gt;= 4.80 AND Name LIKE 'R%'\nORDER BY GPA DESC;\n</code></pre>\n<p>অর্থ: যাদের GPA অন্তত 4.80 এবং নাম R দিয়ে শুরু, তাদের বেশি GPA আগে দেখাবে।</p>\n","search":"**SELECT** Data পড়তে; `SELECT *` সব Column; `SELECT Name,GPA` নির্দিষ্ট Column। **WHERE** Filtering: `=`, `>`, `<`, `>=`, `<=`, `<>`, `AND`, `OR`, `NOT`, `IN`, `BETWEEN`, `LIKE`। **LIKE:** `%` শূন্য বা একাধিক Character, `_` সাধারণত এক Character। **NULL:** `IS NULL` ব্যবহার করতে হয়। **ORDER BY** Sort করে, **DISTINCT** Duplicate Result Value কমায়। **SQL Logical Order** আনুমানিক: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY। এটি Query বোঝায় সাহায্য করে। **Case/Collation:** Text Comparison-এর Uppercase/Lowercase Sensitivity DBMS ও Collation-এর ওপর নির্ভর করে।"},{"ch":6,"title":"Aggregate Function, GROUP BY, HAVING ও JOIN","minutes":31,"trap":"Group Aggregate-এর শর্ত WHERE-এ `AVG(GPA)>...` লিখলে অধিকাংশ Standard SQL-এ ভুল হবে।","drills":[{"q":"COUNT(*) কী করে?","a":"Row গণনা করে।"},{"q":"HAVING কখন দরকার?","a":"Group/Aggregate Result-এর ওপর Filter দিতে।"}],"id":"6_8","index":8,"html":"<p><strong>Aggregate Function:</strong> <code>COUNT()</code> Row গণনা, <code>SUM()</code> যোগ, <code>AVG()</code> গড়, <code>MIN()</code> সর্বনিম্ন, <code>MAX()</code> সর্বোচ্চ। <strong>GROUP BY</strong> একই Category অনুযায়ী Row Group করে; <strong>HAVING</strong> Group-এর ওপর Condition দেয়। <code>WHERE</code> সাধারণ Row Filter, <code>HAVING</code> Aggregate Group Filter—পার্থক্যটি গুরুত্বপূর্ণ।</p>\n<p><strong>JOIN</strong> একাধিক Table সম্পর্কের ভিত্তিতে একত্রে Query করে। <code>INNER JOIN</code> মিল পাওয়া Row দেখায়; <code>LEFT JOIN</code> বাম Table-এর সব Row এবং ডানে মিল পাওয়া Data দেখায় (না মিললে ডানপাশে NULL)।</p>\n<p><strong>শিক্ষকের টিপ:</strong> ‘প্রতি বিভাগের গড় GPA’ দেখলে GROUP BY; ‘যেসব বিভাগের গড় 4.5-এর বেশি’ → HAVING; ‘Student-এর Name-সহ Result’ → JOIN।</p>\n","workedHtml":"<pre><code class=\"language-sql\">SELECT Department, AVG(GPA) AS AvgGPA\nFROM Students\nGROUP BY Department\nHAVING AVG(GPA) &gt;= 4.50;\n</code></pre>\n<p>প্রতিটি বিভাগের গড় বের করে 4.50 বা তার বেশি বিভাগ দেখায়।</p>\n","search":"**Aggregate Function:** `COUNT()` Row গণনা, `SUM()` যোগ, `AVG()` গড়, `MIN()` সর্বনিম্ন, `MAX()` সর্বোচ্চ। **GROUP BY** একই Category অনুযায়ী Row Group করে; **HAVING** Group-এর ওপর Condition দেয়। `WHERE` সাধারণ Row Filter, `HAVING` Aggregate Group Filter—পার্থক্যটি গুরুত্বপূর্ণ। **JOIN** একাধিক Table সম্পর্কের ভিত্তিতে একত্রে Query করে। `INNER JOIN` মিল পাওয়া Row দেখায়; `LEFT JOIN` বাম Table-এর সব Row এবং ডানে মিল পাওয়া Data দেখায় (না মিললে ডানপাশে NULL)। **শিক্ষকের টিপ:** ‘প্রতি বিভাগের গড় GPA’ দেখলে GROUP BY; ‘যেসব বিভাগের গড় 4.5-এর বেশি’ → HAVING; ‘Student-এর Name-সহ Result’ → JOIN।"},{"ch":6,"title":"Sorting, Searching ও Indexing-এর পার্থক্য","minutes":27,"trap":"`ORDER BY` লিখলেই Index সৃষ্টি হয়—এটি ভুল।","drills":[{"q":"Sorting-এর SQL Clause?","a":"ORDER BY।"},{"q":"Index-এর একটি অসুবিধা লেখো।","a":"অতিরিক্ত Storage ও Data পরিবর্তনে Maintenance Cost।"}],"id":"6_9","index":9,"html":"<p><strong>Sorting</strong> Data নির্দিষ্ট ক্রমে সাজানো (ASC/DESC)। <strong>Searching</strong> প্রয়োজনীয় তথ্য খোঁজা। <strong>Indexing</strong> Data অনুসন্ধান দ্রুত করার জন্য আলাদা Lookup Structure তৈরি করা; অনেক DBMS-এ B-tree বা অন্যান্য Index ব্যবহৃত হয়। Index থাকলেই সব Query দ্রুত হয় না—Selectivity, Query ও DBMS পরিকল্পনা গুরুত্বপূর্ণ।</p>\n<p><strong>Trade-off:</strong> Index Read Query দ্রুত করতে পারে, কিন্তু অতিরিক্ত Storage লাগে এবং Insert/Update/Delete-এ Index Maintain করতে কাজ বাড়তে পারে। <strong>Primary Key</strong>-এর ওপর অনেক DBMS Automatically Index তৈরি করে, তবে Implementation ভেদে Details ভিন্ন।</p>\n<p><strong>Exam Comparison:</strong> Sorting Output-এর ক্রম নির্ধারণ করে; Indexing Physical/Logical Access Path উন্নত করে।</p>\n","workedHtml":"<pre><code class=\"language-sql\">SELECT * FROM Students\nWHERE StudentID = 103;\n</code></pre>\n<p>StudentID Index থাকলে Database সাধারণত দ্রুত নির্দিষ্ট Row খুঁজতে পারে। কিন্তু <code>ORDER BY GPA DESC</code> Output সাজায়—এটি Index তৈরি করে না।</p>\n","search":"**Sorting** Data নির্দিষ্ট ক্রমে সাজানো (ASC/DESC)। **Searching** প্রয়োজনীয় তথ্য খোঁজা। **Indexing** Data অনুসন্ধান দ্রুত করার জন্য আলাদা Lookup Structure তৈরি করা; অনেক DBMS-এ B-tree বা অন্যান্য Index ব্যবহৃত হয়। Index থাকলেই সব Query দ্রুত হয় না—Selectivity, Query ও DBMS পরিকল্পনা গুরুত্বপূর্ণ। **Trade-off:** Index Read Query দ্রুত করতে পারে, কিন্তু অতিরিক্ত Storage লাগে এবং Insert/Update/Delete-এ Index Maintain করতে কাজ বাড়তে পারে। **Primary Key**-এর ওপর অনেক DBMS Automatically Index তৈরি করে, তবে Implementation ভেদে Details ভিন্ন। **Exam Comparison:** Sorting Output-এর ক্রম নির্ধারণ করে; Indexing Physical/Logical Access Path উন্নত করে।"},{"ch":6,"title":"Database Security, Privacy, Backup ও Recovery","minutes":30,"trap":"Backup File রেখেই দায়িত্ব শেষ নয়; Restore Test না করলে প্রয়োজনের সময় সমস্যা ধরা পড়তে পারে।","drills":[{"q":"Authentication ও Authorization আলাদা কেন?","a":"একটি পরিচয় যাচাই, অন্যটি অনুমতি নির্ধারণ।"},{"q":"Backup কেন দরকার?","a":"দুর্ঘটনায় হারানো Data পুনরুদ্ধারে।"}],"id":"6_10","index":10,"html":"<p><strong>Database Security:</strong> কে কী Data পড়বে/পরিবর্তন করবে তা সীমিত রাখা। <strong>Authentication:</strong> কে ব্যবহারকারী যাচাই; <strong>Authorization:</strong> কী করার অনুমতি আছে নির্ধারণ। <strong>Encryption:</strong> তথ্যকে Key-এর সাহায্যে এমনভাবে রূপান্তর করা যাতে অনুমতি ছাড়া বোঝা কঠিন হয়। <strong>Backup:</strong> Data-এর পুনরুদ্ধারযোগ্য কপি; <strong>Recovery:</strong> দুর্ঘটনার পরে পুনরুদ্ধার।</p>\n<p><strong>Threat:</strong> দুর্বল Password, Unauthorized Access, Malware, SQL Injection, ভুল Permission। <strong>Protection:</strong> Least Privilege, MFA, Encryption, Audit Log, Input Parameterization, নিয়মিত Backup ও Restore Test।</p>\n<p><strong>Ethics:</strong> ব্যক্তিগত তথ্য সম্মতি ও প্রয়োজনমতো ব্যবহার; অপ্রয়োজনীয় প্রকাশ না করা। ‘শুধু Password’ দিয়ে সম্পূর্ণ নিরাপত্তা হয় না; বিভিন্ন স্তরে নিয়ন্ত্রণ দরকার।</p>\n","workedHtml":"<p>স্কুলের Database-এ শিক্ষক কেবল নিজের ক্লাসের Result Edit করতে পারবেন, শিক্ষার্থী শুধু নিজের Result দেখতে পারবেন—এটি <strong>Authorization/Access Control</strong>। Disaster-এর পরে Backup থেকে তথ্য ফেরানো <strong>Recovery</strong>।</p>\n","search":"**Database Security:** কে কী Data পড়বে/পরিবর্তন করবে তা সীমিত রাখা। **Authentication:** কে ব্যবহারকারী যাচাই; **Authorization:** কী করার অনুমতি আছে নির্ধারণ। **Encryption:** তথ্যকে Key-এর সাহায্যে এমনভাবে রূপান্তর করা যাতে অনুমতি ছাড়া বোঝা কঠিন হয়। **Backup:** Data-এর পুনরুদ্ধারযোগ্য কপি; **Recovery:** দুর্ঘটনার পরে পুনরুদ্ধার। **Threat:** দুর্বল Password, Unauthorized Access, Malware, SQL Injection, ভুল Permission। **Protection:** Least Privilege, MFA, Encryption, Audit Log, Input Parameterization, নিয়মিত Backup ও Restore Test। **Ethics:** ব্যক্তিগত তথ্য সম্মতি ও প্রয়োজনমতো ব্যবহার; অপ্রয়োজনীয় প্রকাশ না করা। ‘শুধু Password’ দিয়ে সম্পূর্ণ নিরাপত্তা হয় না; বিভিন্ন স্তরে নিয়ন্ত্রণ দরকার।"}],"drillsCount":142,"mcqs":[[1,"আঙুলের ছাপ দিয়ে পরিচয় শনাক্ত করা কোন প্রযুক্তি?",["Robotics","Biometrics","Nanotechnology","VR"],1,"আঙুলের ছাপ একটি শারীরিক বৈশিষ্ট্য; Biometrics দিয়ে পরিচয় যাচাই হয়।"],[1,"কম্পিউটার-সৃষ্ট কৃত্রিম পরিবেশের অভিজ্ঞতা দেয় কোনটি?",["DBMS","VR","Router","Compiler"],1,"Virtual Reality কৃত্রিম পরিবেশে উপস্থিতির অনুভূতি দেয়।"],[1,"DNA Sequence বিশ্লেষণে কোন ক্ষেত্র সরাসরি ব্যবহৃত হয়?",["Bioinformatics","Cryosurgery","Topology","HTML"],0,"Bioinformatics জীববৈজ্ঞানিক তথ্য বিশ্লেষণ করে।"],[1,"অতিশীতল তাপমাত্রায় টিস্যু ধ্বংসের পদ্ধতি কোনটি?",["Telemedicine","Robotics","Cryosurgery","Biometrics"],2,"Cryosurgery-তে অত্যন্ত নিম্ন তাপমাত্রা প্রয়োগ করা হয়।"],[1,"শিল্পকারখানায় স্বয়ংক্রিয় যন্ত্র পরিচালনার সঙ্গে সবচেয়ে সম্পর্কিত কোনটি?",["Robotics","Bioinformatics","Database","Cryptography"],0,"Robotics রোবট
