gnal যায় তাকে Transmission Medium বলে।","Optical Fiber বিদ্যুৎ সংকেত নয়, আলো বহন করে। তাই সাধারণ Electromagnetic Interference সরাসরি আলোক সংকেতকে বিঘ্নিত করে না।","উচ্চগতি, দূরত্ব ও বৈদ্যুতিক Noise বিবেচনায় ভবনগুলোর মধ্যে Optical Fiber বেশি উপযোগী। এর Core-এ আলোক সংকেত চলায় Noise-এর সমস্যা কম হয়।","Lab-এর Star Topology-তে একটি PC-এর Cable নষ্ট হলেও অন্যগুলো সাধারণত সচল; রক্ষণাবেক্ষণ সহজ। ভবনগুলোর মধ্যে Fiber ভালো Capacity ও EMI Resistance দেয়। তবে কেন্দ্রীয় Switch Failure এবং Fiber Installation Cost বিবেচনা করতে হবে।"]],[2,"৫টি অফিস Device-কে একে অন্যের সঙ্গে সরাসরি যুক্ত করে Full Mesh গঠনের প্রস্তাব দেওয়া হলো। বিকল্পভাবে কেন্দ্রীয় Switch দিয়ে Star গঠন করা যাবে।",["Network Topology কী?","Full Mesh-এ Link বেশি লাগে কেন?","৫টি Device-এর Full Mesh-এর Link সংখ্যা নির্ণয় করো।","ব্যয় ও নির্ভরযোগ্যতা বিবেচনায় Star ও Full Mesh তুলনা করো।"],["Network Node ও তাদের সংযোগের বিন্যাসকে Topology বলে।","Full Mesh-এ প্রতিটি Node অন্য সব Node-এর সঙ্গে সরাসরি যুক্ত থাকে; তাই Node বাড়লে Pair ও Link দ্রুত বাড়ে।","n(n−1)/2 = 5×4/2 = **10টি Link**।","Full Mesh-এ বিকল্প সরাসরি পথ বেশি, কিন্তু Cable/Port/Installation ব্যয় বেশি। Star-এ মোট পাঁচটি Device-এর জন্য কেন্দ্রীয় Switch-এ সাধারণত পাঁচটি Link লাগে; রক্ষণাবেক্ষণ সহজ, কিন্তু Switch Single Point of Failure। সাধারণ ছোট অফিসে Star অধিক বাস্তবসম্মত হতে পারে।"]],[2,"একটি Smartwatch ফোনের সঙ্গে যুক্ত, কলেজের ক্লাসে সবাই Wi-Fi ব্যবহার করছে এবং একটি প্রতিষ্ঠান ঢাকার সঙ্গে সিলেট অফিস যুক্ত করেছে।",["PAN কী?","LAN ও WAN-এর পার্থক্য লেখো।","তিনটি পরিস্থিতির Network Type নির্ণয় করো।","কেন একই প্রযুক্তি সব তিনটি ক্ষেত্রে সমানভাবে উপযোগী নয় বিশ্লেষণ করো।"],["ব্যক্তিগত পরিসরে Device সংযোগের Network হলো PAN।","LAN সীমিত স্থানীয় অঞ্চলকে যুক্ত করে; WAN বড় ভৌগোলিক এলাকা বা বহু স্থানকে সংযুক্ত করে।","Smartwatch–Phone সংযোগ PAN; ক্লাসের Local Wi-Fi Network WLAN/LAN; ঢাকা–সিলেট অফিসের Wide-area Connection WAN।","প্রতিটির Range, Capacity, Mobility ও Cost আলাদা। PAN কম দূরত্ব ও কম শক্তির Personal Link-এ, LAN Campus/Room-এ, WAN দূরবর্তী Office Connection-এ উপযু  Homepage থেকে বিভাগ → বিষয় → শিক্ষক Page-এ যেতে হয়। সাইটে শিক্ষকের ছবি এবং Results Table আছে।",["Homepage কী?","`alt` Attribute কেন দরকার?","Website-এর Navigation Structure শনাক্ত করো।","Table ও Image যুক্ত করে শিক্ষার্থীবান্ধব Page তৈরির HTML কাঠামো ব্যাখ্যা করো।"],["Website-এ প্রবেশের প্রধান বা সূচনাপৃষ্ঠাকে Homepage বলে।","ছবি দেখা না গেলে এবং Assistive Technology-এর জন্য `alt` অর্থপূর্ণ বিকল্প বর্ণনা দেয়।","বিভাগ → বিষয় → শিক্ষক শ্রেণিবিন্যাসটি **Tree/Hierarchical** Structure, কারণ Parent Page থেকে Child Page-এ শাখা তৈরি হয়েছে।","`<h1>` দিয়ে শিরোনাম, `<a href>` দিয়ে Navigation, `<img src alt>` দিয়ে ছবি এবং `<table><tr><th>/<td>` দিয়ে Result সাজাতে হবে। সঠিক Heading ও Link Label দিতে হবে; Domain/Hosting দিয়ে প্রকাশ করা সম্ভব।"]],[4,"তিন Column-এর একটি HTML Table-এর প্রথম Row-তে “Final Result” শিরোনাম পুরো তিন Column জুড়ে থাকবে। পরের Row-তে Name, Roll, GPA থাকবে।",["HTML-এর পূর্ণরূপ কী?","`<th>` ও `<td>` কেন আলাদা?","প্রথম Row-এর জন্য HTML লেখো।","সম্পূর্ণ Table-এর Code লিখে Merge করা Cell ব্যাখ্যা করো।"],["HyperText Markup Language।","`<th>` Header Cell-এর অর্থ প্রকাশ করে; `<td>` সাধারণ Data Cell, তাই Table অর্থপূর্ণ ও পাঠযোগ্য হয়।","`<tr><th colspan=\"3\">Final Result</th></tr>`—এখানে colspan=3 প্রথম Row-কে তিন Column জুড়ে রাখে।","`<table border=\"1\"><tr><th colspan=\"3\">Final Result</th></tr><tr><th>Name</th><th>Roll</th><th>GPA</th></tr><tr><td>Rima</td><td>101</td><td>5.00</td></tr></table>`। প্রথম Row-তে ১টি Cell ৩ Column নেয়; দ্বিতীয় Row-তে ৩টি স্বতন্ত্র Header।"]],[4,"এক শিক্ষার্থী HTML ফাইল বানিয়েছে, কিন্তু বন্ধুর Browser-এ ছবি দেখা যায় না। Code-এ `<img src=\"photo.jpg\">` আছে, আর ছবিটি `images` Folder-এ রাখা।",["Relative URL কী?","`src` ও `alt`-এর কাজ লেখো।","ছবি না দেখানোর কারণ শনাক্ত করে ঠিক করো।","ওয়েবপেজ পরীক্ষার জন্য একটি Debug Checklist তৈরি করো।"],["বর্তমান Document/Location-এর সাপেক্ষে লেখা Path-কে Relative URL বলে।","`src` ছবির ঠিকানা নির্ধারণ করে, `alt` বিকল্প অর্থপূর্ণ বর্ণনা দেয়।","Code `photo.jpg` খুঁজছে একই Folder-এ, কিন্তু File আছে `images` Folder-এ। সমাধান: `<img src=\"images/photo.jpg\" alt=\"কলেজের ছবি\">`।","প্রথমে File Location/Case/Extension যাচাই, Relative Path ঠিক করা, Encoding ও HTML Structure পরীক্ষা, Network URL হলে Access Permission যাচাই এবং Browser Preview করে ফল দেখা।"]],[5,"এক প্রোগ্রাম ১ থেকে N পর্যন্ত সংখ্যার যোগফল বের করে। ছাত্রটি `for(i=1;i<N;i++)` ব্যবহার করায় N-এর মান যোগ হচ্ছে না।",["Algorithm কী?","Off-by-one Error বলতে কী বোঝায়?","N=5 হলে ছাত্রটির Program কত যোগফল পায়?","ত্রুটি সংশোধন করে C Code ও যুক্তি দাও।"],["সুস্পষ্ট এবং সীমিত ধাপে সমস্যা সমাধানের নির্দেশনা হলো Algorithm।","Loop Boundary ভুলের কারণে একটি Iteration বাদ পড়া/বেশি হওয়াকে Off-by-one Error বলা হয়।","i=1,2,3,4 চলে; Sum=1+2+3+4=**10**। প্রত্যাশিত 15 নয়।","`int sum=0; for(int i=1;i<=N;i++) sum+=i; printf(\"%d\",sum);`। `<=` ব্যবহারে i=N অন্তর্ভুক্ত হয়; N=5 হলে Sum=15।"]],[5,"একটি C Program Input 7 ও 2 নিয়ে `a/b` এবং `(float)a/b` Print করে।",["Data Type কী?","Type Casting বলতে কী বোঝায়?","দুটি Expression-এর Output নির্ণয় করো।","Integer Division ব্যবহার করলে Average-র উত্তর কেন ভুল হতে পারে—ব্যাখ্যা করো।"],["Variable/Expression কোন ধরনের মান ধারণ করে তা নির্ধারণকারী শ্রেণি হলো Data Type।","এক Data Type-এর মান অন্য Type-এ রূপান্তর করার প্রক্রিয়াকে Type Casting বলে।","`a/b`-এ a,b দুই int, ফল **3**; `(float)a/b`-এ Floating-point Division, ফল **3.5**।","Average-এ ভাগফল ভগ্নাংশ হতে পারে। `int/int` ভগ্নাংশ বাদ দেয়; তাই `(float)sum/count` বা Floating-point Operand ব্যবহার করতে হবে। এতে 7/2=3.5 যথাযথভাবে প্রকাশ পায়।"]],[5,"একটি Program পাঁচটি Temperature Array-তে রাখে এবং সবচেয়ে বড় মান বের করে। Data: 20,18,25,23,19।",["Array কী?","Array Index কেন 0 থেকে শুরু হয়?","Array-এর Maximum নির্ণয়ের Dry Run দেখাও।","উপযুক্ত C Loop লিখে কেন তা সঠিক ব্যাখ্যা করো।"],["একই Data Type-এর একাধিক Value ধারাবাহিক Index-এ সংরক্ষণের গঠন হলো Array।","C-তে Array-এর প্রথম Element `a[0]`; Index মূল Address থেকে Offset হিসেবে বিবেচিত হয়।","max=20 → 18 এ অপরিবর্তিত 20 → 25 এ 25 → 23 এ 25 → 19 এ 25। ফলে **25**।","`int a[5]={20,18,25,23,19}, max=a[0]; for(int i=1;i<5;i++) if(a[i]>max) max=a[i]; printf(\"%d\",max);`। প্রথম Value থেকে শুরু ও সব বাকি Value পরীক্ষা করা হয়েছে।"]],[6,"এক স্কুলে `Students(StudentID,Name)` ও `Results(ResultID,StudentID,Exam,Mark)` নামে Table আছে। একজনের একাধিক পরীক্ষার ফল থাকতে পারে।",["Primary Key কী?","Foreign Key কেন দরকার?","দুটি Table-এর Relationship নির্ধারণ করো।","এই Design-এর সুবিধা Data Duplication-এর সঙ্গে তুলনা করে বিশ্লেষণ করো।"],["প্রতিটি Row স্বতন্ত্রভাবে চিহ্নিত করার জন্য নির্বাচিত Candidate Key হলো Primary Key।","Foreign Key অন্য Table-এর Key Reference করে সম্পর্ক ও Referential Integrity রক্ষায় সহায়তা করে।","এক শিক্ষার্থীর একাধিক Result থাকতে পারে → Students থেকে Results **One-to-Many**; Results.StudentID Foreign Key।","Name প্রতিটি Result-এ পুনরাবৃত্ত না হয়ে Students Table-এ একবার থাকবে। ফলে Update Anomaly কমে, Data Consistency বাড়ে, StudentID দিয়ে Result খোঁজা সহজ হয়। তবে সঠিক Foreign Key Constraint বজায় রাখতে হবে।"]],[6,"এক কলেজে StudentID 103-এর GPA বদলাতে গিয়ে একজন অপারেটর `UPDATE Students SET GPA=5.00;` চালায়।",["SQL কী?","WHERE Clause-এর কাজ কী?","উপরের Query-এর সম্ভাব্য প্রভাব ব্যাখ্যা করো।","সঠিক Query লেখো এবং Data Safety-র দুটি উপায় বিশ্লেষণ করো।"],["Relational Database-এ Data সংজ্ঞা, Query ও পরিবর্তনের ভাষা SQL।","WHERE শর্তের ভিত্তিতে কোন Row প্রক্রিয়া করা হবে তা সীমিত করে।","WHERE নেই বলে Table-এর সব Student-এর GPA 5.00 হয়ে যেতে পারে—শুধু StudentID 103 নয়। এটি ভুল Update।","`UPDATE Students SET GPA=5.00 WHERE StudentID=103;`। আগে `SELECT` দিয়ে Target Row যাচাই, প্রয়োজনমতো Transaction/Backup ও Permission Control ব্যবহার করা উচিত।"]],[6,"এক স্কুল প্রতিটি বিভাগের গড় GPA বের করতে চায় এবং গড় 4.50 বা বেশি এমন বিভাগ দেখাবে।",["Aggregate Function কী?","GROUP BY কী কাজ করে?","প্রতি বিভাগের গড় গণনার SQL লেখো।","HAVING ব্যবহার করে প্রয়োজনীয় বিভাগ দেখানোর Query লেখো ও ব্যাখ্যা করো।"],["একাধিক Row-এর ওপর গণনা করে সারসংক্ষেপ Value দেওয়া Function-কে Aggregate Function বলে, যেমন AVG/COUNT।","GROUP BY একই বিভাগের Row-গুলোকে Group করে আলাদা Aggregate বের করতে সাহায্য করে।","`SELECT Department, AVG(GPA) AS AvgGPA FROM Students GROUP BY Department;`।","`SELECT Department, AVG(GPA) AS AvgGPA FROM Students GROUP BY Department HAVING AVG(GPA)>=4.50;`। WHERE পৃথক Row Filter করে, HAVING Group Result Filter করে।"]]],"htmlSample":"<!DOCTYPE html>\n<html lang=\"bn\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>আমার ICT Club</title>\n</head>\n<body>\n  <h1>ICT Club 2028</h1>\n  <p>আমরা HTML শিখছি!</p>\n  <ul>\n    <li>Number Systems</li>\n    <li>C Programming</li>\n  </ul>\n  <table border=\"1\">\n    <tr><th>Name</th><th>GPA</th></tr>\n    <tr><td>Rima</td><td>5.00</td></tr>\n  </table>\n</body>\n</html>","masterclasses":{"1":"<h1>অধ্যায় ১: বিষয়কে উদ্দীপকে প্রয়োগ করার পূর্ণাঙ্গ মাস্টারক্লাস</h1>\n<p>এই অধ্যায়ে সরাসরি সংজ্ঞা মুখস্থ করার পাশাপাশি <strong>বর্ণনা দেখে প্রযুক্তি শনাক্ত</strong> করাই সবচেয়ে গুরুত্বপূর্ণ দক্ষতা। একই প্রযুক্তি শিক্ষা, কৃষি, স্বাস্থ্য, শিল্প, নিরাপত্তা, বিনোদনসহ বিভিন্ন ক্ষেত্রে ব্যবহৃত হতে পারে। উদ্দীপকের প্রত্যেকটি কাজ আলাদা করে চিহ্নিত করো, তারপর ব্যাখ্যা দাও।</p>\n<h2>১. বিশ্বগ্রামের উপাদান ও কার্যপদ্ধতি</h2>\n<p>বিশ্বগ্রাম দাঁড়িয়ে আছে তথ্য সংগ্রহ, তথ্য প্রক্রিয়াকরণ এবং তথ্য পরিবহনের ওপর। একটি অনলাইন ক্লাসে শিক্ষক ভিডিও রেকর্ড করেন (Input), সফটওয়্যার ভিডিও ও শব্দ প্রক্রিয়া করে (Processing), নেটওয়ার্ক Data বহন করে (Communication), শিক্ষার্থী তা দেখে (Output), আবার প্রয়োজনে সার্ভারে ক্লাসের রেকর্ড সংরক্ষিত হয় (Storage)। আলাদা আলাদা উপাদানের কাজ বুঝলে বড় উদ্দীপক ভাঙা সহজ।</p>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th>উপাদান</th>\n  <th>ভূমিকা</th>\n  <th>দৈনন্দিন উদাহরণ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Hardware</td>\n  <td>তথ্য গ্রহণ, প্রক্রিয়াকরণ, প্রদর্শন</td>\n  <td>Camera, Computer, Mobile</td>\n</tr>\n<tr>\n  <td>Software</td>\n  <td>ডিভাইসকে কাজের নির্দেশ ও Interface দেয়</td>\n  <td>Browser, Meeting App</td>\n</tr>\n<tr>\n  <td>Network</td>\n  <td>দুই প্রান্তে তথ্য আদান-প্রদান</td>\n  <td>Internet, Wi-Fi, Fiber</td>\n</tr>\n<tr>\n  <td>Data</td>\n  <td>প্রক্রিয়াকরণের উপাদান</td>\n  <td>ছবি, লেখা, অডিও</td>\n</tr>\n<tr>\n  <td>Human Skill</td>\n  <td>সঠিক প্রযুক্তি নির্বাচন ও ব্যবহার</td>\n  <td>শিক্ষক ও শিক্ষার্থীর দক্ষতা</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>পূর্ণাঙ্গ প্রশ্নের উত্তর:</strong> বিশ্বগ্রাম মানুষের নৈকট্য তৈরি করলেও সবার সমান সুযোগ তৈরি করে না। দ্রুত Internet, ডিভাইসের দাম, ভাষাগত বাধা ও Digital Literacy-র ব্যবধানকে Digital Divide বলে আলোচনা করা যায়। ঘ অংশে সুবিধা ও শর্ত দুটোই লিখবে।</p>\n<h2>২. VR, AR, AI ও Robotics—দ্বিধা দূর করার কেস</h2>\n<p>একজন শিক্ষার্থী VR Headset পরে ভার্চুয়াল মহাকাশযান চালায়। বাস্তব পরিবেশকে সফটওয়্যার দিয়ে প্রতিস্থাপন করেছে বলে এটি VR। আর একই শিক্ষার্থী ফোনের Camera চালু করে প্রকৃত ডেস্কের ওপর একটি ভার্চুয়াল গ্রহ দেখতে পেলে সেটি AR। দুটোতেই Three-dimensional Graphic থাকতে পারে, তাই শুধু 3D দেখে বিচার করা ভুল।</p>\n<p>একটি Computer Vision Model ক্যামেরায় বস্তু শনাক্ত করে—এটি AI-এর প্রয়োগ। একই Model যদি চাকা-যুক্ত যন্ত্রকে পথ বাছতে সহায়তা করে, সেখানে AI ও Robotics একসঙ্গে কাজ করছে। কিন্তু একটি Conveyor Belt Timer মেনে চললেই AI প্রমাণিত নয়।</p>\n<p><strong>বিশ্লেষণ অনুশীলন:</strong> কৃষিক্ষেতে একটি রোবট ক্যামেরায় রোগাক্রান্ত পাতা শনাক্ত করে, যান্ত্রিক বাহু দিয়ে সেগুলো সরায়। এখানে Camera হলো Sensor, রোগ শনাক্তকরণ AI হতে পারে, Motor/Arm হলো Actuator, আর সম্পূর্ণ যন্ত্রটি Robotics-এর প্রয়োগ। পরীক্ষায় চারটি অংশ আলাদা করে দেখালে উত্তর স্পষ্ট হয়।</p>\n<h2>৩. Biometric Authentication: Enrollment থেকে Verification</h2>\n<p>একটি Fingerprint System প্রথমবার পরিচিত ব্যক্তির ছাপ থেকে Digital Template তৈরি ও সংরক্ষণ করে; এটিকে Enrollment বলে। পরে নতুন Scanner Reading থেকে Feature Extract করে সংরক্ষিত Template-এর সঙ্গে তুলনা করা হয়। Verification-এ সাধারণত দাবি করা পরিচয় মিলিয়ে দেখা হয় (একজনের সঙ্গে একজনের মিল), Identification-এ অনেকের মধ্যে সম্ভাব্য পরিচয় খোঁজা হয়। Facial Recognition, Iris Matching এবং Fingerprint-এর বৈশিষ্ট্য ও সীমা আলাদা।</p>\n<p><strong>সতর্কতা:</strong> Fingerprint কোনো Password-এর মতো সহজে বদলানো যায় না। তাই Template Encryption, Access Control, Consent ও Data Minimization গুরুত্বপূর্ণ। প্রযুক্তিকে ‘অভেদ্য’ বলবে না; ভুল Positive/Negative Match ঘটতে পারে।</p>\n<h2>৪. Bioinformatics, Genetic Engineering ও Nanotechnology</h2>\n<p>Bioinformatics মূলত জীববিজ্ঞানের <strong>বিপুল তথ্য বিশ্লেষণ</strong> করে। DNA Sequence Data তুলনা, রোগের সঙ্গে Gene Variant-এর সম্পর্ক গবেষণা, Protein Structure অনুসন্ধানে সহায়তা ইত্যাদি উদাহরণ। Genetic Engineering হলো DNA/জিনগত উপাদানে নিয়ন্ত্রিত পরিবর্তন আনার প্রযুক্তি। দুটি একসঙ্গে ব্যবহৃত হতে পারে: Bioinformatics বিশ্লেষণে কোন Gene গুরুত্বপূর্ণ তা চিহ্নিত করতে সাহায্য করে, আর Genetic Engineering-এ পরিবর্তন সাধন করা হয়।</p>\n<p>Nanotechnology-তে সাধারণত ১–১০০ ন্যানোমিটার পর্যায়ের গঠন বা উপাদানের বিশেষ বৈশিষ্ট্য নিয়ে কাজ হয়। এটি পরিমাপের ক্ষুদ্রতা এবং সেই ক্ষুদ্র পর্যায়ে ভিন্ন Physical/Chemical Properties ব্যবহারের প্রযুক্তি। Nano Material ব্যবহৃত হলেই পণ্য স্বয়ংক্রিয়ভাবে নিরীহ/নিরাপদ হয় না; Safety Assessment প্রয়োজন।</p>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th>উদ্দীপকের ইঙ্গিত</th>\n  <th>সবচেয়ে উপযোগী প্রযুক্তি</th>\n  <th>কেন</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>দূর থেকে Live Medical Consultation</td>\n  <td>Telemedicine</td>\n  <td>চিকিৎসা পরামর্শ দূরে পৌঁছায়</td>\n</tr>\n<tr>\n  <td>Fingerprint দিয়ে Attendance</td>\n  <td>Biometrics</td>\n  <td>শরীরের বৈশিষ্ট্য দিয়ে পরিচয়</td>\n</tr>\n<tr>\n  <td>হাজারো DNA Sample বিশ্লেষণ</td>\n  <td>Bioinformatics</td>\n  <td>Biological Data Processing</td>\n</tr>\n<tr>\n  <td>জিনগত বৈশিষ্ট্যে নিয়ন্ত্রিত পরিবর্তন</td>\n  <td>Genetic Engineering</td>\n  <td>Genetic Material পরিবর্তন</td>\n</tr>\n<tr>\n  <td>কল্পিত Cockpit-এ প্রশিক্ষণ</td>\n  <td>Virtual Reality</td>\n  <td>Immersive Simulation</td>\n</tr>\n<tr>\n  <td>বাস্তব Factory-তে যন্ত্রের বাহু কাজ করে</td>\n  <td>Robotics</td>\n  <td>Physical Actuation</td>\n</tr>\n<tr>\n  <td>অতিশীতল প্রয়োগে Tissue অপসারণ</td>\n  <td>Cryosurgery</td>\n  <td>Cryogenic Treatment</td>\n</tr>\n</tbody>\n</table></div>\n<h2>৫. CQ লেখার শিক্ষক-ধাঁচের নমুনা</h2>\n<p><strong>উদ্দীপক:</strong> একটি কৃষি গবেষণা দল Drone Camera দিয়ে পাতার ছবি নেয়, Image Classification দিয়ে রোগের সম্ভাবনা শনাক্ত করে, এবং আন্তর্জাতিক গবেষণা কেন্দ্রে ফলাফল পাঠায়।</p>\n<p><strong>ক:</strong> Global Village কী? — ICT-র মাধ্যমে পৃথিবীর বিভিন্ন প্রান্তের মানুষের তথ্য ও যোগাযোগগত নৈকট্যের ধারণা।</p>\n<p><strong>খ:</strong> ICT-তে দ্রুত যোগাযোগ কেন জরুরি? — দ্রুত Data Transfer-এ দূরের গবেষকেরা ফলাফল আদান-প্রদান ও সিদ্ধান্ত নিতে পারেন; বিলম্ব কমে।</p>\n<p><strong>গ:</strong> Image Classification প্রযুক্তিটি ব্যাখ্যা করো। — ছবির Pattern থেকে রোগের সম্ভাবনা শনাক্তে Computer Vision/AI ব্যবহৃত হতে পারে; Training Data-এর ভিত্তিতে Model ভিন্ন শ্রেণিতে ছবি ফেলতে শেখে।</p>\n<p><strong>ঘ:</strong> গবেষণায় বিশ্বগ্রামের প্রভাব বিশ্লেষণ করো। — বিভিন্ন দেশের গবেষক একই Data দেখে দ্রুত মতামত দিতে পারেন; ফলে গবেষণার গতি বাড়তে পারে। কিন্তু Internet, নিরাপদ Data Sharing, Privacy এবং Model Accuracy নিশ্চিত না হলে ভুল বিশ্লেষণের ঝুঁকি আছে। <strong>সিদ্ধান্ত:</strong> সহযোগিতার সুবিধা আছে, তবে প্রযুক্তির দায়িত্বশীল ব্যবহার অপরিহার্য।</p>\n<h2>৬. নিজেকে যাচাই: উত্তরসহ ছোট প্রশ্ন</h2>\n<ol>\n<li><p>AI ও Expert System একই? <strong>না।</strong> AI বিস্তৃত ক্ষেত্র; Expert System বিশেষজ্ঞ-জ্ঞান ও নিয়মভিত্তিক সিদ্ধান্তে সহায়তা করে।</p>\n</li>\n<li><p>Outsourcing ও Freelancing একই? <strong>না।</strong> Outsourcing কাজ বাইরে দেওয়া; Freelancing স্বাধীন পেশাজীবীর কাজের ধরন।</p>\n</li>\n<li><p>Remote Sensing-এর মূল পরিচায়ক? <strong>স্পর্শ ছাড়া Sensor দিয়ে তথ্য সংগ্রহ।</strong></p>\n</li>\n<li><p>E-Governance-এর একটি সুবিধা ও সীমা? <strong>সেবা দ্রুত পাওয়া;</strong> কিন্তু Network Access/Skill না থাকলে বৈষম্য হতে পারে।</p>\n</li>\n<li><p>RFID কি সবসময় Biometrics? <strong>না।</strong> RFID একটি Radio-based Identification Technology; শারীরিক বৈশিষ্ট্য ব্যবহার করতেই হয় না।</p>\n</li>\n</ol>\n","2":"<h1>অধ্যায় ২: নেটওয়ার্ক বেছে নেওয়া, হিসাব করা ও ব্যাখ্যা করার মাস্টারক্লাস</h1>\n<h2>১. যোগাযোগব্যবস্থার পাঁচটি ধাপ</h2>\n<p>সাধারণ Data Communication Model-এ Sender, Message, Transmission Medium, Receiver এবং Protocol থাকে। Sender তথ্য প্রস্তুত করে; Message হলো আদান-প্রদানের উপাদান; Medium বহন করে; Receiver গ্রহণ করে; Protocol হলো দুই প্রান্তের নিয়মের সমষ্টি। সঠিক Protocol না থাকলে দুটি ডিভাইস Connected হলেও প্রত্যাশিত তথ্য বুঝতে নাও পারে।</p>\n<p>উদাহরণ: Computer থেকে Website দেখা—Browser অনুরোধ পাঠায়, Network সেই Data বহন করে, Web Server Response পাঠায়। এখানে IP Address Packet Route-এ সাহায্য করে; Domain Name-কে Address-এ রূপান্তরে DNS কাজে লাগে; HTTP/HTTPS Web Data Exchange-এ ব্যবহৃত হয়। HTTPS সাধারণত TLS-এর সাহায্যে Transport Channel নিরাপদ করে, তবে এটি Website-এর সব Content সত্য কিনা নিশ্চয়তা দেয় না।</p>\n<h2>২. Bit, Byte, kbps ও MB: পরীক্ষার ক্যালকুলেশন</h2>\n<p>১ Byte = ৮ Bit। Network Speed সাধারণত bit per second (bps) এবং File Size Byte-এ পরিমাপ করা হয়। একক দেখে Calculation শুরু করবে। <strong>Decimal SI convention:</strong> 1 Mbps = 1,000,000 bits/s; 1 MB = 1,000,000 Bytes। <strong>Binary unit:</strong> 1 MiB = 1,048,576 Bytes; 1 KiB = 1024 Bytes। বোর্ডের বই/প্রশ্ন যে Convention নির্ধারণ করে সেটিই অনুসরণ করবে; প্রশ্নে কিছু না থাকলে ধরে নেওয়া Convention লিখবে।</p>\n<p><strong>সমাধান ১:</strong> 5 MB File একটি 10 Mbps Link-এ পাঠাতে Ideal Time কত? File Bits = 5×1,000,000×8 = 40,000,000 bits। Time = 40,000,000 / 10,000,000 = <strong>4 seconds</strong>। বাস্তবে Protocol Overhead, Congestion ও Packet Loss থাকলে বেশি সময় লাগে।</p>\n<p><strong>সমাধান ২:</strong> 2 MiB = কত Bit? 2×1,048,576×8 = <strong>16,777,216 bits</strong>। আগের হিসাবের সঙ্গে এইটি আলাদা কারণ SI MB বনাম Binary MiB।</p>\n<p><strong>সমাধান ৩:</strong> 8000-bit Message 2 Mbps-এ পাঠালে Ideal Transmission Time = 8000 / 2,000,000 = <strong>0.004 s = 4 ms</strong>। এখানে Propagation Delay বিবেচিত হয়নি।</p>\n<h2>৩. Timing, Direction ও Delivery—তিনটি আলাদা শ্রেণি</h2>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th>শ্রেণি</th>\n  <th>কী বিবেচিত হয়</th>\n  <th>উদাহরণ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Transmission Timing</td>\n  <td>Data কখন/কীভাবে synchronized</td>\n  <td>Asynchronous, Synchronous, Isochronous</td>\n</tr>\n<tr>\n  <td>Direction</td>\n  <td>Data কোন দিকে যেতে পারে</td>\n  <td>Simplex, Half Duplex, Full Duplex</td>\n</tr>\n<tr>\n  <td>Delivery</td>\n  <td>কতজনকে উদ্দেশ্য করে পাঠানো হয়</td>\n  <td>Unicast, Broadcast, Multicast</td>\n</tr>\n</tbody>\n</table></div>\n<p>একটি Live Video Call-এ Full Duplex Mode থাকতে পারে, কিন্তু Video Streaming-এর Quality ধরে রাখতে Timing-ও গুরুত্বপূর্ণ। তাই ‘Full Duplex’ এবং ‘Isochronous’কে একই সারির বিকল্প ভাববে না। Asynchronous Transmission-এ অনেক ক্ষেত্রে পৃথক Character বা Unit-এর Start/Stop Framing ব্যবহৃত হয়। Synchronous Transmission সাধারণত Sender/Receiver-এর Synchronization ধরে Block বা Frame আকারে তথ্য পাঠায়। Isochronous Service সময়মতো নিয়মিত Data Delivery-কে গুরুত্ব দেয়।</p>\n<h2>৪. Topology নির্বাচন: বাস্তব পরিস্থিতি</h2>\n<p><strong>কেস A:</strong> অফিসের ২৫টি Computer, একটি Cable নষ্ট হলেও বাকিগুলো চলবে, রক্ষণাবেক্ষণ সহজ হতে হবে। <strong>Star</strong>-এ Individual Connection থাকায় সুবিধা; কেন্দ্রীয় Switch নষ্ট হওয়ার ঝুঁকি বিবেচনা করবে।</p>\n<p><strong>কেস B:</strong> কোনো Control Network-এ বহু Alternate Path দরকার; Budget বড়। <strong>Mesh</strong>-এর Redundant Link বিবেচনাযোগ্য। Full Mesh-এ 7 Node-এর Link = 7×6/2 = <strong>21</strong>।</p>\n<p><strong>কেস C:</strong> বড় শিক্ষা প্রতিষ্ঠান কয়েকটি Block ও Subnet-এ ভাগ। স্তরভিত্তিক <strong>Tree/Hierarchical Design</strong> কার্যকর হতে পারে; Root/Switch Failure ও Fault Isolation বিবেচনা জরুরি।</p>\n<p><strong>কেস D:</strong> কম সংখ্যক Node, Single Backbone। <strong>Bus</strong> Topology-তে Cable কম লাগে কিন্তু Backbone Failure গুরুত্বপূর্ণ সমস্যা। আধুনিক Ethernet Deployment-এ Star বেশি প্রচলিত।</p>\n<h2>৫. Router, Switch, Modem—একই যন্ত্র নয়</h2>\n<p>Switch একই Local Network-এর Ethernet Frame সাধারণত MAC Address দেখে Forward করে। Router ভিন্ন IP Network-এর Packet Route নির্বাচন করে। Modem সংযোগ প্রযুক্তি অনুসারে Signal Conversion-এ কাজ করে। একটি Home Wi-Fi Router-এর Housing-এর মধ্যে Switch, Wireless Access Point, Router এবং কখনো Modem একসঙ্গে থাকতে পারে; তাই যন্ত্রের বক্স এক হলেও কাজের স্তর ভিন্ন।</p>\n<p><strong>IP বনাম MAC:</strong> IP Address-কে Network-level Logical Address হিসেবে শেখো। MAC হলো Network Interface-এ Local Link-এর Address। Router MAC দিয়ে সমগ্র Internet-এ End-to-end Routing করে না; বিভিন্ন Network Segment-এ Link-layer Header পরিবর্তিত হতে পারে।</p>\n<h2>৬. Wired বনাম Wireless: যুক্তিভিত্তিক পছন্দ</h2>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th>শর্ত</th>\n  <th>সাধারণত অগ্রাধিকার</th>\n  <th>ব্যাখ্যা</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>বিল্ডিংগুলোর মধ্যে দীর্ঘ দূরত্ব + উচ্চগতি</td>\n  <td>Fiber</td>\n  <td>Capacity ও Interference Resistance</td>\n</tr>\n<tr>\n  <td>সাধারণ কম্পিউটার ল্যাব, সীমিত বাজেট</td>\n  <td>Twisted Pair Ethernet</td>\n  <td>সহজ স্থাপন ও সাশ্রয়</td>\n</tr>\n<tr>\n  <td>ঘুরে বেড়ানো Mobile Device</td>\n  <td>Wi-Fi</td>\n  <td>Mobility</td>\n</tr>\n<tr>\n  <td>Phone ও Earbud-এর Pairing</td>\n  <td>Bluetooth</td>\n  <td>Short-range Personal Connection</td>\n</tr>\n<tr>\n  <td>কয়েকটি সুরক্ষিত Branch-এর Internet Connectivity</td>\n  <td>WAN + Secure Routing</td>\n  <td>ভিন্ন Network যুক্ত করতে হয়</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>নিরাপত্তা:</strong> Wi-Fi-তে শক্তিশালী Encryption/Authentication, Router Update, Guest Network প্রভৃতি ভালো ব্যবস্থা। কিন্তু শুধু Password থাকা মানেই সব Device নিরাপদ নয়।</p>\n<h2>৭. স্ব-পরীক্ষা</h2>\n<ol>\n<li><p>12 Mbps Link-এ আদর্শভাবে 3 MB পাঠানোর সময়? <strong>2 s</strong>, কারণ 3×8/12 = 2।</p>\n</li>\n<li><p>Mesh-এ 8 Node থাকলে Full Mesh Link? <strong>28</strong> = 8×7/2।</p>\n</li>\n<li><p>‘একসঙ্গে দুইদিকে কথা’ কোন Mode? <strong>Full Duplex</strong>।</p>\n</li>\n<li><p>‘যখন খুশি Character Send, Start/Stop Framing’ কী? <strong>Asynchronous Transmission</strong>।</p>\n</li>\n<li><p>Router ও Access Point এক? <strong>না</strong>, এক যন্ত্রে উভয় ভূমিকা থাকলেও কার্যক্রম পৃথক।</p>\n</li>\n</ol>\n","3":"<h1>অধ্যায় ৩: সংখ্যা পদ্ধতি, বুলিয়ান বীজগণিত ও সার্কিটের পূর্ণাঙ্গ অনুশীলন</h1>\n<h2>১. অবস্থানভিত্তিক সংখ্যা পদ্ধতির মূলনীতি</h2>\n<p>Base <code>r</code>-এর একটি সংখ্যায় ডান থেকে বামে স্থানমান r⁰, r¹, r²,...; Radix Point-এর ডানদিকে r⁻¹, r⁻²,...। যেমন (123.4)₈ = 1×8² + 2×8¹ + 3×8⁰ + 4×8⁻¹ = 64+16+3+0.5 = <strong>83.5₁₀</strong>। Octal-এ 8 বা 9 থাকতে পারে না; Hexadecimal-এ A=10 থেকে F=15।</p>\n<p><strong>আরও একটি উদাহরণ:</strong> (2A.F)₁₆ = 2×16 + 10 + 15/16 = <strong>42.9375₁₀</strong>। এই ধরনের উদাহরণে পূর্ণসংখ্যা ও ভগ্নাংশকে আলাদা করে সমাধান করাই সবচেয়ে নিরাপদ।</p>\n<h2>২. Decimal Integer ও Fraction-এর Conversion</h2>\n<p><strong>Integer:</strong> 13₁₀ কে Binary-তে: 13÷2=6 R1, 6÷2=3 R0, 3÷2=1 R1, 1÷2=0 R1। নিচ থেকে ওপরের ভাগশেষ = <strong>1101₂</strong>।</p>\n<p><strong>Fraction:</strong> (0.625)₁₀ কে Binary-তে: 0.625×2 = 1.25 → 1; 0.25×2=0.5 → 0; 0.5×2=1.0 →1। তাই 0.625₁₀ = <strong>0.101₂</strong>।</p>\n<p><strong>উভয় অংশ:</strong> 13.625₁₀ = <strong>1101.101₂</strong>। পূর্ণসংখ্যার ক্ষেত্রে ভাগশেষ নিচ থেকে ওপরে, ভগ্নাংশের ক্ষেত্রে গুণফলের পূর্ণাংশ ওপর থেকে নিচে। এই দুটি উল্টে ফেললে পুরো উত্তর ভুল হয়।</p>\n<p><strong>সীমাবদ্ধতা:</strong> 0.1₁₀-এর মতো অনেক Decimal Fraction Binary-তে অসীম পুনরাবৃত্ত দশমিকের মতো চলতে পারে। পরীক্ষায় নির্দিষ্ট Bit/Precision চাইলে ততটুকু পর্যন্ত দেখাবে।</p>\n<h2>৩. Binary ↔ Octal ↔ Hex: Grouping Technique</h2>\n<p>Binary থেকে Octal: Radix Point থেকে বামে ও ডানে <strong>৩ Bit করে</strong> ভাগ। Binary থেকে Hex: <strong>৪ Bit করে</strong> ভাগ। Group পূর্ণ না হলে বামে বা ডানে 0 যোগ করা যায়; পূর্ণ সংখ্যার আগে শূন্য বসালে মান বদলায় না, Fraction-এর শেষে শূন্য বসালেও মান বদলায় না।</p>\n<p><strong>সমাধান:</strong> (110101.1011)₂ কে Octal-এ: <code>110 101 . 101 100</code> = 6 5 . 5 4 → <strong>(65.54)₈</strong>। এখানে Fraction-এর শেষে দুইটি Zero যুক্ত করা হয়েছে।</p>\n<p>একই সংখ্যার Hex: <code>0011 0101 . 1011</code> = 3 5 . B → <strong>(35.B)₁₆</strong>। যাচাই: Integer 53, Fraction .6875 = Binary .1011।</p>\n<h2>৪. Arithmetic, Complement এবং Signed Number</h2>\n<p>Binary Addition: 1+1 = 10₂, তাই Sum Bit = 0, Carry = 1। 1+1+1=11₂, Sum Bit =1 এবং Carry=1।</p>\n<p><strong>সমাধান:</strong> 1011₂ + 1101₂ = 11000₂, কারণ 11+13=24।</p>\n<p><strong>2's Complement:</strong> n Bit সংখ্যায় সব Bit উল্টে ১ যোগ করা। উদাহরণ: 8-bit +13 = <code>00001101</code>; -13 = <code>11110010 +1 = 11110011</code>। 8-bit Two's Complement Signed Range <strong>−128 থেকে +127</strong>। 8-bit <code>11111111</code> হলো -1 (Unsigned হলে 255)। Bit Pattern একই থাকলেও Interpretation আলাদা; পরীক্ষায় Signed/Unsigned উল্লেখ খেয়াল করো।</p>\n<p><strong>বিয়োগ:</strong> 8-bit 15−7 করতে +15=<code>00001111</code>, -7: +7=<code>00000111</code>, Invert=<code>11111000</code>, +1=<code>11111001</code>। যোগ করলে 1 <code>00001000</code> (9-bit Carry বাদ) = <strong>8</strong>।</p>\n<h2>৫. Boolean Algebra ও De Morgan's Theorem</h2>\n<p>Boolean Variable কেবল 0/1। <code>+</code> হলো OR, <code>·</code> হলো AND এবং Overbar হলো NOT। <strong>A+0=A, A·1=A, A+1=1, A·0=0, A+A=A, A·A=A, A+A'=1, A·A'=0</strong>। <code>A'</code> মানে NOT A।</p>\n<p><strong>অভ্যাস:</strong> F = A + A·B। Absorption Law অনুযায়ী <strong>F=A</strong>। যাচাই: A=0 হলে A·B=0 → F=0; A=1 হলে F=1।</p>\n<p><strong>De Morgan:</strong> <code>(A+B)' = A'·B'</code> এবং <code>(A·B)'=A'+B'</code>। উদাহরণ: <code>(A+B+C)' = A'·B'·C'</code>। ভেতরের AND/OR বদলাবে এবং প্রতিটি Input উল্টাবে। শুধু A বা শুধু B উল্টালে ভুল।</p>\n<h2>৬. Logic Gate এবং Circuit Reasoning</h2>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th style=\"text-align:right\">A</th>\n  <th style=\"text-align:right\">B</th>\n  <th style=\"text-align:right\">AND</th>\n  <th style=\"text-align:right\">OR</th>\n  <th style=\"text-align:right\">XOR</th>\n  <th style=\"text-align:right\">NAND</th>\n  <th style=\"text-align:right\">NOR</th>\n  <th style=\"text-align:right\">XNOR</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Combined Circuit:</strong> F = (A·B)+C. Inputs A=1,B=0,C=1 হলে A·B=0; F=0+1=<strong>1</strong>। A=1,B=1,C=0 হলে F=<strong>1</strong>। Circuit আঁকার আগে Expression Bracket দেখো—AND-এর ফল পরে OR করা হচ্ছে।</p>\n<p><strong>Universal Gates:</strong> NAND দিয়ে NOT(A)= NAND(A,A); NAND ব্যবহার করে AND/OR তৈরি করা যায়। NOR দিয়েও একইভাবে NOT/OR/AND তৈরি করা যায়। এটি সাধারণ Binary Logic বাস্তবায়নের গুরুত্বপূর্ণ ধারণা।</p>\n<h2>৭. Adder, Flip-Flop ও Sequential Logic</h2>\n<p><strong>Half Adder:</strong> দুটি Input A,B; Sum=A XOR B এবং Carry=A AND B। এটি Input Carry গ্রহণ করে না। <strong>Full Adder:</strong> তিনটি Input A,B,Cin; Sum=A XOR B XOR Cin; Carry = AB + Cin(A XOR B)।</p>\n<p><strong>সমাধান:</strong> A=1,B=1,Cin=1 → মোট = 3₁₀ = 11₂। তাই Sum=1, Carry=1।</p>\n<p><strong>Combinational Circuit</strong>-এর Output বর্তমান Input-এর Function; <strong>Sequential Circuit</strong>-এ পূর্ববর্তী State/Memory-ও গুরুত্বপূর্ণ। Flip-Flop এক Bit State ধারণ করতে পারে; Register একাধিক Bit সংরক্ষণ করে এবং Counter নির্দিষ্ট Clock/State Sequence অনুসরণ করে।</p>\n<h2>৮. অনুশীলনসহ উত্তর</h2>\n<ol>\n<li><p>(101011.01)₂ কে Decimal-এ? <strong>43.25₁₀</strong> (32+8+2+1+0.25)।</p>\n</li>\n<li><p>(72)₈ কে Binary-তে? <strong>111010₂</strong> (<code>111 010</code>)।</p>\n</li>\n<li><p>(0.75)₁₀ কে Binary-তে? <strong>0.11₂</strong>।</p>\n</li>\n<li><p>8-bit এ −5? +5=<code>00000101</code>, Invert=<code>11111010</code>, +1=<code>11111011</code> → <strong>11111011</strong>।</p>\n</li>\n<li><p>A=0,B=1 হলে XNOR? <strong>0</strong>—দুটি Input আলাদা।</p>\n</li>\n<li><p>চারটি Bit সংরক্ষণে কত Flip-Flop? <strong>৪টি</strong>, সাধারণ এক-Bit Flip-Flop ধরে।</p>\n</li>\n<li><p>F=A+A·B সরল করো। <strong>A</strong>।</p>\n</li>\n</ol>\n","4":"<h1>অধ্যায় ৪: ওয়েবপেজ বানানো থেকে HTML টেবিলের জটিল সমস্যা</h1>\n<h2>১. Web-এর পথ: URL, DNS, Browser ও Server</h2>\n<p><strong>Internet</strong> হলো বহু Network-এর সমন্বয়। <strong>WWW</strong> হলো Internet-এর ওপর Hyperlink-ভিত্তিক Web Resource Service। Browser-এ URL দিলে Browser প্রয়োজন অনুযায়ী Domain Name Resolve করে Server-এ Request পাঠায় এবং Response-এর HTML, CSS, Asset ইত্যাদি ব্যবহার করে Page দেখায়। তাই Browser, Search Engine ও Internet একই জিনিস নয়।</p>\n<p>একটি URL <code>https://example.com/school/result.html</code>-এ <code>https</code> হলো Scheme, <code>example.com</code> হলো Hostname/Domain, <code>/school/result.html</code> হলো Resource Path। Browser <code>href</code> দিয়ে Link অনুসরণ করে; <code>src</code> দিয়ে Image-এর মতো Resource লোড করে।</p>\n<h2>২. Website Structure: কেন আলাদা Design?</h2>\n<p><strong>Linear:</strong> একটি Page থেকে পরের Page—ধাপে ধাপে Tutorial বা Form-এ উপযোগী। <strong>Hierarchical/Tree:</strong> Homepage → বিভাগ → উপবিভাগ—বড় কলেজ বা প্রতিষ্ঠানের Website-এ সাধারণ। <strong>Network/Hybrid:</strong> বহু Page পারস্পরিক Link-যুক্ত—তথ্যসমৃদ্ধ Site ও Hypertext ব্যবস্থায় সুবিধা। Structure নির্বাচন করলে Navigation-এর সুবিধা, ব্যবহারকারীর লক্ষ্য ও Content-এর পরিমাণ বিবেচনা করো।</p>\n<h2>৩. HTML Document-এর Anatomy</h2>\n<pre><code class=\"language-html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;bn&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;utf-8&quot;&gt;\n  &lt;title&gt;আমার কলেজ&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;কলেজের পরিচিতি&lt;/h1&gt;\n  &lt;p&gt;আমাদের ICT বিভাগে স্বাগতম।&lt;/p&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n</code></pre>\n<p><code>&lt;!DOCTYPE html&gt;</code> Browser-কে আধুনিক HTML Document হিসেবে Interpret করতে সহায়তা করে। <code>&lt;head&gt;</code>-এ Metadata থাকে; <code>&lt;title&gt;</code> Tab-এর Title; <code>&lt;body&gt;</code> ব্যবহারকারীর দৃশ্যমান মূল Content। Heading (<code>h1</code>) এবং Page Title (<code>title</code>) এক জিনিস নয়। Character Encoding <code>utf-8</code> না থাকলে বাংলা লেখার সমস্যা দেখা দিতে পারে।</p>\n<h2>৪. List, Link, Image ও Relative Path</h2>\n<pre><code class=\"language-html\">&lt;h2&gt;বিভাগসমূহ&lt;/h2&gt;\n&lt;ol&gt;\n  &lt;li&gt;Science&lt;/li&gt;\n  &lt;li&gt;Business Studies&lt;/li&gt;\n  &lt;li&gt;Humanities&lt;/li&gt;\n&lt;/ol&gt;\n&lt;ul&gt;\n  &lt;li&gt;Computer Lab&lt;/li&gt;\n  &lt;li&gt;Library&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=&quot;contact.html&quot;&gt;যোগাযোগ&lt;/a&gt;&lt;/p&gt;\n&lt;img src=&quot;images/campus.jpg&quot; alt=&quot;কলেজ ক্যাম্পাস&quot; width=&quot;300&quot;&gt;\n</code></pre>\n<p><code>ol</code> নম্বরযুক্ত List, <code>ul</code> বুলেট List, <code>li</code> পৃথক Item। <code>contact.html</code> হলো Relative Path—বর্তমান Page-এর Location অনুযায়ী নির্ধারিত। <code>https://example.com/contact</code> একটি Absolute URL-এর উদাহরণ। <code>alt</code> বর্ণনা Image লোড না হলেও অর্থ দিতে পারে এবং Accessibility-তে সাহায্য করে।</p>\n<h2>৫. Table: কাগজের চিত্র থেকে HTML Code</h2>\n<p>তালিকা বানাতে প্রথমে দেখো মোট কয়টি Column এবং কোন Cell কত Column/Row দখল করছে। <code>tr</code> = Row, <code>th</code> = Heading Cell, <code>td</code> = Data Cell। দুটি Column-এর ওপর একটি Title বসাতে <code>colspan=&quot;2&quot;</code>; দুটি Row জুড়ে একই Cell রাখতে <code>rowspan=&quot;2&quot;</code>। Merged Cell-টি দ্বিতীয়বার লিখলে অতিরিক্ত Column তৈরি হয়ে Table নষ্ট হয়।</p>\n<pre><code class=\"language-html\">&lt;table border=&quot;1&quot;&gt;\n  &lt;tr&gt;&lt;th colspan=&quot;3&quot;&gt;HSC Result&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;ICT&lt;/th&gt;&lt;th&gt;Math&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td rowspan=&quot;2&quot;&gt;Rima&lt;/td&gt;&lt;td&gt;90&lt;/td&gt;&lt;td&gt;88&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;92&lt;/td&gt;&lt;td&gt;91&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;\n</code></pre>\n<p>এখানে প্রথম Row-এর Title তিনটি Column জুড়ে; নিচের Data-তে <code>Rima</code> দুটি Row জুড়ে। দ্বিতীয় Data Row-তে Name Cell আর লেখা হয়নি। এটি সাধারণ CQ ভুলের অন্যতম।</p>\n<h2>৬. Display বনাম Structure: HTML-এর সীমা</h2>\n<p>HTML Content-এর Structure বলে; CSS মূলত Style/Presentation; JavaScript Browser-এ Interactive Behavior তৈরি করতে পারে। HSC-তে HTML Code লেখার সময় অপ্রয়োজনীয় CSS/JavaScript যোগ না করে Question অনুযায়ী Tag ও Attribute সঠিক রাখবে। <code>&lt;b&gt;</code> ও <code>&lt;strong&gt;</code> সবসময় একই Semantics নয়; <code>&lt;strong&gt;</code> Importance বোঝায়। একইভাবে <code>&lt;i&gt;</code> ও <code>&lt;em&gt;</code>-এর প্রাসঙ্গিক পার্থক্য আছে।</p>\n<h2>৭. সম্পূর্ণ Worked Practical</h2>\n<p><strong>প্রশ্ন:</strong> কলেজের নাম, Result Table, একটি Link এবং একটি Image দিয়ে Page তৈরি করো।</p>\n<pre><code class=\"language-html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;bn&quot;&gt;\n&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;title&gt;Result&lt;/title&gt;&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;ABC College&lt;/h1&gt;\n  &lt;p&gt;HSC Results&lt;/p&gt;\n  &lt;table border=&quot;1&quot;&gt;\n    &lt;tr&gt;&lt;th&gt;Roll&lt;/th&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;GPA&lt;/th&gt;&lt;/tr&gt;\n    &lt;tr&gt;&lt;td&gt;101&lt;/td&gt;&lt;td&gt;Rima&lt;/td&gt;&lt;td&gt;5.00&lt;/td&gt;&lt;/tr&gt;\n    &lt;tr&gt;&lt;td&gt;102&lt;/td&gt;&lt;td&gt;Arpa&lt;/td&gt;&lt;td&gt;4.80&lt;/td&gt;&lt;/tr&gt;\n  &lt;/table&gt;\n  &lt;p&gt;&lt;a href=&quot;https://example.com&quot;&gt;Website&lt;/a&gt;&lt;/p&gt;\n  &lt;img src=&quot;college.jpg&quot; alt=&quot;College&quot; width=&quot;250&quot;&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n</code></pre>\n<p><strong>পরীক্ষায় Check:</strong> <code>html</code>, <code>head</code>, <code>body</code> সঠিকভাবে বন্ধ; Table-এ প্রতিটি Data Row-তে তিনটি Cell; Link-এর <code>href</code> এবং Image-এর <code>src</code>; Attribute Value Quote-সহ; Heading-এর Tag ঠিক।</p>\n<h2>৮. Debugging Practice</h2>\n<p>সমস্যা: <code>&lt;a src=&quot;page.html&quot;&gt;Link&lt;/a&gt;</code>—এই Code-এর ভুল কী? <strong>সমাধান:</strong> Anchor-এর Destination দিতে <code>href</code> ব্যবহার করতে হবে, <code>src</code> নয়।</p>\n<p>সমস্যা: <code>&lt;table&gt;&lt;tr&gt;&lt;td&gt;A&lt;/tr&gt;&lt;/table&gt;</code>—Cell বন্ধ হয়নি। <strong>সমাধান:</strong> <code>&lt;td&gt;A&lt;/td&gt;&lt;/tr&gt;</code>।</p>\n<p>সমস্যা: <code>&lt;img href=&quot;photo.png&quot;&gt;</code>—Image Source দেওয়া হয়নি। <strong>সমাধান:</strong> <code>&lt;img src=&quot;photo.png&quot; alt=&quot;Photo&quot;&gt;</code>।</p>\n<p>সমস্যা: <code>&lt;p&gt;বাংলা&lt;/p&gt;</code> ঠিক হলেও ভাঙা Character দেখায়—<strong>সমাধান:</strong> File UTF-8 Encoding-এ Save করা এবং <code>&lt;meta charset=&quot;utf-8&quot;&gt;</code> যোগ করা।</p>\n","5":"<h1>অধ্যায় ৫: C Programming — মুখস্থ নয়, সমস্যার সমাধান শেখো</h1>\n<h2>১. Problem → Algorithm → Flowchart → Code → Test</h2>\n<p>Programming সমস্যা সমাধানের পদ্ধতি। আগে Input এবং প্রত্যাশিত Output আলাদা করো। তারপর কাগজে Algorithm লিখো, প্রয়োজনে Flowchart আঁকো, এরপর C Code-এ রূপ দাও। শেষ ধাপ <strong>Dry Run এবং Edge Case Test</strong>—এতে পরীক্ষার Output-Tracing প্রশ্ন সহজ হয়।</p>\n<p><strong>উদাহরণ:</strong> একটি পূর্ণসংখ্যা জোড় কি না নির্ণয়। Input: <code>n</code>; Rule: <code>n % 2 == 0</code>; Output: Even বা Odd। Algorithm: Start → Input n → <code>n % 2 == 0?</code> → Yes হলে Even, No হলে Odd → Stop। Flowchart-এ Start/Stop Oval, Input/Output Parallelogram, Condition Diamond এবং Processing Rectangle দিয়ে দেখানো হয়।</p>\n<h2>২. C Syntax-এর চারটি অপরিহার্য নিয়ম</h2>\n<pre><code class=\"language-c\">#include &lt;stdio.h&gt;\nint main(void) {\n    int a = 5;\n    printf(&quot;Value = %d\\n&quot;, a);\n    return 0;\n}\n</code></pre>\n<p><code>#include</code> Library Declaration যোগ করে; <code>main</code> থেকে Execution শুরু; Statement-এর শেষে সাধারণত Semicolon; <code>{}</code> Block তৈরি করে। <strong>একটি ভুল:</strong> <code>if (a = 5)</code> অনেক সময় Assignment হয়ে যায়, Comparison নয়। <code>if(a == 5)</code> লিখলে সমতা যাচাই করা হয়। Compiler Warning লক্ষ্য করতে শিখবে।</p>\n<h2>৩. Variable, Data Type ও Operator: নিজে বুঝে Solve</h2>\n<p><code>int</code> পূর্ণসংখ্যা, <code>float</code> ও <code>double</code> Floating-point, <code>char</code> Character। <code>int x = 7 / 2;</code> হলে C-তে দুই Operand Integer বলে <code>x</code> হয় <strong>3</strong>। <code>double y = 7.0 / 2;</code> হলে <strong>3.5</strong>।</p>\n<p><strong>Operator Precedence:</strong> <code>* / %</code> সাধারণত <code>+ -</code>-এর আগে; Bracket থাকলে আগে Bracket। <code>a += 2</code> মানে <code>a = a + 2</code>। <code>a++</code> হলো Increment—কিন্তু বড় Expression-এ Side Effect-এর ক্রম নিয়ে তাড়াহুড়ো করবে না; Beginner Code-এ আলাদা Line রাখাই ভালো।</p>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th>Expression</th>\n  <th style=\"text-align:right\">ফল (Integer Data ধরে)</th>\n  <th>ব্যাখ্যা</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><code>17 / 5</code></td>\n  <td style=\"text-align:right\">3</td>\n  <td>Integer Division</td>\n</tr>\n<tr>\n  <td><code>17 % 5</code></td>\n  <td style=\"text-align:right\">2</td>\n  <td>Remainder</td>\n</tr>\n<tr>\n  <td><code>2 + 3 * 4</code></td>\n  <td style=\"text-align:right\">14</td>\n  <td>Multiplication First</td>\n</tr>\n<tr>\n  <td><code>(2 + 3) * 4</code></td>\n  <td style=\"text-align:right\">20</td>\n  <td>Bracket First</td>\n</tr>\n<tr>\n  <td><code>5 &gt; 3 &amp;&amp; 2 &lt; 4</code></td>\n  <td style=\"text-align:right\">1</td>\n  <td>দুটি শর্তই True</td>\n</tr>\n</tbody>\n</table></div>\n<h2>৪. if/else, Nested if ও switch</h2>\n<pre><code class=\"language-c\">int marks;\nscanf(&quot;%d&quot;, &amp;marks);\nif (marks &gt;= 80) {\n    printf(&quot;A+&quot;);\n} else if (marks &gt;= 70) {\n    printf(&quot;A&quot;);\n} else {\n    printf(&quot;Below A&quot;);\n}\n</code></pre>\n<p>এটি <strong>অনুশীলনের কাল্পনিক Grading Condition</strong>, সরকারি Grade Boundary-এর দাবি নয়। Condition বড় থেকে ছোট ক্রমে থাকায় Marks=85 হলে প্রথম Branch-এ থামে। <code>if (marks &gt;= 70)</code> আগে রাখলে 85-ও সেই Branch-এ পড়তে পারে—Order গুরুত্বপূর্ণ। <code>switch</code>-এ সাধারণত Discrete Integer/Character Choice পরীক্ষা হয়; <code>break</code> না দিলে পরের <code>case</code>-এ Fall-through হতে পারে।</p>\n<h2>৫. for, while, do-while এবং Trace Table</h2>\n<p><code>for</code> নির্দিষ্ট Count-ভিত্তিক কাজে সুবিধাজনক, <code>while</code> Condition-নির্ভর পুনরাবৃত্তিতে ব্যবহৃত হতে পারে। <code>do-while</code> Body অন্তত একবার চালায় এবং পরে শর্ত যাচাই করে। কিন্তু <code>for</code> ও <code>while</code> উভয়ই বহুবিধ সমস্যা সমাধান করতে পারে।</p>\n<pre><code class=\"language-c\">int sum = 0;\nfor (int i = 1; i &lt;= 5; i++) {\n    sum += i;\n}\nprintf(&quot;%d&quot;, sum);\n</code></pre>\n<div class=\"tablewrap\" role=\"region\" tabindex=\"0\" aria-label=\"তালিকা; প্রয়োজনে পাশে স্ক্রল করো\"><table>\n<thead>\n<tr>\n  <th style=\"text-align:right\">Iteration</th>\n  <th style=\"text-align:right\">i</th>\n  <th style=\"text-align:right\">Sum আগে</th>\n  <th style=\"text-align:right\">Sum পরে</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">0</td>\n  <td style=\"text-align:right\">1</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">2</td>\n  <td style=\"text-align:right\">2</td>\n  <td style=\"text-align:right\">1</td>\n  <td style=\"text-align:right\">3</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">3</td>\n  <td style=\"text-align:right\">3</td>\n  <td style=\"text-align:right\">3</td>\n  <td style=\"text-align:right\">6</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">4</td>\n  <td style=\"text-align:right\">4</td>\n  <td style=\"text-align:right\">6</td>\n  <td style=\"text-align:right\">10</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">5</td>\n  <td style=\"text-align:right\">5</td>\n  <td style=\"text-align:right\">10</td>\n  <td style=\"text-align:right\">15</td>\n</tr>\n</tbody>\n</table></div>\n<p>Loop Condition-এর মধ্যে <code>&lt;=</code> বনাম <code>&lt;</code> খুব গুরুত্বপূর্ণ। <code>i&lt;5</code> হলে 1,2,3,4—চারবার; <code>i&lt;=5</code> হলে পাঁচবার। কোনো Loop-এ Update না থাকলে Infinite Loop হতে পারে।</p>\n<h2>৬. দশটি Exam-Focused Program Pattern</h2>\n<p><strong>Pattern A — যোগ:</strong> দুটি Input → <code>sum=a+b</code> → Print।</p>\n<p><strong>Pattern B — Even/Odd:</strong> <code>n % 2</code> শূন্য হলে Even। Negative Integer-এর ক্ষেত্রেও <code>n%2==0</code> দিয়ে জোড় শনাক্ত করা যায়।</p>\n<p><strong>Pattern C — Largest of Three:</strong> <code>a&gt;=b &amp;&amp; a&gt;=c</code> ইত্যাদি; Equal Number-এর ক্ষেত্রেও কাজ করতে <code>&gt;=</code> ব্যবহার।</p>\n<p><strong>Pattern D — Sum 1..N:</strong> <code>sum=0</code>, Loop 1 থেকে N, প্রতিবার Sum-এ i যোগ। <code>n&lt;=0</code> ইনপুটের ক্ষেত্রে Problem Statement অনুযায়ী সিদ্ধান্ত।</p>\n<p><strong>Pattern E — Factorial:</strong> <code>fact=1</code>, Loop 2 থেকে n। 0! = 1। Negative Integer-এর Factorial সাধারণ এই Code-এ সংজ্ঞায়িত নয়; বড় n-এ Overflow হয়।</p>\n<p><strong>Pattern F — Prime:</strong> <code>n&lt;2</code> হলে Not Prime; অন্যথায় 2 থেকে √n পর্যন্ত কোনো Divisor আছে কি না দেখো। 1 Prime নয়।</p>\n<p><strong>Pattern G — Fibonacci:</strong> 0,1 থেকে শুরু করে পরবর্তী Term = আগের দুইটির যোগ। সমস্যা 0,1 নাকি 1,1 থেকে Series চাইছে দেখে নাও।</p>\n<p><strong>Pattern H — Multiplication Table:</strong> <code>for(i=1;i&lt;=10;i++) printf(&quot;%d x %d = %d\\n&quot;,n,i,n*i);</code>।</p>\n<p><strong>Pattern I — Array Max:</strong> <code>max=a[0]</code>; Index 1 থেকে n−1 পর্যন্ত তুলনা করো। Array খালি হলে এই Pattern চলে না।</p>\n<p><strong>Pattern J — Linear Search:</strong> প্রতিটি Element Target-এর সঙ্গে তুলনা করে Position বের করো; না পেলে Not Found।</p>\n<h2>৭. পুরো Code: Prime Test</h2>\n<pre><code class=\"language-c\">#include &lt;stdio.h&gt;\nint main(void) {\n    int n, prime = 1;\n    scanf(&quot;%d&quot;, &amp;n);\n    if (n &lt; 2) prime = 0;\n    for (int i = 2; i &lt;= n / i; i++) {\n        if (n % i == 0) {\n            prime = 0;\n            break;\n        }\n    }\n    printf(prime ? &quot;Prime\\n&quot; : &quot;Not Prime\\n&quot;);\n    return 0;\n}\n</code></pre>\n<p>13 দিলে 2 ও 3 দ্বারা ভাগ হয় না → Prime। 15 দিলে 3 দ্বারা ভাগ হয় → Not Prime। <code>i&lt;=n/i</code> কৌশলটি Integer Overflow ছাড়াই কার্যকর সীমা √n-এর কাছাকাছি রাখে।</p>\n<h2>৮. Array, Function ও String-এর ব্যবহার</h2>\n<p>Array Index 0 থেকে শুরু। <code>int a[3]={5,8,2};</code>-এ <code>a[0]=5</code>, <code>a[2]=2</code>; <code>a[3]</code> অনুমোদিত Element নয়। Function দিয়ে বড় Problem ছোট অংশে ভাগ করা যায়:</p>\n<pre><code class=\"language-c\">int square(int x) { return x * x; }\n</code></pre>\n<p><code>char name[10] = &quot;ICT&quot;;</code> একটি Null-terminated C String—শেষে <code>\\0</code> থাকে। <code>strlen(name)</code> = 3, যদিও Array-তে 10টি Character Storage আছে। <code>%s</code> দিয়ে Input নেওয়ার সময় Buffer Limit নিয়ন্ত্রণ না করলে Overflow হতে পারে; Safer Code-এ Width Limit যেমন <code>%9s</code> ব্যবহার করা যায়।</p>\n<h2>৯. Debugging Workbook—নিজে ঠিক করো</h2>\n<p><strong>ভুল:</strong> <code>scanf(&quot;%d&quot;, n);</code> — <code>int n</code> হলে Address পাঠানো দরকার → <strong><code>scanf(&quot;%d&quot;, &amp;n);</code></strong>।</p>\n<p><strong>ভুল:</strong> <code>if (a = b)</code> — Equality Check চাইলে → <strong><code>if (a == b)</code></strong>।</p>\n<p><strong>ভুল:</strong> <code>for(i=1; i&lt;=n; i--){...}</code> — n ধনাত্মক ও i=1 হলে i কমতেই থাকবে; উপযুক্ত Increment → <strong><code>i++</code></strong>।</p>\n<p><strong>ভুল:</strong> <code>int a[5]; a[5] = 9;</code> — ০–৪ বৈধ Index; <strong><code>a[4] = 9;</code></strong> শেষ Element।</p>\n<p><strong>ভুল:</strong> Factorial-এ <code>fact=0</code> — যত গুণ করো Zero; <strong><code>fact=1</code></strong> থেকে শুরু।</p>\n<p><strong>ভুল:</strong> <code>printf(&quot;%d&quot;, 5.0);</code> — Format Type Mismatch; Floating-point Output চাইলে <strong><code>%f</code></strong> ব্যবহার।</p>\n<h2>১০. সংক্ষিপ্ত প্রশ্ন: নিজে লিখে তারপর উত্তর মিলাও</h2>\n<ol>\n<li><p><code>int a=3; a+=2;</code> এর পর a কত? <strong>5</strong>।</p>\n</li>\n<li><p><code>for(int i=0;i&lt;4;i++)</code> কয়বার? <strong>4</strong>।</p>\n</li>\n<li><p><code>int x=9/4;</code> x কত? <strong>2</strong>।</p>\n</li>\n<li><p><code>do-while</code> কেন আলাদা? <strong>Body অন্তত একবার চলে</strong>, পরে Condition পরীক্ষা হয়।</p>\n</li>\n<li><p>1 Prime? <strong>না।</strong> Prime-এর ধনাত্মক গুণনীয়ক ঠিক দুইটি হতে হয়।</p>\n</li>\n<li><p><code>int arr[4]</code>-এর শেষ বৈধ Index? <strong>3</strong>।</p>\n</li>\n</ol>\n","6":"<h1>অধ্যায় ৬: একটি বাস্তব কলেজ ডেটাবেজ ডিজাইন ও SQL সমাধান</h1>\n<h2>১. Data থেকে Relational Database</h2>\n<p>বিচ্ছিন্নভাবে রাখা শিক্ষার্থীর Roll, Name ও Marks হলো Raw Data; শিক্ষার্থীভিত্তিক Result Report তৈরি হলে তা অর্থপূর্ণ Information। Database এই Data সুশৃঙ্খল রাখে। DBMS Data Insert, Query, Update, Security ও Access Control পরিচালনা করে। Relational Model-এ Related Table Key ব্যবহার করে যুক্ত করা হয়।</p>\n<p>উদাহরণ: প্রতিটি শিক্ষার্থীর নাম ও ঠিকানা প্রতিটি পরীক্ষা-ফলাফলের Row-তে বারবার লিখলে নাম সংশোধনের সময় অসামঞ্জস্য তৈরি হতে পারে। Students এবং Results আলাদা Table করলে Redundancy কমে। তবে কীভাবে ভাগ করা হবে তা Key ও Relationship-এর ওপর নির্ভর করে।</p>\n<h2>২. একটি Database Schema</h2>\n<p><strong>Students</strong>: StudentID (Primary Key), Name, Section।</p>\n<p><strong>Courses</strong>: CourseID (Primary Key), CourseName।</p>\n<p><strong>Results</strong>: ResultID (Primary Key), StudentID (Foreign Key), CourseID (Foreign Key), Marks।</p>\n<p>এতে একটি Student-এর অনেক Result থাকতে পারে, একটি Course-এ অনেক Student থাকতে পারে। Students ও Courses-এর অনেক-থেকে-অনেক (M:N) সম্পর্ক <code>Results</code>-এর মতো Junction Table দিয়ে বাস্তবায়ন করা যায়। Foreign Key-এর লক্ষ্য হলো উল্লেখ করা Student/Course Record-এর অস্তিত্ব যাচাই করা।</p>\n<pre><code class=\"language-sql\">CREATE TABLE Students (\n  StudentID INT PRIMARY KEY,\n  Name VARCHAR(80) NOT NULL,\n  Section VARCHAR(20)\n);\nCREATE TABLE Courses (\n  CourseID INT PRIMARY KEY,\n  CourseName VARCHAR(80) NOT NULL\n);\nCREATE TABLE Results (\n  ResultID INT PRIMARY KEY,\n  StudentID INT NOT NULL,\n  CourseID INT NOT NULL,\n  Marks DECIMAL(5,2),\n  FOREIGN KEY (StudentID) REFERENCES Students(StudentID),\n  FOREIGN KEY (CourseID) REFERENCES Courses(CourseID)\n);\n</code></pre>\n<p>এটি প্রচলিত SQL-ধাঁচের উদাহরণ। Database Engine ভেদে Auto-Numbering ও কিছু Data Type/Syntax আলাদা হতে পারে।</p>\n<h2>৩. Key বেছে নেওয়ার পদ্ধতি</h2>\n<p><strong>Primary Key</strong> প্রতিটি Row-এর অনন্য পরিচয় দেয় এবং সাধারণত NULL হতে পারে না। <strong>Candidate Key</strong> হলো এমন ন্যূনতম Attribute Set যা Row-কে অনন্যভাবে চিহ্নিত করতে পারে; সেগুলোর মধ্যে একটি Primary Key নির্বাচিত হয়। <strong>Composite Key</strong> একাধিক Column দিয়ে গঠিত Key। <strong>Foreign Key</strong> অন্য Table-এর Candidate/Primary Key-কে Refer করতে পারে। <strong>Unique Constraint</strong> ডুপ্লিকেট Value নিয়ন্ত্রণ করে, তবে NULL সম্পর্কিত আচরণ DBMS ভেদে ভিন্ন হতে পারে।</p>\n<p>একজন শিক্ষার্থী একই Course দুইবার দিলে StudentID+CourseID সবসময় Unique হবে না; তখন Attempt/ExamDate বা আলাদা ResultID দরকার। Key বাছার আগে বাস্তব নিয়ম জানা জরুরি—এটিই পরীক্ষার ঘ-উত্তরকে উন্নত করে।</p>\n<h2>৪. CRUD: Create, Read, Update, Delete</h2>\n<pre><code class=\"language-sql\">INSERT INTO Students (StudentID, Name, Section)\nVALUES (101, 'Rima', 'A');\n\nSELECT StudentID, Name FROM Students\nWHERE Section = 'A'\nORDER BY Name ASC;\n\nUPDATE Students\nSET Section = 'B'\nWHERE StudentID = 101;\n\nDELETE FROM Students\nWHERE StudentID = 101;\n</code></pre>\n<p><strong>সতর্কতা:</strong> <code>UPDATE</code> বা <code>DELETE</code>-এ WHERE না থাকলে অনেক Row বদলে/মুছে যেতে পারে। বাস্তব Database-এ Transaction, Backup এবং Foreign-Key Constraint বিবেচনা জরুরি।</p>\n<h2>৫. WHERE, NULL, LIKE ও Logical Conditions</h2>\n<p><code>WHERE Marks &gt;= 80 AND Marks &lt;= 100</code> দুটি শর্তই পূরণ করে এমন Row বাছবে। <code>OR</code> থাকলে যেকোনো শর্ত পূরণ করলেই চলবে। <code>LIKE 'R%'</code> দিয়ে সাধারণ SQL-এ R দিয়ে শুরু হওয়া Name খোঁজা যায়। <code>Name IS NULL</code> দিয়ে Missing Value যাচাই হয়; <code>Name = NULL</code> সাধারণ SQL-এর সঠিক NULL Test নয়। NULL শূন্য বা খালি String-এর সমার্থক নয়।</p>\n<p><strong>সমাধান:</strong> GPA 4.8 বা বেশি এবং Section A:</p>\n<pre><code class=\"language-sql\">SELECT StudentID, Name, GPA\nFROM Students\nWHERE GPA &gt;= 4.8 AND Section = 'A';\n</code></pre>\n<p>উপরের Query চালাতে <code>Students</code> Table-এ GPA Column থাকতে হবে; আমাদের প্রথম Schema-তে এটি ছিল না। তাই Query ব্যবহার করার আগে Table Structure অনুযায়ী Column মিলিয়ে নিতে হবে। পরীক্ষার প্রশ্নে যে Schema দেওয়া হবে সেটিই অনুসরণ করো।</p>\n<h2>৬. JOIN, GROUP BY ও HAVING</h2>\n<p>একটি Table-এ Student Name, অন্য Table-এ Marks থাকলে <code>JOIN</code> দিয়ে সম্পর্কিত Data একত্র করা যায়।</p>\n<pre><code class=\"language-sql\">SELECT s.Name, c.CourseName, r.Marks\nFROM Results r\nJOIN Students s ON s.StudentID = r.StudentID\nJOIN Courses c ON c.CourseID = r.CourseID\nWHERE r.Marks &gt;= 80;\n</code></pre>\n<p>প্রতিটি Course-এর গড় Marks:</p>\n<pre><code class=\"language-sql\">SELECT CourseID, AVG(Marks) AS AvgMarks\nFROM Results\nGROUP BY CourseID;\n</code></pre>\n<p>শুধু ৮০ বা তার বেশি Average-যুক্ত Group:</p>\n<pre><code class=\"language-sql\">SELECT CourseID, AVG(Marks) AS AvgMarks\nFROM Results\nGROUP BY CourseID\nHAVING AVG(Marks) &gt;= 80;\n</code></pre>\n<p><strong>WHERE</strong> Grouping-এর আগে Individual Row Filter করে; <strong>HAVING</strong> Grouping-এর পরে Group Condition পরীক্ষা করে। এই পার্থক্য প্রশ্নে নিয়মিত কাজে লাগে।</p>\n<h2>৭. Normalization: ডুপ্লিকেট তথ্য কমানো</h2>\n<p>ধরা যাক <code>Enrollment(StudentID, StudentName, CourseID, CourseName)</code> Table-এ প্রতিটি Student-এর জন্য অনেক Course Row আছে। StudentName বারবার, CourseName-ও অনেকবার লেখা হয়। Student-এর নাম বদলালে বহু Row Update করতে হতে পারে: এটি <strong>Update Anomaly</strong>। Course-এর একজনও Student না থাকলে Course Data রাখা কঠিন হলে <strong>Insert Anomaly</strong>। শেষ Enrollment মুছলে Course-এর Information হারিয়ে গেলে <strong>Delete Anomaly</strong>।</p>\n<p>সাধারণ সমাধান: <code>Students(StudentID, StudentName)</code>, <code>Courses(CourseID, CourseName)</code>, <code>Enrollments(StudentID, CourseID)</code>। এতে পৃথক Entity-র Data আলাদাভাবে থাকে। 1NF/2NF/3NF-এর পূর্ণাঙ্গ তত্ত্ব আরেকটি বিস্তৃত বিষয়; এই উদাহরণে Functional Dependency বুঝে Redundancy কমানোই উদ্দেশ্য।</p>\n<h2>৮. Index, Security ও Backup</h2>\n<p><strong>Index</strong> নির্দিষ্ট অনুসন্ধান দ্রুত করতে সাহায্য করে, কিন্তু Storage প্রয়োজন এবং Insert/Update-এ অতিরিক্ত কাজ হতে পারে। <strong>Backup</strong> Data-এর Recoverable Copy; <strong>Restore</strong> দিয়ে তা ফিরিয়ে আনা হয়। <strong>Access Control</strong> কে কোন Data দেখতে/পরিবর্তন করতে পারবে সেটি নির্ধারণ করে। Password Hashing, Encryption, Audit Log, Least Privilege এবং Data Privacy—এসব গুরুত্বপূর্ণ নিরাপত্তা ধারণা।</p>\n<p><strong>CQ Case:</strong> কলেজের Result Database-এ শুধু পরীক্ষার কর্মকর্তারা Marks পরিবর্তন করতে পারবেন, শিক্ষার্থীরা নিজের ফলাফল দেখবেন। Role-based Permission এবং Audit Log উপযোগী; শুধু Password দিয়ে সব Permission সমান করে দেওয়া ঝুঁকিপূর্ণ।</p>\n<h2>৯. স্ব-পরীক্ষা</h2>\n<ol>\n<li><p>StudentID Primary Key কেন? <strong>প্রতিটি Student Record আলাদা করতে।</strong></p>\n</li>\n<li><p>StudentID+CourseID দুই Column মিলে Key হলে কী? <strong>Composite Key</strong>।</p>\n</li>\n<li><p>Table A-র Foreign Key Table B-তে কী করে? <strong>সম্পর্কিত Row-এর Reference দেয়।</strong></p>\n</li>\n<li><p><code>WHERE GPA &gt; 4.5</code> কী করে? <strong>Individual Row Filter করে।</strong></p>\n</li>\n<li><p><code>HAVING COUNT(*) &gt; 3</code> কী করে? <strong>Group তৈরি হওয়ার পরে Aggregate Condition প্রয়োগ করে।</strong></p>\n</li>\n<li><p><code>ORDER BY Marks DESC</code>? <strong>Marks বড় থেকে ছোট সাজায়।</strong></p>\n</li>\n<li><p><code>IS NULL</code> আর <code>=NULL</code> সমার্থক? <strong>না।</strong> NULL Test-এ <code>IS NULL</code> ব্যবহার করা হয়।</p>\n</li>\n</ol>\n"}};
</script>
<script>
'use strict';
const DATA=COURSE_DATA;
const STORE_KEY='ict_scholar_2028_v2';
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>[...p.querySelectorAll(s)];
const E=(v)=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
// Safely format authored inline Markdown in MCQ, CQ and short answers.
// Escape first; only then replace limited markup so HTML examples cannot execute.
const richText=v=>E(v).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
const CLASSES=DATA.chapters;
const ALL=DATA.lessons;
const MAX_COUNTS={};CLASSES.forEach(c=>MAX_COUNTS[c.id]=ALL.filter(l=>l.ch===c.id).length);
const defaultState=()=>({completed:{},bookmarks:{},notes:{},tasks:{},cqDrafts:{},cqOpen:{},mistakes:[],quizScope:'1',quizAnswers:{},quizSubmitted:false,quizAttempts:[],theme:'light',flashCh:'all',flashIndex:0,flashFlip:false,lab:'numbers',htmlEditor:DATA.htmlSample,sqlEditor:'SELECT Name, GPA FROM Students WHERE GPA >= 4.80 ORDER BY GPA DESC;',mock:null});
let state=defaultState();
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved&&typeof saved==='object'){state={...state,...saved};}}catch(_e){}
const persist=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(_e){toast('ব্রাউজারে Progress Save করা যাচ্ছে না; Backup Export করো।');}};
const completedTotal=()=>ALL.filter(l=>state.completed[l.id]).length;
const pct=n=>Math.round(100*n/ALL.length);
const chapterLessons=ch=>ALL.filter(l=>l.ch===Number(ch));
const chapterMeta=ch=>CLASSES.find(c=>c.id===Number(ch))||CLASSES[0];
const finishedCh=ch=>chapterLessons(ch).filter(l=>state.completed[l.id]).length;
const mistakeCount=()=>Array.isArray(state.mistakes)?state.mistakes.length:0;
const tally=(xs,fn)=>xs.reduce((t,x)=>t+fn(x),0);
const totalMinutes=ALL.reduce((s,l)=>s+l.minutes,0);
const fmtM=m=>`${Math.floor(m/60)} ঘণ্টা ${m%60} মিনিট`;
const route=()=>decodeURIComponent(location.hash.slice(1)||'home').split('/');
const to=(r)=>{if(location.hash.slice(1)===r){render();window.scrollTo(0,0);}else location.hash=r;document.body.classList.remove('menu-open');};
const navButton=(label,path,kind='secondary')=>`<button class="btn ${kind==='primary'?'':'secondary'}" data-route="${E(path)}">${label}</button>`;
const bar=(value,max=100)=>`<div class="progress"><i style="width:${Math.max(0,Math.min(100,value/max*100))}%"></i></div>`;
const countBadge=(value)=>`<span class="chip">${E(value)}</span>`;
function notice(){return `<div class="notice"><b>পাঠ্যসূচি নোট · HSC 2028:</b> ২০২৬–২৭ শিক্ষাবর্ষের একাদশ শ্রেণির জন্য ICT পাঠ্যসূচি প্রকাশিত হয়েছে। এই স্বাধীন কোর্সে প্রচলিত ৬ অধ্যায়ের বিষয়গুলো বিস্তারিতভাবে শেখানো হয়েছে। সরকারি বই/নোটিশের কোনো পরবর্তী সংশোধন হলে সেটিকে অগ্রাধিকার দেবে। <button class="btn tiny ghost" data-route="sources" style="margin-left:5px">সূত্র দেখো</button></div>`}
function chapterCard(c){const ls=chapterLessons(c.id),done=finishedCh(c.id),p=Math.round(done/ls.length*100);return `<div class="card chapter-card"><div class="row between"><div class="chapter-icon">${c.icon}</div>${countBadge(done+'/'+ls.length+' পাঠ')}</div><div><h3>${c.id}. ${E(c.name)}</h3><p>${E(c.sub)}</p></div>${bar(done,ls.length)}<div class="row between"><small class="muted">${ls.length} টি বিস্তারিত পাঠ · ${fmtM(tally(ls,l=>l.minutes))}</small><button class="btn tiny ghost" data-route="reader/${c.id}">পুরো বই →</button></div></div>`;}
function renderHome(){const done=completedTotal(),progress=pct(done);const last=ALL.find(l=>!state.completed[l.id])||ALL[0];const attempt=state.quizAttempts.slice(-1)[0];return `<section class="hero"><div><div class="kicker">THE COMPLETE LEARNING STUDIO</div><h1>ICT-তে ৯০+ নম্বরের<br>প্রস্তুতি শুরু হোক বুঝে শেখার মাধ্যমে।</h1><p>৭১টি গভীর বাংলা পাঠ, সমাধানসহ অনুশীলন, সৃজনশীল প্রশ্ন, সংখ্যাপদ্ধতি থেকে প্রোগ্রামিং—সব একটি পাঠক্রমে।</p><div class="row wrap" style="margin-top:22px">${navButton('যেখান থেকে পড়া বাকি →',`lesson/${last.ch}/${last.index}`,'primary')}${navButton('পড়ার রুটিন','plan')}</div></div><div class="hero-circle"><div><strong>${progress}%</strong><span>COURSE PROGRESS</span></div></div></section>${notice()}<div class="grid four" style="margin-top:19px"><div class="card stat"><div class="stat-num">${ALL.length}</div><div class="stat-label">বিস্তারিত পাঠ</div></div><div class="card stat"><div class="stat-num">${DATA.drillsCount}</div><div class="stat-label">সমাধানসহ প্রশ্ন</div></div><div class="card stat"><div class="stat-num">${DATA.mcqs.length}</div><div class="stat-label">MCQ প্রশ্ন</div></div><div class="card stat"><div class="stat-num">${DATA.cqs.length}</div><div class="stat-label">সমাধানসহ CQ</div></div></div><div class="section-head"><div><div class="kicker">LEARNING MAP</div><h2>৬টি অধ্যায়ের সম্পূর্ণ পাঠক্রম</h2><p class="muted">প্রতিটি ক্ষুদ্র Topic শিখো, Worked Example দেখো, নিজের উত্তর লিখে যাচাই করো।</p></div>${navButton('সব পাঠ','chapters')}</div><div class="grid three">${CLASSES.map(chapterCard).join('')}</div><div class="section-head"><div><div class="kicker">YOUR NEXT MOVE</div><h2>যে কাজগুলো নম্বর বাড়ায়</h2></div></div><div class="grid three"><div class="card pad"><div class="chapter-icon">🧠</div><h3>বোঝো, তারপর মনে রাখো</h3><p class="muted">এক পাঠে মূল ধারণা, উদাহরণ, ভুল ধারণা ও অনুশীলন।</p>${navButton('পাঠে যাও','chapters')}</div><div class="card pad"><div class="chapter-icon">✍️</div><h3>লিখে অনুশীলন করো</h3><p class="muted">ক–খ–গ–ঘ function renderChapters(){return `<div class="kicker">DIGITAL TEXTBOOK / INDEX</div><h1>সম্পূর্ণ পাঠ্যবই</h1><p class="lead">এই বইয়ের সূচি ৬ অধ্যায়ে ৭১টি Topic-এ ভাগ করা হয়েছে। এগুলো সংক্ষিপ্ত নোট নয়: প্রতিটি পাঠে ব্যাখ্যা, পরীক্ষায় প্রয়োগ, Worked Solution এবং সংশোধনযোগ্য ভুলের আলোচনা আছে।</p><div class="grid two">${CLASSES.map(c=>`<div class="card pad"><div class="row between"><div class="row"><div class="chapter-icon">${c.icon}</div><div><small class="muted">অধ্যায় ${c.id}</small><h3 style="margin:0">${E(c.name)}</h3></div></div>${countBadge(`${finishedCh(c.id)}/${MAX_COUNTS[c.id]}`)}</div><div class="row wrap" style="margin-top:13px"><button class="btn tiny" data-route="reader/${c.id}">📖 পুরো অধ্যায় একসঙ্গে পড়ো</button><button class="btn tiny secondary" data-route="lesson/${c.id}/0">Topic ধরে পড়ো</button><button class="btn tiny secondary" data-route="masterclass/${c.id}">✦ Masterclass</button></div><div style="margin:14px 0">${bar(finishedCh(c.id),MAX_COUNTS[c.id])}</div><div>${chapterLessons(c.id).map((l,i)=>`<button class="topic-link" data-route="lesson/${c.id}/${i}"><span class="topic-index">${state.completed[l.id]?'✓':i+1}</span><span>${E(l.title)}</span><span style="margin-left:auto;color:var(--muted)">${l.minutes}m</span></button>`).join('')}</div></div>`).join('')}</div>`;}
function renderLesson(ch,index){const list=chapterLessons(ch),i=Math.min(Math.max(0,Number(index)||0),list.length-1),l=list[i],meta=chapterMeta(ch);if(!l)return '<div class="empty">পাঠ পাওয়া যায়নি।</div>';let next=list[i+1] || chapterLessons(Number(ch)+1)[0] || null;let prev=list[i-1] || chapterLessons(Number(ch)-1).slice(-1)[0] || null;return `<div class="row between wrap" style="margin-bottom:17px"><div><div class="kicker">CHAPTER ${ch} · LESSON ${i+1}/${list.length}</div><h2 style="margin:4px 0">${meta.icon} ${E(meta.name)}</h2></div><div class="row wrap">${countBadge(`${l.minutes} মিনিট`)}${countBadge(state.completed[l.id]?'✓ সম্পন্ন':'○ পড়া বাকি')}</div></div><div class="lesson-layout"><article class="card lesson-book"><div class="row between wrap"><span class="chip">পাঠ ${i+1} / ${list.length}</span><span class="muted small">${finishedCh(ch)}টি পাঠ সম্পন্ন · অধ্যায় ${ch}</span></div><h1>${E(l.title)}</h1><p class="lead">এই পাঠটি প্রথমে পড়ো; তারপর বই বন্ধ করে উদাহরণটি নিজে সমাধান করো এবং নিচের অনুশীলনগুলোর উত্তর দাও।</p><div class="lesson-text">${l.html}</div><div class="callout good"><h3>✦ Worked Example — ধাপে ধাপে সমাধান</h3><div class="lesson-text">${l.workedHtml}</div></div><div class="callout warn"><h3>⚠ সাধারণ ভুল — এখানে নম্বর হারাবে না</h3><div>${E(l.trap)}</div></div><div class="section-head"><div><div class="kicker">CHECK YOUR UNDERSTANDING</div><h2>অনুশীলন ও সমাধান</h2></div>${countBadge(l.drills.length+' প্রশ্ন')}</div><p class="muted small">প্রথমে খাতায় লিখো। তারপর প্রশ্নে ক্লিক করে উত্তর মিলাও।</p>${l.drills.map((d,j)=>`<details class="drill"><summary>প্রশ্ন ${j+1}: ${richText(d.q)}</summary><div class="answer"><b>সমাধান:</b> ${richText(d.a)}</div></details>`).join('')}<div class="lesson-actions"><button class="btn ${state.completed[l.id]?'secondary':''}" data-action="complete" data-id="${l.id}">${state.completed[l.id]?'✓ পড়া হয়েছে · বাতিল করো':'✓ এই পাঠ সম্পন্ন করো'}</button><button class="btn secondary" data-action="bookmark" data-id="${l.id}">${state.bookmarks[l.id]?'★ বুকমার্ক করা':'☆ বুকমার্ক'}</button><button class="btn secondary" data-action="print">⎙ প্রিন্ট করো</button></div><div class="callout" style="margin-top:21px"><h3>📝 নিজের নোট</h3><p class="muted small">যে সূত্র, সংজ্ঞা বা ভুলটি মনে রাখতে চাও লিখে রাখো। এই ব্রাউজারে স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে।</p><textarea class="textarea" data-note="${l.id}" placeholder="এই পাঠ থেকে যা শিখলে, নিজের ভাষায় লিখো...">${E(state.notes[l.id]||'')}</textarea></div><div class="lesson-nav"><div>${prev?navButton('← আগের পাঠ',`lesson/${prev.ch}/${prev.index}`):''}</div><div>${next?navButton('পরের পাঠ →',`lesson/${next.ch}/${next.index}`,'primary'):navButton('MCQ অনুশীলন →','practice','primary')}</div></div></article><aside class="card lesson-aside"><h3>${meta.icon} অধ্যায় ${ch} · সব পাঠ</h3><div class="progress" style="margin:10px 0 15px"><i style="width:${Math.round(finishedCh(ch)/list.length*100)}%"></i></div>${list.map((s,j)=>`<button class="topic-link ${i===j?'active':''}" data-route="lesson/${ch}/${j}"><span class="topic-index">${state.completed[s.id]?'✓':j+1}</span><span>${E(s.title)}</span></button>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><button class="btn secondary" style="width:100%" data-route="reader/${ch}">📖 পুরো অধ্যায় একসঙ্গে</button><button class="btn secondary" style="width:100%;margin-top:8px" data-route="masterclass/${ch}">✦ আরও গভীর Masterclass</button><button class="btn secondary" style="width:100%;margin-top:8px" data-action="practice-ch" data-ch="${ch}">এই অধ্যায়ের MCQ →</button></aside></div>`;}

let quizListCache=null;
function getQuizItems(){if(!quizListCache||quizListCache.scope!==state.quizScope){let items=DATA.mcqs.map((q,i)=>({q,i}));if(state.quizScope==='wrong'){items=items.filter(x=>(state.mistakes||[]).includes(x.i));}else if(state.quizScope==='mixed'){const s=Date.now();items=shuffle(items,s).slice(0,30)}else if(state.quizScope!=='all')items=items.filter(x=>x.q[0]===Number(state.quizScope));quizListCache={scope:state.quizScope,items};}return quizListCache.items;}
function shuffle(a,seed){let s=(seed>>>0)||123456789;const out=[...a];for(let i=out.length-1;i>0;i--){s=(Math.imul(1664525,s)+1013904223)>>>0;let j=s%(i+1);[out[i],out[j]]=[out[j],out[i]];}return out;}

function runLogic(){const g=$('#gate')?.value||'AND',a=+($('#inputA')?.value||0),b=+($('#inputB')?.value||0);const res=$('#logicResult');if(!res)return;res.innerHTML=`<div class="callout good"><div class="row between"><div><div class="kicker">CURRENT OUTPUT</div><h2>${g}: A=${a}, B=${b}</h2></div><div style="font:800 45px Manrope;color:var(--aqua)">${gateEval(g,a,b)}</div></div></div><div class="tablewrap"><table class="truth"><thead><tr><th>A</th><th>B</th><th>${E(g)}</th></tr></thead><tbody>${(g==='NOT A'?[0,1].map(a=>[a,null]):[0,1].flatMap(a=>[0,1].map(b=>[a,b]))).map(([a,b])=>`<tr><td>${a}</td><td>${b===null?'—':b}</td><td class="${gateEval(g,a,b===null?0:b)===1?'on':''}">${gateEval(g,a,b===null?0:b)}</td></tr>`).join('')}</tbody></table></div><p class="muted small">NOT A Gate-এ Output শুধু A-এর ওপর নির্ভর করে, B-কে উপেক্ষা করা হয়।</p>`;}
function runBase(){
 const raw=($('#baseValue')?.value||'').trim().toUpperCase();
 const from=Number($('#baseFrom')?.value),to=Number($('#baseTo')?.value),out=$('#baseResult');
 if(!out)return;
 const sign=raw.startsWith('-')?-1:1,src=sign<0?raw.slice(1):raw;
 const digits='0123456789ABCDEF',parts=src.split('.');
 if(![2,8,10,16].includes(from)||![2,8,10,16].includes(to)||!/^\-?[0-9A-F]+(?:\.[0-9A-F]{1,12})?$/.test(raw)||raw.length>70||parts.length!==1&&parts.length!==2||[...src.replace('.','')].some(c=>!digits.slice(0,from).includes(c))){
  out.textContent='সঠিক Base-এর সংখ্যা দাও। যেমন 101.01 বা A.F; Fraction সর্বোচ্চ ১২ Digit।';return;
 }
 // Exact rational arithmetic: no floating point rounding, including 0.1 decimal to binary.
 const b=BigInt(from),target=BigInt(to);
 let whole=0n,fracN=0n,fracD=1n;
 for(const d of parts[0])whole=whole*b+BigInt(digits.indexOf(d));
 for(const d of (parts[1]||'')){fracN=fracN*b+BigInt(digits.indexOf(d));fracD*=b;}
 let quo=whole,wholeText='',division=[];
 do {const r=quo%target;const next=quo/target;division.push(`${quo} ÷ ${to} = ${next}, ভাগশেষ ${r}`);wholeText=digits[Number(r)]+wholeText;quo=next;}while(quo>0n);
 let fracText='',num=fracN,steps=[],limit=24;
 for(let i=0;i<limit&&num>0n;i++){
  const previous=num;num*=target;
  const digit=num/fracD;
  num%=fracD;
  fracText+=digits[Number(digit)];
  if(i<10)steps.push(`${previous}/${fracD} × ${to} = ${digit} + ${num}/${fracD}`);
 }
 const approximate=num!==0n;
 const negative=sign<0&&(whole!==0n||fracN!==0n);
 const result=(negative?'-':'')+wholeText+(fracText?'.'+fracText:'');
 const positional=[...parts[0]].map((c,i)=>`${digits.indexOf(c)} × ${from}<sup>${parts[0].length-1-i}</sup>`);
 if(parts[1])positional.push(...[...parts[1]].map((c,i)=>`${digits.indexOf(c)} × ${from}<sup>−${i+1}</sup>`));
 out.innerHTML=`<div class="kicker">CONVERSION RESULT</div>
 <h2 class="en conversion-answer">(${E(raw)})<sub>${from}</sub> ${approximate?'≈':'='} (${E(result)})<sub>${to}</sub></h2>
 <p><b>ধাপ ১: স্থানমান ব্যবহার করে Source যাচাই</b></p>
 <div class="conversion-steps en">${positional.join(' + ')}${negative?' · (−1)':''}</div>
 <p><b>ধাপ ২: Target Base-এ পূর্ণাংশের ভাগ</b></p>
 <div class="conversion-steps">${division.map(x=>`<div>${E(x)}</div>`).join('')}</div>
 ${parts[1]?`<p><b>ধাপ ৩: ভগ্নাংশের গুণ</b></p><div class="conversion-steps">${steps.map(x=>`<div>${E(x)}</div>`).join('')}</div>`:''}
 <p class="muted small">${approximate?'এই ভগ্নাংশের রূপান্তর ২৪ Digit-এ থামানো হয়েছে; তাই ≈ ব্যবহার করা হয়েছে।':'সব Digit নির্ভুল। Decimal-সহ Base-গুলোতে গণনা করা হয়েছে Exact Fraction দিয়ে।'}</p>`;
}
function trace(){const type=$('#traceType')?.value||'sum',n=Number($('#traceN')?.value),out=$('#traceResult');if(!Number.isInteger(n)||n<0||n>20){toast('N ০ থেকে ২০-এর পূর্ণসংখ্যা দাও।');return;}if($('#traceCode'))$('#traceCode').textContent=sourceCodes[type];let rows=[],result='';if(type==='sum'){let s=0;for(let i=1;i<=n;i++){s+=i;rows.push({i,sum:s});}result=`Sum = ${s}`;}else if(type==='fact'){let f=1n;rows.push({i:0,factorial:'1'});for(let i=1;i<=n;i++){f*=BigInt(i);rows.push({i,factorial:f.toString()});}result=`${n}! = ${f.toString()}`;}else if(type==='even'){rows=[{n,remainder:n%2}];result=n%2?'Odd':'Even';}else if(type==='prime'){let prime=n>=2;for(let i=2;i<=n/i;i++){rows.push({divisor:i,remainder:n%i});if(n%i===0){prime=false;break;}}result=prime?'Prime':'Not Prime';}else{let a=0,b=1,items=[];for(let i=0;i<n;i++){rows.push({step:i+1,term:a,next:b});items.push(a);const next=a+b;a=b;b=next;}result=items.join(', ')||'(কোনো Term নেই)';}if(out)out.innerHTML=`<div class="callout good"><div class="kicker">TRACE OUTPUT</div><h3>${E(result)}</h3><p class="muted small">পরিবর্তনশীলগুলোর মান প্রতিটি ধাপে কী হচ্ছে দেখো।</p></div><div class="tablewrap">${tableOf(rows)}</div>`;}

function runSql(){const txt=($('#sqlEditor')?.value||'').trim(),output=$('#sqlResult');if(!output)return;state.sqlEditor=txt;persist();const s=txt.replace(/;\s*$/,'').replace(/\s+/g,' ').trim();const m=s.match(/^SELECT\s+(.+?)\s+FROM\s+Students(?:\s+WHERE\s+(StudentID|Name|GPA|Department)\s*(>=|<=|<>|=|>|<)\s*('[^']*'|\d+(?:\.\d+)?))?(?:\s+ORDER BY\s+(StudentID|Name|GPA|Department)(?:\s+(ASC|DESC))?)?$/i);if(!m){output.innerHTML=`<b>এই Mini Lab-এ Query সমর্থিত নয়।</b><p>শুধু <code>SELECT columns FROM Students [WHERE column operator literal] [ORDER BY column ASC/DESC]</code> অথবা <code>COUNT(*)</code> চালানো যাবে। এটি সম্পূর্ণ SQL Engine নয়।</p>`;return;}let [,fields,field,op,value,order,way]=m;let rows=[...samples];if(field){const key=Object.keys(rows[0]).find(x=>x.toLowerCase()===field.toLowerCase());const v=value.startsWith("'")?value.slice(1,-1):Number(value);rows=rows.filter(r=>{const a=r[key],b=v;if(typeof a!==typeof b)return false;return op==='='?a===b:op==='<>'?a!==b:op==='>'?a>b:op==='<'?a<b:op==='>='?a>=b:a<=b;});}if(order){const key=Object.keys(rows[0]||samples[0]).find(x=>x.toLowerCase()===order.toLowerCase());rows.sort((a,b)=>((a[key]>b[key])?1:(a[key]<b[key]?-1:0))*(String(way).toUpperCase()==='DESC'?-1:1));}if(/^COUNT\(\*\)(?: AS \w+)?$/i.test(fields)){const alias=(fields.match(/ AS (\w+)/i)||[])[1]||'COUNT';rows=[{[alias]:rows.length}];}else if(fields.trim()!=='*'){const f=fields.split(',').map(x=>x.trim());const cols=Object.keys(samples[0]);if(!f.length||f.some(x=>!cols.some(k=>k.toLowerCase()===x.toLowerCase()))){output.textContent='শুধু বিদ্যমান Column Name ব্যবহার করো: '+cols.join(', ');return;}rows=rows.map(r=>Object.fromEntries(f.map(x=>{const actual=cols.find(k=>k.toLowerCase()===x.toLowerCase());return [actual,r[actual]]})));}output.innerHTML=`<h3>Query Result · ${rows.length} Row</h3><div class="tablewrap">${tableOf(rows)}</div><p class="muted small">এটি স্থানীয় Dataset-এর প্রদর্শন; আসল Database-এর Query Planner/SQL Dialect অনুকরণ করে না।</p>`;}

function renderReference(){return `<div class="kicker">PRINTABLE EXAM REFERENCE</div><h1>সূত্র, তুলনা ও পরীক্ষার চিটশিট</h1><p class="lead">৬টি অধ্যায়ের দ্রুত Revision। পাঠ না বুঝে এগুলো মুখস্থ করো না; প্রথমে বিস্তারিত পাঠে উদাহরণ সমাধান করো।</p><div class="row wrap" style="margin:18px 0"><button class="btn secondary" data-action="print">⎙ প্রিন্ট / Save PDF</button>${navButton('Number Lab','labs')}</div>${quickRefs.map(([title,items])=>`<div class="card pad" style="margin:15px 0"><h2>${E(title)}</h2><div class="tablewrap"><table><thead><tr><th style="width:30%">পরিভাষা / সূত্র</th><th>মনে রাখবে</th></tr></thead><tbody>${items.map(([k,v])=>`<tr><td><b>${E(k)}</b></td><td>${refText(v)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}`;}

function renderSources(){return `<div class="kicker">CURRICULUM · SOURCES · SCOPE</div><h1>সিলেবাস, নির্ভরযোগ্য সূত্র ও সীমাবদ্ধতা</h1><div class="card pad"><h2>২০২৮ ব্যাচের প্রেক্ষাপট</h2><p>২০২৬–২৭ শিক্ষাবর্ষের একাদশ শ্রেণির জন্য NCTB ২৮ সেপ্টেম্বর ২০২৬-এ বাংলা, ইংরেজি ও ICT পাঠ্যসূচি প্রকাশ করেছে—এটি ২০২৮ পরীক্ষার্থীদের জন্য প্রাসঙ্গিক। এই কোর্স ছয় অধ্যায়ের পরিচিত পাঠক্রমের ভিত্তিতে তৈরি। পরবর্তী সংশোধনী বা Board নির্দেশনা থাকলে তা প্রাধান্য পাবে।</p><p><a href="https://nctb.gov.bd/" target="_blank" rel="noopener noreferrer">জাতীয় শিক্ষাক্রম ও পাঠ্যপুস্তক বোর্ড — মূল ওয়েবসাইট ↗</a></p><p><a href="https://nctb.gov.bd/pages/static-pages/6922e145933eb65569e2b37b" target="_blank" rel="noopener noreferrer">NCTB একাদশ–দ্বাদশ শ্রেণির পাঠ্যপুস্তক তালিকা ↗</a></p><p><a href="https://www.prothomalo.com/education/admission/nhaq564e2o" target="_blank" rel="noopener noreferrer">২০২৬–২৭ পাঠ্যসূচি প্রকাশের প্রতিবেদন (প্রথম আলো) ↗</a></p><p><a href="https://hscict.vercel.app/bn/learn" target="_blank" rel="noopener noreferrer">বিস্তারিত টপিক তালিকা মিলিয়ে দেখার স্বাধীন রিসোর্স ↗</a></p></div><div class="card pad" style="margin-top:16px"><h2>এই কোর্স কী — এবং কী নয়</h2><p>সব পাঠ্যবস্তু মৌলিকভাবে লিখিত, NCTB-এর প্রকাশিত বইয়ের হুবহু প্রতিলিপি নয়। এতে ৭১টি ব্যাখ্যাসমৃদ্ধ পাঠ, ১৪২টি Drill Solution, ১২০টি নতুন ও পূর্ব-সংকলিত শিক্ষামূলক MCQ, ৩০টি মৌলিক/বোর্ড-ধাঁচের CQ এবং প্র্যাকটিস ল্যাব আছে।</p><p>এটি কোনো শিক্ষা বোর্ড, NCTB বা বিশেষ শিক্ষকের অনুমোদিত বই নয়। পরীক্ষার চূড়ান্ত মানবণ্টন, পাঠ্যসূচি, ব্যবহারিক পরীক্ষা এবং শিক্ষাপ্রতিষ্ঠানের নির্দেশনা অফিসিয়াল উৎসে যাচাই করতে হবে। অতিরিক্ত দীর্ঘ/বিশেষায়িত পাঠ, সব গত বছরের Board Question ও মূল বইয়ের সব চিত্রের পুনরুৎপাদন এখানে নেই; সেক্ষেত্রে মূল বই পড়া মূল্যবান।</p><p><b>শিক্ষণ-পদ্ধতি:</b> Concept → Worked Example → Common Mistake → Active Recall → CQ/MCQ → Timed Test → Error Review। ৫ দিনের Sprint প্রথম পরিচয়; ১৬ সপ্তাহের Mastery Plan গভীর প্রস্তুতির জন্য।</p><h3>আপনার তথ্য</h3><p>Core Lessons, Labs ও Question Bank Offline কাজ করে। Optional Google Fonts ও বাইরের Reference Link-এর জন্য Internet লাগতে পারে। কোনো Student Data Server-এ পাঠানো হয় না; নোট ও অগ্রগতি স্থানীয় Browser Storage-এ থাকে।</p></div>`;}
